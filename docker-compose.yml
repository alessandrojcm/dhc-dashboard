name: dhc-dashboard

services:
  # Persistent local development database. A plain `docker compose up -d`
  # starts this service on the port used by the Phoenix mise tasks.
  db:
    image: postgres:17
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - dhc_postgres_data:/var/lib/postgresql/data

  # Disposable testcontainers database. The dynamic host port and absence of
  # a named volume keep concurrent and repeated Phoenix test runs isolated.
  test-db:
    image: postgres:17
    profiles: ["testing"]
    ports:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 2s
      timeout: 5s
      retries: 10
    command: ["postgres", "-c", "log_min_messages=fatal"]

volumes:
  dhc_postgres_data:
