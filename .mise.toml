# mise configuration for dhc-dashboard
# https://mise.jdx.dev
#
# Run `mise tasks` to list all tasks.
# Run `mise run <task>` to execute one.
# Tool versions are pinned here — `mise install` sets up everything.

# ── Tool versions ──────────────────────────────────────────────
# Pin versions here so `mise install` gives everyone the same runtime.
# mise activates these on cd — no nvm/asdf shims required.

[tools]
node = "26"          # SvelteKit + Cloudflare Workers
erlang = "29"              # OTP 27 for Elixir
elixir = "1.20"   # Phoenix (mix.exs requires ~> 1.15), matched to OTP 27
pnpm = "11"      # must match packageManager in package.json
fnox = "latest"

# ── Environment ────────────────────────────────────────────────
# These vars are available in every task and via `mise exec`.

[env]
_.file = ".env"      # auto-load .env if it exists (no dotenv-cli needed)

# ── Tasks ──────────────────────────────────────────────────────
# Run with:  mise run <task>
# List with: mise tasks
#
# Replaces the Makefile. Task names with colons must be quoted in TOML.

# ── SvelteKit ─────────────────────────────────────

[tasks.dev]
description = "Start SvelteKit dev server"
dir = "apps/web"
run = "pnpm dev"

[tasks.build]
description = "Production build (SvelteKit)"
dir = "apps/web"
run = "pnpm build"

[tasks.check]
description = "Svelte type-check"
dir = "apps/web"
run = "pnpm check"

# ── Phoenix ────────────────────────────────────────

[tasks.phx-setup]
description = "Install Elixir deps, create DB, run migrations"
dir = "apps/phoenix"
run = "POSTGRES_HOST=localhost POSTGRES_PORT=54322 POSTGRES_PASSWORD=postgres mix setup"

[tasks.phx-server]
description = "Start Phoenix dev server (hot-reload on :4000)"
dir = "apps/phoenix"
run = "POSTGRES_HOST=localhost POSTGRES_PORT=54322 POSTGRES_PASSWORD=postgres mix phx.server"

[tasks.phx-console]
description = "Start IEx with Phoenix server"
dir = "apps/phoenix"
run = "POSTGRES_HOST=localhost POSTGRES_PORT=54322 POSTGRES_PASSWORD=postgres iex -S mix phx.server"

[tasks.phx-migrate]
description = "Run pending Ecto migrations"
dir = "apps/phoenix"
run = "POSTGRES_HOST=localhost POSTGRES_PORT=54322 POSTGRES_PASSWORD=postgres mix ecto.migrate"

[tasks.phx-rollback]
description = "Rollback last Ecto migration"
dir = "apps/phoenix"
run = "POSTGRES_HOST=localhost POSTGRES_PORT=54322 POSTGRES_PASSWORD=postgres mix ecto.rollback"

[tasks.phx-gen-migration]
description = "Generate a new Ecto migration (pass NAME arg)"
dir = "apps/phoenix"
run = "mix ecto.gen.migration $@"

[tasks.phx-test]
description = "Run Phoenix tests (creates DB, migrates, runs)"
dir = "apps/phoenix"
run = "mix test"

[tasks.phx-precommit]
description = "Full Phoenix check: compile + unlock + format + test"
dir = "apps/phoenix"
run = "POSTGRES_HOST=localhost POSTGRES_PORT=54322 POSTGRES_PASSWORD=postgres mix precommit"

[tasks.phx-format]
description = "Format Elixir files"
dir = "apps/phoenix"
run = "mix format"

[tasks."phx-fly-deploy"]
description = "Deploy the Phoenix API release to Fly.io"
run = "fly deploy --app ${FLY_APP:-dhc-dashboard} --depot"

[tasks.phx-format-check]
description = "Check Elixir formatting (CI)"
dir = "apps/phoenix"
run = "mix format --check-formatted"

# ── Structural lint (ast-grep) ─────────────────────
# Rules live in .ast-grep/rules/, config in sgconfig.yml at repo root.
# The LSP is wired in opencode.json; this task is for CI/precommit.

[tasks."ast-lint"]
description = "Run ast-grep structural lint rules (fails on violations)"
run = "ast-grep scan -c sgconfig.yml apps/phoenix/priv/repo/migrations/ apps/web/src/"

[tasks."ast-test"]
description = "Run ast-grep rule test fixtures"
run = "ast-grep test -c sgconfig.yml"

# ── API contract (replaces make api-gen) ───────────

[tasks.api-gen]
description = "Regenerate both sides of API contract (Phoenix stubs + TS client)"
run = [
    "cd apps/phoenix && mix gen.controllers",
    "pnpm --filter @dhc/api-client api:generate",
]

# ── Stripe API client ──────────────────────────────

[tasks."stripe-gen"]
description = "Download Stripe spec, trim to our operations, and regenerate typed Elixir client"
dir = "apps/phoenix"
run = "MIX_ENV=dev mix stripe.gen"

# ── Testing ────────────────────────────────────────

[tasks.test]
description = "Run all tests (unit + e2e)"
dir = "apps/web"
run = "pnpm test"

[tasks."test-unit"]
description = "Run Vitest unit tests"
dir = "apps/web"
run = "pnpm test:unit"

[tasks."test-browser"]
description = "Run Vitest browser component tests"
dir = "apps/web"
run = "pnpm test:browser --run"

[tasks."test-e2e"]
description = "Run Playwright e2e tests"
dir = "apps/web"
env = { API_BASE_URL = "http://127.0.0.1:4000/api", E2E_COMPOSE_PROJECT = "dhc-dashboard-e2e", E2E_HARNESS_KEY = "local-e2e-harness" }
run = "pnpm test:e2e"

[tasks."e2e-phoenix-server"]
description = "Start the Phoenix E2E server and disposable PostgreSQL database"
dir = "apps/phoenix"
env = { MIX_ENV = "test", MIX_BUILD_PATH = "_build/e2e", E2E_SERVER = "true", E2E_API_PORT = "4000", E2E_COMPOSE_PROJECT = "dhc-dashboard-e2e", E2E_HARNESS_KEY = "local-e2e-harness" }
run = "exec mix e2e.server"

[tasks."e2e-web-server"]
description = "Start SvelteKit for Playwright against the Phoenix E2E server"
dir = "apps/web"
env = { API_BASE_URL = "http://127.0.0.1:4000/api", E2E_SERVER = "true", CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE = "postgres://postgres:postgres@127.0.0.1:1/postgres" }
run = "exec pnpm dev"

# ── Linting & formatting ──────────────────────────

[tasks.lint]
description = "Lint frontend JS/TS/Svelte scripts with Oxlint"
dir = "apps/web"
run = "pnpm lint"

[tasks.format]
description = "Auto-format frontend files with Oxfmt"
dir = "apps/web"
run = "pnpm format"

[tasks."format-check"]
description = "Check formatting without writing (CI)"
dir = "apps/web"
run = "pnpm format:check"

# ── Seeds ─────────────────────────────────────────

[tasks."seed-committee"]
description = "Seed committee members from CSV"
dir = "apps/phoenix"
usage = '''
arg "[users]" help="CSV containing committee user data" default="../../scripts/users.csv"
'''
run = 'mix seed.committee_members "${usage_users?}"'

[tasks."seed-waitlist"]
description = "Seed waitlist entries"
dir = "apps/phoenix"
usage = '''
arg "[count]" help="Number of waitlist entries to seed" default="10"
'''
run = 'mix seed.waitlist "${usage_count?}"'

[tasks."seed-members"]
description = "Seed member records"
dir = "apps/phoenix"
usage = '''
arg "[count]" help="Number of members to seed" default="10"
'''
run = 'mix seed.members "${usage_count?}"'

[tasks."seed-workshops"]
description = "Seed workshop records with interest, registrations, and refunds"
dir = "apps/phoenix"
usage = '''
arg "[count]" help="Number of workshops to seed" default="5"
'''
run = 'mix seed.workshops "${usage_count?}"'

# ── Composed / CI tasks ───────────────────────────

[tasks.ci]
description = "Run full CI check (lint + format-check + type-check + unit tests)"
depends = ["lint", "format-check", "check", "test-unit"]
