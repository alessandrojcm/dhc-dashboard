id: elixir-inventory-repo-write-missing-optimistic-lock
language: elixir
severity: error
files:
  - apps/phoenix/lib/dhc/inventory/items.ex
  - apps/phoenix/lib/dhc/inventory/containers.ex
  - apps/phoenix/lib/dhc/inventory/categories.ex
rule:
  any:
    - all:
        - pattern: $VALUE |> Repo.$WRITE()
        - not:
            has:
              pattern: Ecto.Changeset.optimistic_lock(:lock_version)
              stopBy: end
    - all:
        - pattern: Repo.$WRITE($CHANGESET)
        - not:
            inside:
              pattern: $CHANGESET = Ecto.Changeset.optimistic_lock($VALUE, :lock_version)
              stopBy: end
    - all:
        - pattern: Ecto.Multi.$MULTI_WRITE($NAME, $CHANGESET)
        - not:
            inside:
              pattern: $CHANGESET = $VALUE |> $$$STEPS |> Ecto.Changeset.optimistic_lock(:lock_version)
              stopBy: end
constraints:
  WRITE:
    regex: "^(update|update!|delete|delete!)$"
  MULTI_WRITE:
    regex: "^(update|delete)$"
message: |
  ALE-266/ALE-267 inventory writes must use
  Ecto.Changeset.optimistic_lock(:lock_version) before Repo or Ecto.Multi writes.
