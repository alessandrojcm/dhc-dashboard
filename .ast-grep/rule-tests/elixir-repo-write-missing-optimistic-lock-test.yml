id: elixir-inventory-repo-write-missing-optimistic-lock
language: elixir
valid:
  - |
    item
    |> item_changeset(attrs)
    |> Ecto.Changeset.optimistic_lock(:lock_version)
    |> Repo.update()
  - |
    changeset = Ecto.Changeset.optimistic_lock(item, :lock_version)
    Repo.delete(changeset)
  - |
    changeset =
      item
      |> item_changeset(attrs)
      |> Ecto.Changeset.optimistic_lock(:lock_version)

    Ecto.Multi.new()
    |> Ecto.Multi.update(:item, changeset)
invalid:
  - |
    item
    |> item_changeset(attrs)
    |> Repo.update()
  - |
    changeset = Ecto.Changeset.change(item, attrs)
    Repo.delete(changeset)
  - |
    changeset = item_changeset(item, attrs)

    Ecto.Multi.new()
    |> Ecto.Multi.update(:item, changeset)
