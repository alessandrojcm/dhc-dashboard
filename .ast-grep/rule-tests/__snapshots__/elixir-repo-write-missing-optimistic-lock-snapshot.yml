id: elixir-repo-write-missing-optimistic-lock
snapshots:
  ? |
    def write_pause_until(id) do
      profile = Repo.get(MemberProfile, id)
      profile
      |> Ecto.Changeset.change(name: "new")
      |> Repo.update()
    end
  : labels:
    - source: |-
        profile
          |> Ecto.Changeset.change(name: "new")
          |> Repo.update()
      style: primary
      start: 71
      end: 137
    - source: 'Ecto.Changeset.change(name: "new")'
      style: secondary
      start: 84
      end: 118
  ? |
    profile
    |> Ecto.Changeset.change(name: "new")
    |> Repo.update()
  : labels:
    - source: |-
        profile
        |> Ecto.Changeset.change(name: "new")
        |> Repo.update()
      style: primary
      start: 0
      end: 62
