        - description
        - parentContainerId
        - parentContainer
        - childContainers
        - items
        - itemCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        parentContainerId:
          type: string
          format: uuid
          nullable: true
        parentContainer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        childContainers:
          type: array
          items:
