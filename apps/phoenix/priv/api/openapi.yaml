          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Workshop is not planned and cannot be published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/cancel:
    post:
      operationId: workshops.cancel
      tags:
        - Workshops
      summary: Cancel a published Workshop
      description: |
        Transitions a published Workshop to cancelled and creates a traceable
        refund attempt for every active paid registration. Workshop cancellation
        refunds are not subject to the member cancellation deadline. Individual
        Stripe failures are recorded as failed attempts and do not prevent the
        Workshop cancellation. Requires `workshop_coordinator`, `president`, or
        `admin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: Workshop cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopManagementResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Workshop is not published and cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/interest:
    post:
      operationId: workshops.toggleInterest
      tags:
        - Workshops
      summary: Toggle current member Workshop interest
      description: |
        Expresses interest in a planned Workshop when the authenticated member
        has not already done so, or withdraws their existing interest when they
        have. Phoenix derives the member id from the Supabase JWT `sub`; request
        bodies cannot choose another member.

        This preserves the existing member-facing toggle behavior: only planned
        Workshops accept interest, toggling is idempotent from the UI's point of
        view, and any authenticated member may use it. Published Workshops use
        registration instead of interest.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: Interest toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopInterestToggleResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Workshop is not planned and cannot accept interest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/registration/payment-intent:
    post:
      operationId: workshops.createRegistrationPaymentIntent
      tags:
        - Workshops
      summary: Create current member Workshop registration PaymentIntent
      description: |
        Creates a durable payment attempt and Stripe PaymentIntent for the
        authenticated member to register for a published Workshop. Phoenix
        derives both the member identity and amount from authoritative server
        data before calling Stripe.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopRegistrationPaymentIntentRequest"
      responses:
        "200":
          description: PaymentIntent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopRegistrationPaymentIntentResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Workshop is full or member already has an active registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Workshop is not published or request payload is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/registration/complete:
    post:
      operationId: workshops.completeRegistration
      tags:
        - Workshops
      summary: Complete current member Workshop registration
      description: |
        Completes the authenticated member's Workshop registration after Stripe
        confirms the PaymentIntent. The PaymentIntent must be succeeded and its
        metadata must match the requested Workshop and member. Completion is
        idempotent for the same PaymentIntent id. If capacity is exhausted after
        payment but before insert, Phoenix records a durable refund obligation
        and returns `409` indicating that compensation is pending.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopRegistrationCompleteRequest"
      responses:
        "201":
          description: Registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopRegistrationResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Workshop is full, the member is already registered, or payment was accepted and compensation is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Payment is incomplete or does not match this registration request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/registration:
    delete:
      operationId: workshops.cancelRegistration
      tags:
        - Workshops
      summary: Cancel current member Workshop registration
      description: |
        Cancels the authenticated member's active pending/confirmed Workshop
        registration. Phoenix evaluates refund eligibility server-side. Eligible
        paid registrations atomically create a durable Refund and Oban job, then
        transition to `refunded`; provider processing continues asynchronously.
        Ineligible registrations transition to `cancelled` without a refund.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: Registration cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopRegistrationCancelResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No active registration exists for the current member and Workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /workshops/{workshopId}/external-registration:
    get:
      operationId: workshops.externalRegistrationGate
      tags:
        - Workshops
      summary: Check whether a Workshop accepts external registration
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "200":
          description: External registration gate state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopExternalRegistrationGateResponse"

  /workshops/{workshopId}/external-registration/checkout-session:
    post:
      operationId: workshops.createExternalCheckoutSession
      tags:
        - Workshops
      summary: Create an embedded Stripe Checkout Session for an external attendee
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopExternalCheckoutSessionRequest"
      responses:
        "200":
          description: Embedded Checkout Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopExternalCheckoutSessionResponse"
        "404":
          description: Workshop is unavailable for external registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Workshop is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid return URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/external-registration/complete:
    post:
      operationId: workshops.completeExternalRegistration
      tags:
        - Workshops
      summary: Complete an external Workshop registration from Stripe Checkout
      description: |
        Validates the paid Checkout Session, upserts the external attendee by
        normalized email, and creates an idempotent confirmed registration tied
        to its durable payment attempt. If Registration cannot be created after
        valid payment, Phoenix records a durable refund obligation and returns
        `409` indicating that compensation is pending.
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopExternalRegistrationCompleteRequest"
      responses:
        "201":
          description: External registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopRegistrationResponse"
        "404":
          description: Workshop or Checkout Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Workshop is full or the attendee is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Payment is incomplete, mismatched, or missing attendee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/registrations/{registrationId}/refund:
    post:
      operationId: workshops.refundRegistration
      tags:
        - Workshops
      summary: Refund a Workshop registration
      description: |
        Explicit coordinator refund command. Phoenix enforces the Workshop's
        refund eligibility rules, creates the refund record before contacting
        Stripe, and records Stripe failures as failed attempts. Requires
        `workshop_coordinator`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopRefundRequest"
      responses:
        "201":
          description: Refund attempt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopRefundResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Workshop registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Registration is not eligible for a refund or the reason is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe refund request failed; the failed attempt remains traceable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/attendance:
    patch:
      operationId: workshops.updateAttendance
      tags:
        - Workshops
      summary: Atomically record Workshop attendee attendance
      description: |
        Records attendance for a batch of active Workshop attendees. Phoenix
        derives the marker from the authenticated coordinator JWT, accepts only
        pending/confirmed registrations belonging to this Workshop, and rejects
        the entire batch if any update is invalid. Attendance is available only
        once the Workshop has started. Requires `workshop_coordinator`,
        `president`, or `admin`; `beginners_coordinator` is not authorized.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopAttendanceUpdateRequest"
      responses:
        "200":
          description: Attendance batch applied atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopAttendanceUpdateResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Workshop has not started, the batch is invalid, or an update targets a non-active attendee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /beginners-workshops:
    get:
      operationId: beginnersWorkshops.list
      tags: [BeginnersWorkshops]
      summary: The Workshops list, upcoming first, then past and cancelled
      description: |
        Lock-free read model. Each row carries its stage, seat meter and
        alerts as Phoenix judges them now; the dashboard only displays them.
        Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Upcoming and past/cancelled Beginners' Workshops
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopListResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
    post:
      operationId: beginnersWorkshops.schedule
      tags: [BeginnersWorkshops]
      summary: Schedule one or several Beginners' Workshops in one go
      description: |
        All or nothing. A refusal names the workshop through dotted `fields`
        keys (`workshops.<index>.<field>`). Nothing is emailed. Requires
        `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopScheduleRequest"}
      responses:
        "201":
          description: The scheduled workshops, in request order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopScheduleResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "422": {$ref: "#/components/responses/BeginnersWorkshopInvalid"}
  /beginners-workshops/{id}/settings:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    put:
      operationId: beginnersWorkshops.updateSettings
      tags: [BeginnersWorkshops]
      summary: Change capacity, fee, Payment Cutoff, contact-from date or window length
      description: |
        Omitted fields keep their value. The Payment Cutoff must stay before
        the start; the contact-from date can change until Batch 1 has gone
        out; a new window length applies to later Batches only. Nothing is
        emailed and no Batch is triggered. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopSettingsRequest"}
      responses:
        "200":
          description: The updated workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopConflict"}
        "422": {$ref: "#/components/responses/BeginnersWorkshopInvalid"}
  /beginners-workshops/{id}/reschedule:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    post:
      operationId: beginnersWorkshops.reschedule
      tags: [BeginnersWorkshops]
      summary: Move a workshop's date, start time or venue
      description: |
        Any time before Attendance Finalisation; a pending Batch never
        blocks it. Omitted fields keep their value, and at least one of
        `date`, `startTime` and `venue` must change. The Payment Cutoff keeps
        its offset before the start unless `paymentCutoffDate` or
        `paymentCutoffTime` is given, and an open Batch window is brought
        forward to the new cutoff. While Batch 1 has not gone out, the
        contact-from date keeps its offset before the date unless
        `contactFromDate` is given (moved to today when the kept date would
        fall after the new cutoff date); afterwards it can't change.
        "Workshop rescheduled" is emailed to every open Intake, Pre-workshop
        info is sent again at the new cutoff, and the Staff are notified.
        Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopRescheduleRequest"}
      responses:
        "200":
          description: The rescheduled workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopConflict"}
        "422": {$ref: "#/components/responses/BeginnersWorkshopInvalid"}
  /beginners-workshops/{id}/console:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    get:
      operationId: beginnersWorkshops.console
      tags: [BeginnersWorkshops]
      summary: One workshop's coordinator console
      description: |
        Lock-free read model: the workshop row, the Batches sent, the pause
        state, the Next Batch preview (the live proposal — exactly who the
        automatic Batch pass would contact now — its size as capacity − paid,
        and when it goes out or that Batches are paused), the roster grouped
        by meaning and what needs attention. Requires
        `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The workshop console
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopConsoleResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
  /beginners-workshops/{id}/batches/pause:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    post:
      operationId: beginnersWorkshopBatches.pause
      tags: [BeginnersWorkshops]
      summary: Pause automatic Batches for a workshop
      description: |
        Stops new Batches only: an open window and people already contacted
        are untouched. Idempotent; records who paused and when. Allowed
        while the workshop is scheduled. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The workshop, with its stage
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopConflict"}
  /beginners-workshops/{id}/batches/resume:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    post:
      operationId: beginnersWorkshopBatches.resume
      tags: [BeginnersWorkshops]
      summary: Resume automatic Batches for a workshop
      description: |
        A Batch that is due goes out at the next sweep. Idempotent; records
        who resumed and when. Allowed while the workshop is scheduled.
        Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The workshop, with its stage
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopConflict"}
  /beginners-workshops/{id}/staff:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    put:
      operationId: beginnersWorkshops.setStaff
      tags: [BeginnersWorkshops]
      summary: Replace a workshop's Staff (one coach and any assistants)
      description: |
        Replaces the whole Staff list. The coach must hold the coach role at
        assignment (`not_a_coach`); assistants must be active Members
        (`not_a_member`); a person picked as coach is removed from the
        assistants. Someone kept in the same role is not checked again, so a
        coach whose coach role was removed keeps the assignment. Access
        follows immediately. The people added and removed get an in-app
        Notification (also by Web Push); no attendee is emailed. Refused
        after Attendance Finalisation. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopStaffRequest"}
      responses:
        "200":
          description: The workshop with its new Staff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopConflict"}
        "422": {$ref: "#/components/responses/BeginnersWorkshopInvalid"}
  /beginners-workshops/{id}/fast-track/candidates:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    get:
      operationId: beginnersWorkshopFastTrack.candidates
      tags: [BeginnersWorkshops]
      summary: Search the people Fast-track may place
      description: |
        Waiting people and people removed within the 3-month retention
        window, without an open Intake, matching `q` against first name,
        last name and email; oldest priority first, at most 20. Lock-free;
        `fast_track` decides again under the lock. Requires
        `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The candidates
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackCandidatesResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
  /beginners-workshops/{id}/refunds/{refundId}/retry:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopRefundId"
    post:
      operationId: beginnersWorkshopRefunds.retry
      tags: [BeginnersWorkshops]
      summary: Retry a failed refund
      description: |
        Requests a new Stripe refund of the same full amount against the same
        payment, under a new idempotency key; the failed refund stays as
        history. A failed refund is followed up once (Retry or Record manual
        refund). No email is sent. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      responses:
        "201":
          description: The new refund, pending submission to Stripe
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopRefundResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Refund not found in this workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The refund has not failed, or was already followed up
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopRefundConflictError"}
  /beginners-workshops/{id}/refunds/{refundId}/manual:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopRefundId"
    post:
      operationId: beginnersWorkshopRefunds.recordManual
      tags: [BeginnersWorkshops]
      summary: Record a manual refund for a failed refund
      description: |
        Records that the coordinator paid the person back outside Stripe: a
        `completed` refund with method `manual` that follows the failed one.
        No email is sent. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopManualRefundRequest"}
      responses:
        "201":
          description: The manual refund
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopRefundResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Refund not found in this workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The refund has not failed, or was already followed up
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopRefundConflictError"}
        "422":
          description: Invalid note
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}
  /beginners-workshops/{id}/fast-track:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    post:
      operationId: beginnersWorkshopFastTrack.waitlistPerson
      tags: [BeginnersWorkshops]
      summary: Fast-track a Waitlist person into a workshop
      description: |
        Places a `waiting` person, or a `removed` person within retention
        (restored to `waiting` with their original priority), outside Batch
        order: a `contacted` Intake with origin `fast_track` and the Contact
        email, whose `{{windowEnd}}` is the Payment Cutoff. They pay the fee
        like everyone else. Refused with `open_intake`, `not_eligible`
        (attended, invited, joined, or removed too long ago) and
        `after_cutoff`. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackRequest"}
      responses:
        "201":
          description: The fast-tracked Intake
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Beginners' Workshop or Waitlist person not found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The person or the workshop cannot take a Fast-track
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackConflictError"}
  /beginners-workshops/{id}/fast-track/new-person:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    post:
      operationId: beginnersWorkshopFastTrack.newPerson
      tags: [BeginnersWorkshops]
      summary: Add a new person to the Waitlist and fast-track them
      description: |
        The staff "add a new person" path (works while public registration
        is closed; priority = now), then the same Fast-track, in one
        transaction. The body is the public registration body. Refused with
        a visible reason when the email is on the Waitlist
        (`email_on_waitlist`), belongs to a Member or former Member
        (`email_is_principal`) or has a pending Invitation
        (`email_has_pending_invitation`), and with `after_cutoff`. Requires
        `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaitlistEntryCreateRequest"}
      responses:
        "201":
          description: The fast-tracked Intake
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409":
          description: The email or the workshop cannot take a Fast-track
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackConflictError"}
        "422":
          description: Invalid registration details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackInvalidError"}
  /beginners-workshops/staff-candidates:
    get:
      operationId: beginnersWorkshops.staffCandidates
      tags: [BeginnersWorkshops]
      summary: Every active Member the Staff dialog may pick, coaches marked
      description: |
        Sorted by name. `coach` marks who may be assigned as coach; every
        candidate may be an assistant. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The Staff candidates
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopStaffCandidatesResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
  /beginners-workshops/mine:
    get:
      operationId: beginnersWorkshopAssignments.list
      tags: [BeginnersWorkshops]
      summary: My Beginners' Workshops — the caller's upcoming and same-day Staff assignments
      description: |
        Upcoming scheduled workshops and any non-cancelled workshop today on
        whose Staff the caller is, soonest first. Requires
        `beginners.workshops.assigned.read` (every member).
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The caller's assignments
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopAssignmentListResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopAssignedForbidden"}
  /beginners-workshops/{id}/door:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    get:
      operationId: beginnersWorkshopDoor.show
      tags: [BeginnersWorkshops]
      summary: A workshop's door view
      description: |
        The door view's own closed shape (never email, payment, refund or
        Waitlist history). `beginners.workshops.run` is assignment-scoped:
        the workshop's Staff and the managers see it, and anyone else gets
        the same 404 as an unknown workshop. Requires
        `beginners.workshops.assigned.read` to reach.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The door view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopDoorResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopAssignedForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
  /beginners-workshops/{id}/door/people/{intakeId}/check-in:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopIntakeId"
    post:
      operationId: beginnersWorkshopDoor.checkIn
      tags: [BeginnersWorkshops]
      summary: Check a paid person in at the door
      description: |
        Records who checked the person in and when (kept even if that Staff
        member is later unassigned). Only a `paid` Intake (no walk-ins), and
        only inside the check-in window: from 1 hour before the start on the
        workshop date until Attendance Finalisation or the end of that
        Dublin day. Idempotent: an existing check-in is kept. Requires the
        assignment-scoped `beginners.workshops.run`; anyone else gets the
        same 404 as an unknown workshop. Answers the refreshed door view.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The door view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopDoorResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopAssignedForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopCheckInConflict"}
    delete:
      operationId: beginnersWorkshopDoor.undoCheckIn
      tags: [BeginnersWorkshops]
      summary: Undo a door check-in
      description: |
        Clears the person's check-in, under the same rules as check-in.
        Idempotent. Answers the refreshed door view.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The door view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopDoorResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopAssignedForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopCheckInConflict"}
  /beginners-workshops/{id}/door/finish:
    parameters: [{$ref: "#/components/parameters/BeginnersWorkshopId"}]
    post:
      operationId: beginnersWorkshopDoor.finish
      tags: [BeginnersWorkshops]
      summary: Finish the workshop (Attendance Finalisation)
      description: |
        Attendance Finalisation from the door, once check-in has opened.
        Checked-in `paid` Intakes become `attended` (standing `attended`)
        and the rest `no_show` (standing `removed`, no email); any Intake
        still `contacted` is settled by the Payment Cutoff rule. Check-in
        closes and the Staff list is frozen as the permanent record of who
        ran the workshop. Refused while someone is still in checkout
        (`payment_in_progress`). Requires the assignment-scoped
        `beginners.workshops.run`; anyone else gets the same 404 as an
        unknown workshop. Answers the refreshed door view, carrying the
        finalised summary.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The door view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopDoorResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopAssignedForbidden"}
        "404": {$ref: "#/components/responses/BeginnersWorkshopNotFound"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopFinishConflict"}
  /beginners-workshops/invitable:
    get:
      operationId: beginnersWorkshopInvitations.invitable
      tags: [BeginnersWorkshops]
      summary: Everyone Invitable, across workshops
      description: |
        Everyone whose Waitlist standing is `attended`, with the attended
        Intake to invite from (the latest one), that workshop's date and
        whether its Follow-up has gone out. A person leaves the list once
        invited and returns if that Invitation is deleted. Oldest workshop
        first. Requires `members.invite`.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: The Invitable people
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvitableResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
  /beginners-workshops/{id}/intakes/{intakeId}/invite:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopIntakeId"
    post:
      operationId: beginnersWorkshopInvitations.invite
      tags: [BeginnersWorkshops]
      summary: Send an attended person their Invitation
      description: |
        One click, one person. Requires the workshop to be finalised, the
        Intake `attended` and the standing `attended`; the Follow-up does
        not need to have gone out. Issues the standard-tier, 7-day
        Invitation (the `inviteMember` email) for the person's Waitlist
        profile and moves their standing to `invited`, in one transaction.
        Refused with `not_finalised`, `not_attended`, `already_invited`,
        `already_joined`, `not_invitable`, `email_is_principal`,
        `email_has_pending_invitation` (409) or `incomplete_details` (422).
        Resend and delete the Invitation from the Invitations table;
        deleting it makes the person Invitable again. Requires
        `members.invite`.
      security: [{cookieSession: []}]
      responses:
        "201":
          description: The Invitation was issued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvitationResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Beginners' Workshop, Intake or Waitlist person not found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: The person cannot be invited
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInviteConflictError"}
        "422":
          description: The person's Waitlist details are incomplete
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInviteInvalidError"}
  /beginners-workshops/{id}/intakes/{intakeId}/decline:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopIntakeId"
    post:
      operationId: beginnersWorkshopIntakes.decline
      tags: [BeginnersWorkshops]
      summary: Decline a contacted Intake
      description: |
        The person said "not this one": the `contacted` Intake becomes
        `declined`, the person stays on the Waitlist as `waiting` with their
        original priority, and "Declined" is queued. A live Seat Hold
        becomes `releasing`; a payment that completes anyway is refunded in
        full automatically. Repeating it on a `declined` Intake answers
        `already_done` and does nothing again.
        The optional note is recorded in the Intake's history with who ran
        the command and when. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandRequest"}
      responses:
        "200":
          description: The Intake after the command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Intake not found in this workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopIntakeCommandConflict"}
        "422":
          description: Invalid note
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}
  /beginners-workshops/{id}/intakes/{intakeId}/resend-link:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopIntakeId"
    post:
      operationId: beginnersWorkshopIntakes.resendLink
      tags: [BeginnersWorkshops]
      summary: Resend an Intake's link
      description: |
        Sends the person's own email again: "Contact – pay" while the
        Intake is `contacted`, "Place confirmed" once it is `paid`, with the
        same link. Open Intakes only (`intake_closed`).
        The optional note is recorded in the Intake's history with who ran
        the command and when. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandRequest"}
      responses:
        "200":
          description: The Intake after the command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Intake not found in this workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopIntakeCommandConflict"}
        "422":
          description: Invalid note
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}
  /beginners-workshops/{id}/intakes/{intakeId}/rotate-link:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopIntakeId"
    post:
      operationId: beginnersWorkshopIntakes.rotateLink
      tags: [BeginnersWorkshops]
      summary: Rotate an Intake's link
      description: |
        Increments the link generation, so the old link no longer works
        (its page says "no longer active"), and sends the same email as
        Resend link with the new one. Open Intakes only (`intake_closed`).
        The optional note is recorded in the Intake's history with who ran
        the command and when. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandRequest"}
      responses:
        "200":
          description: The Intake after the command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Intake not found in this workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopIntakeCommandConflict"}
        "422":
          description: Invalid note
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}

  /beginners-workshops/{id}/intakes/{intakeId}/cancel-with-refund:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopIntakeId"
    post:
      operationId: beginnersWorkshopIntakes.cancelWithRefund
      tags: [BeginnersWorkshops]
      summary: Cancel a paid Intake with a full refund
      description: |
        The person wants their money back: the Stripe-paid `paid` Intake
        becomes `cancelled_refunded`, its seat is free at once, a full
        refund of what the payment took is requested, the person goes back
        to `waiting` with their original priority, and "Cancelled with
        refund" is queued. Repeating it answers `already_done`.
        Refused: `intake_not_paid` (contacted), `carried_fee_paid` (paid
        with a Carried Fee), `intake_closed`, `nothing_to_refund`,
        `already_requested`.
        The optional note is recorded in the Intake's history with who ran
        the command and when. Requires `beginners.workshops.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandRequest"}
      responses:
        "200":
          description: The Intake after the command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Intake not found in this workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopIntakeCommandConflict"}
        "422":
          description: Invalid note
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}
  /beginners-workshops/{id}/intakes/{intakeId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopId"
      - $ref: "#/components/parameters/BeginnersWorkshopIntakeId"
    post:
      operationId: beginnersWorkshopIntakes.withdraw
      tags: [BeginnersWorkshops]
      summary: Withdraw an Intake's person from the Waitlist
      description: |
        The person asks to leave: their standing becomes `removed`. A
        `contacted` Intake becomes `declined` (a live Seat Hold stops
        counting) and nobody is emailed. A Stripe-paid `paid` Intake becomes
        `withdrawn` and its seat is free at once; `refund` is then required
        (`refund_choice_required`): `true` requests a full refund and
        queues "Withdrawn – refunded", `false` forfeits the fee and queues
        "Withdrawn – forfeited". Repeating it on a `withdrawn` Intake
        answers `already_done`. Refused: `carried_fee_paid`,
        `intake_closed`, `already_invited`, `nothing_to_refund`.
        The optional note is recorded in the Intake's history with who ran
        the command and when. Requires `beginners.waitlist.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopWithdrawRequest"}
      responses:
        "200":
          description: The Intake after the command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Intake not found in this workshop
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopIntakeCommandConflict"}
        "422":
          description: Invalid note, or the refund-or-forfeit choice missing or invalid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}
  /beginners-workshops/people/{waitlistId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/BeginnersWorkshopWaitlistId"
    post:
      operationId: beginnersWorkshopIntakes.withdrawPerson
      tags: [BeginnersWorkshops]
      summary: Withdraw a person from the Waitlist (Waitlist tab)
      description: |
        The Waitlist tab's Withdraw. With an open Intake it is exactly
        `beginnersWorkshopIntakes.withdraw` on that Intake (same rule,
        history and refund choice); without one only the standing becomes
        `removed` and nobody is emailed. Repeating it on a removed person
        answers `already_done`. `refund` is ignored when no paid Intake
        exists. Refused: `person_not_found`, `already_invited`,
        `carried_fee_paid`, `nothing_to_refund`.
        Requires `beginners.waitlist.manage`.
      security: [{cookieSession: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BeginnersWorkshopWithdrawRequest"}
      responses:
        "200":
          description: The person after the withdraw
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopWithdrawPersonResponse"}
        "401": {$ref: "#/components/responses/BeginnersWorkshopUnauthorized"}
        "403": {$ref: "#/components/responses/BeginnersWorkshopForbidden"}
        "404":
          description: Waitlist person not found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/BeginnersWorkshopIntakeCommandConflict"}
        "422":
          description: Invalid note, or the refund-or-forfeit choice missing or invalid
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}

  /beginners/intake/{token}:
    parameters: [{$ref: "#/components/parameters/BeginnersIntakeToken"}]
    get:
      operationId: beginnersWorkshopIntake.show
      tags: [BeginnersWorkshops]
      summary: The person's Intake page behind an Intake link
      description: |
        Public: the token in the path is the capability (no login, no
        verification). Answers a closed safe view whose `state` is the
        discriminator: `pay | payment_in_progress | full | paid | closed`.
        It carries the first name, the workshop date, start time and venue,
        the fee and one action, never an id or a Stripe object; an inactive
        Intake's page carries none of them. An unknown link is 404, which
        the page shows like a closed Intake. Every response sends
        `Referrer-Policy: no-referrer`, and logs and Sentry redact the token.
      security: []
      responses:
        "200":
          description: The Intake page
          headers:
            Referrer-Policy: {$ref: "#/components/headers/NoReferrer"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersIntakePageResponse"}
        "404": {$ref: "#/components/responses/BeginnersIntakeNotFound"}
  /beginners/intake/{token}/payment:
    parameters: [{$ref: "#/components/parameters/BeginnersIntakeToken"}]
    post:
      operationId: beginnersWorkshopIntake.startPayment
      tags: [BeginnersWorkshops]
      summary: Take a Seat Hold and get the Stripe Checkout URL
      description: |
        Takes a 30-minute Seat Hold under the workshop lock (an open payment
        row with the fee frozen) and creates the hosted Checkout Session;
        while the person's hold is live it answers the same session again.
        Refused with `full` when every seat is paid or held, `after_cutoff`
        after the Payment Cutoff, `already_paid`, `intake_closed`, or
        `payment_in_progress` when the hold ran out and Stripe has not ended
        it yet. `success_url` and `cancel_url` return to the same Intake
        link. 503 when Stripe is unavailable (try again).
      security: []
      responses:
        "200":
          description: Where to send the person (Stripe Checkout)
          headers:
            Referrer-Policy: {$ref: "#/components/headers/NoReferrer"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BeginnersIntakeCheckoutResponse"}
        "404": {$ref: "#/components/responses/BeginnersIntakeNotFound"}
        "409": {$ref: "#/components/responses/BeginnersIntakeConflict"}
        "503": {$ref: "#/components/responses/BeginnersIntakeUnavailable"}
  /beginners/intake/{token}/return:
    parameters: [{$ref: "#/components/parameters/BeginnersIntakeToken"}]
    post:
      operationId: beginnersWorkshopIntake.returnFromCheckout
      tags: [BeginnersWorkshops]
      summary: The Checkout success return — complete the payment, then show the page
      description: |
        Retrieves the Checkout Session server-side and completes the payment
        (idempotent; the webhook may have done it already), then answers the
        Intake page. While that session's hold is still open the page is
