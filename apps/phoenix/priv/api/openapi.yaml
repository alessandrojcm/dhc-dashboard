          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanValidationError"

  /inventory/catalog/items:
    get:
      operationId: inventoryCatalog.listItems
      tags:
        - Inventory
      summary: Browse the member catalog
      description: |
        The member-facing catalog: cursor-paginated, non-archived Items with
        the derived label, the immutable slug, the Category, typed property
        values, and a **generic** availability reason.

        This is not a role variant of the operator item viewer. It is a
        different read model, and deliberately cannot express the operator
        one: there is no Container, no operator notes, no Maintenance detail,
        and no borrower — availability never discloses who holds an Item.
        There is also no archive filter; retirement is an operator concern.
        A member's own retained Loan history keeps showing archived Items
        through its snapshots.

        Search (`q`) covers the derived label through its ingredients: the
        immutable slug, the Category name, and the property values the label
        is built from (the label is derived, never stored). Filters:
        `categoryId` (comma-separated), `property` (comma-separated
        `definitionId:value` pairs, OR within one definition and AND across
        definitions), and `availability` (`all`/`available`/`unavailable`,
        default `all`) over the same open-maintenance and
        approved/checked-out-loan facts the displayed reason is projected
        from. Container is intentionally not a member filter.

        Ordering is by `slug` with an `id` tie-break, so page boundaries are
        stable under concurrent edits. `totalCount` is exact. Cursors are
        opaque and bind to limit, direction, search, and every filter; a
        cursor replayed against a different query returns `400`.

        Requires any authenticated Phoenix session. An inactive Member cannot
        hold a session at all, so they have no catalog access.
      security:
        - cookieSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Opaque cursor from a previous response. Binds to limit,
            direction, search, and every filter; a mismatched cursor
            returns 400.
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Slug ordering direction.
        - name: q
          in: query
          schema:
            type: string
          description: |
            Free-text search over the slug, Category name, and property
            values — the ingredients of the derived label. Empty or
            whitespace means no search.
        - name: categoryId
          in: query
          schema:
            type: string
          description: |
            Comma-separated category ids. Absent or empty returns all
            categories.
        - name: property
          in: query
          schema:
            type: string
          description: |
            Comma-separated `definitionId:value` pairs. Values of the same
            definition are ORed; separate definitions are ANDed. A value
            matches an option id, boolean, decimal, or (case-insensitive)
            text. Decimals compare numerically, so `1` matches a stored
            `1.0`; a value that is not a decimal on a decimal definition is
            an invalid property filter and returns `400`.
        - name: availability
          in: query
          schema:
            type: string
            enum: [all, available, unavailable]
            default: all
          description: |
            Member-actionable availability filter over the same projection
            the catalog displays: `available` narrows to requestable items,
            `unavailable` to items held by an approved/checked-out loan or an
            open maintenance period, `all` (default) returns both. A pending
            request never makes an item unavailable. There is no archive
            filter; archived items stay out of the catalog entirely.
      responses:
        "200":
          description: Cursor-paginated member catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCatalogItemListResponse"
        "400":
          description: |
            Invalid query parameter or mismatched cursor. An invalid
            `property` filter — a malformed `definitionId:value` pair, or a
            non-decimal value for a decimal definition — answers
            `property must be comma-separated definitionId:value pairs`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/catalog/items/{slugOrId}:
    get:
      operationId: inventoryCatalog.showItem
      tags:
        - Inventory
      summary: Get one member catalog item by slug or id
      description: |
        Resolves one non-archived Item into the member shape, by its
        immutable slug (`item-000001`) or its id. This is the detail behind
        the mobile browse-and-request sheet.

        An archived Item answers `404` rather than a distinct reason: to a
        Member it simply is not in the catalog, and reporting "archived"
        would disclose an operator fact about an Item they cannot see.

        Requires any authenticated Phoenix session.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      responses:
        "200":
          description: The catalog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCatalogItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No non-archived item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/catalog/items/{slugOrId}/requests:
    post:
      operationId: inventoryCatalog.requestLoan
      tags:
        - Inventory
      summary: Request an available catalog item
      description: |
        Submits a Loan request for the **calling** Member. There is no
        borrower field: a Member may only ever request for themselves, and an
        operator wanting to borrow does so as a Member under exactly these
        rules.

        `startsOn` and `dueOn` are calendar dates in `Europe/Dublin`; both
        must be today or later with `dueOn` on or after `startsOn`. A
        request creates **no** queue, reservation, or entitlement: competing
        requests coexist while the Item stays available, and approval is the
        single decision point. A Member may hold at most one pending request
        per Item, but any number across different Items.

        An Item that is in Maintenance or held by an approved/checked-out
        Loan answers `409 item_unavailable` — a generic reason that never
        discloses a borrower, a date, or a Maintenance note. An archived or
        unknown Item answers `404`.

        Requires any authenticated Phoenix session.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryLoanRequestRequest"
      responses:
        "201":
          description: The created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No non-archived item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The item is not requestable (`item_unavailable`), or the member
            already has a pending request for it (`duplicate_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanConflictError"
        "422":
          description: Invalid dates or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanValidationError"

  /inventory/loans/mine:
    get:
      operationId: inventoryMemberLoans.list
      tags:
        - Inventory
      summary: List the calling member's own loans
      description: |
        The Member's complete Loan history, newest first — including
        rejected and cancelled requests with their notes, so the record is
        whole rather than only the currently interesting rows.

        Every Item reference is the retained snapshot captured at request
        time (`itemSlug`, `itemLabel`), not a live Item read, so an archived
        Item does not rot the history. `containerPath` is present only from
        approval onward: that is the one flow entitled to the Item's
        location.

        This operation returns **only** the caller's own Loans. Other
        Members' Loans and borrower identities are never reachable here; the
        operator Loan queue is a separate operation.

        Requires any authenticated Phoenix session.
      security:
        - cookieSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Opaque cursor from a previous response. Binds to limit,
            direction, and the status filter; a mismatched cursor
            returns 400.
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: |
            Ordering on the Loan's immutable creation time. Defaults to
            `desc` — newest first is how a history is read.
        - name: status
          in: query
          schema:
            type: string
            enum: [all, open, closed]
            default: all
          description: |
            `open` narrows to requested/approved/checked-out obligations the
            Member can still act on, `closed` to
            rejected/cancelled/returned records, `all` (default) returns the
            complete history.
      responses:
        "200":
          description: The member's own loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/loans/mine/{loanId}:
    get:
      operationId: inventoryMemberLoans.show
      tags:
        - Inventory
      summary: Get one of the calling member's own loans
      description: |
        The Loan detail behind the mobile collection flow: approved dates
        and, once approved, the Item's Container path so the Member can
        collect it without a second lookup.

        A Loan belonging to another Member answers `404`: whether someone
        else's Loan exists is not a Member-visible fact.

        Requires any authenticated Phoenix session.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "200":
          description: The loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no loan with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/loans/mine/{loanId}/cancel:
    post:
      operationId: inventoryMemberLoans.cancel
      tags:
        - Inventory
      summary: Cancel one of the calling member's own loans
      description: |
        Cancels the Member's own `requested` or `approved` Loan and releases
        the Item immediately. After checkout the Member physically holds the
        Item, so release is the operator's return command, and a
        checked-out or already-closed Loan answers `409 not_cancellable`.

        Cancelling an already-cancelled Loan is a no-op, so a repeated tap on
        a mobile button is not an error. A Loan belonging to another Member
        answers `404`.

        Requires any authenticated Phoenix session.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryLoanCancelRequest"
      responses:
        "200":
          description: The cancelled loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The caller has no loan with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The loan is checked out or already closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanConflictError"
        "422":
          description: Invalid note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMemberLoanValidationError"

  /inventory/containers/{id}/move:
    post:
      operationId: inventoryContainers.move
      tags:
        - Inventory
      summary: Move a container
      description: |
        Dedicated move command. Relocates the container and its whole
        subtree under a new parent (or to the root). Rejects a
        self/descendant parent and an archived parent.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryContainerMoveRequest"
      responses:
        "200":
          description: The moved container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: parentContainerId would create a cycle or is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers/{id}/archive:
    post:
      operationId: inventoryContainers.archive
      tags:
        - Inventory
      summary: Archive a container
      description: |
        Archives a container. Active child containers and items must be
        moved, archived, or deleted first — the command never cascades.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "200":
          description: The archived container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The container still has active child containers or items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers/{id}/restore:
    post:
      operationId: inventoryContainers.restore
      tags:
        - Inventory
      summary: Restore an archived container
      description: |
        Restores an archived container. The parent chain must be active.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "200":
          description: The restored container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: parentContainerId must refer to an active container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers:
    get:
      operationId: inventoryContainers.index
      tags:
        - Inventory
      summary: List inventory containers
      description: |
        Returns inventory containers as a flat list ordered by name, each
        annotated with its `itemCount` (the number of `inventory_items` rows
        directly in it) and a `parentContainer` summary (`{id, name}` or null).
        The UI rebuilds the parent/child hierarchy client-side from
        `parentContainerId`.

        Requires a valid Phoenix session (any authenticated member).
      security:
        - cookieSession: []
      responses:
        "200":
          description: Inventory containers ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryContainers.create
      tags:
        - Inventory
      summary: Create an inventory container
      description: |
        Creates a new inventory container. Optionally nest it under a parent
        container via `parentContainerId`. `createdBy` is derived from the
        authenticated Phoenix session principal.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryContainerCreateRequest"
      responses:
        "201":
          description: The created container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid container payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers/{id}:
    get:
      operationId: inventoryContainers.show
      tags:
        - Inventory
      summary: Get one inventory container with relations
      description: |
        Returns a single inventory container by id with its `parentContainer`
        summary, `childContainers` (`[{id, name}]`), and the `items` directly
        in it — each item carrying a `category` summary (`{id, name}`) and
        `quantity`/`outForMaintenance`. Item-level history is not embedded.

        Requires a valid Phoenix session (any authenticated member).
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "200":
          description: The inventory container with relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerDetailResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryContainers.update
      tags:
        - Inventory
      summary: Update an inventory container
      description: |
        Updates a single inventory container. Accepts the same writable
        fields as create (`name`, `description`, `parentContainerId`).

        Setting `parentContainerId` to the container itself or one of its
        descendants is rejected with `422` (circular-parent prevention); the
        UI also filters available parents client-side, but the server enforces
        the invariant for safety.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryContainerCreateRequest"
      responses:
        "200":
          description: The updated container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid payload, or `parentContainerId` would create a cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: inventoryContainers.delete
      tags:
        - Inventory
      summary: Delete an inventory container
      description: |
        Deletes an inventory container. The delete is rejected with `409` when
        the container still directly contains inventory items; remove or move
        those items first. Child containers cascade-delete per the
        `containers.parent_container_id` `on_delete: :delete_all` foreign key;
        a child that itself holds items will surface as `409` via that cascade.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "204":
          description: The container was deleted
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The container still contains inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings/{key}:
    patch:
      operationId: settings.update
      tags:
        - Settings
      summary: Update one allowlisted generic setting
      description: |
        Updates a single allowlisted generic setting by key. The request body
        is `{ "value": ... }` where the value type depends on the key:

        - `hema_insurance_form_link`: non-empty http/https URL string
        - `subscription_max_pause_months`: integer, valid range 1..24
        - `subscription_min_pause_days`: integer, valid range 1..365

        Unknown or non-allowlisted keys return `404`. Invalid values return
        `422`. The `type` column is not part of the public contract.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `committee_coordinator`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The setting key (must be allowlisted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: The updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsUpdateResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a settings admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or non-allowlisted setting key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid value for the given key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/magic-link:
    post:
      operationId: authSession.requestMagicLink
      tags:
        - AuthSession
      summary: Request a magic-link sign-in email
      description: |
        Enqueues a magic-link email to the Principal with the given email, if
        any. Non-enumerating: always returns `200 {"data":{"sent":true}}` for a
        well-formed email whether or not a Principal exists. Rate-limited to
        3 requests per email per 15 minutes and 10 per IP per hour; over-the-
        limit requests return the same `200` body (the plug halts before the
        controller). Replaces the Supabase `signInWithOtp` browser
        path with this endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Magic link requested (or rate-limited with the same body)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - sent
                    properties:
                      sent:
                        type: boolean
                        description: Always `true`.

  /auth/magic-link/verify:
    post:
      operationId: authSession.verifyMagicLink
      tags:
        - AuthSession
      summary: Consume a magic link and establish a session
      description: |
        Verifies the magic-link token, creates a DB-backed session, and sets
        the signed `_dhc_session` cookie. Returns the session projection. An
        invalid, expired, or reused token returns `401` with the same generic
        body (non-enumerating). A valid token for an inactive Principal is
        consumed but returns `403` with a clear membership message and creates
        no session. The dashboard magic-link landing page routes here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: URL-safe Base64-encoded magic-link token.
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionProjection"
        "401":
          description: Invalid, expired, or reused token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Valid token for an inactive Principal; no session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/discord/link:
    get:
      operationId: authSession.linkDiscord
      tags:
        - AuthSession
      summary: Start authenticated Discord identity linking
      description: |
        Starts Discord OAuth for the currently authenticated Principal. The
        initiating Phoenix Session is bound to the OAuth flow and revalidated
        on callback before the Discord identity is linked. Discord email is
        retained as metadata and need not match the Principal email.
      security:
        - cookieSession: []
      responses:
        "302":
          description: Redirect to Discord authorization
        "401":
          description: Missing, expired, or inactive session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/session:
    get:
      operationId: authSession.showSession
      tags:
        - AuthSession
      summary: Read the current session projection
      description: |
        Returns `{ principal: { id, email }, roles, capabilities }` for the session carried
        by the `_dhc_session` cookie. Used by SvelteKit SSR and the browser
        to read who is signed in. Returns `401` when there is no valid,
        active session. The dashboard consumes this instead of the
        Supabase `getSession()` projection.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Current session projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionProjection"
        "401":
          description: Missing, expired, or inactive session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: authSession.deleteSession
      tags:
        - AuthSession
      summary: Sign out the current device
      description: |
        Revokes the current session token and clears the `_dhc_session`
        cookie. Idempotent. Replaces `supabase.auth.signOut()` on the
        dashboard.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - signedOut
                    properties:
                      signedOut:
                        type: boolean
                        description: Always `true`.

  /auth/socket-token:
    get:
      operationId: authSession.socketToken
      tags:
        - AuthSession
      summary: Exchange the session cookie for a short-lived socket token
      description: |
        The dashboard browser cannot read the HTTP-only
        `_dhc_session` cookie to pass it via the Phoenix JS `authToken` socket
        option, and `new WebSocket(url, protocols)` has no `withCredentials`
        so a cross-origin socket cannot send the cookie. This endpoint
        exchanges the cookie for a short-lived, JS-readable, DB-backed socket
        token the browser can pass as `authToken`. `UserSocket.connect/3`
        verifies it through the same auth boundary.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Socket token issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - socketToken
                    properties:
                      socketToken:
                        type: string
                        description: |
                          URL-safe Base64-encoded opaque socket token. Pass
                          as the `authToken` option to the Phoenix JS `Socket`
                          constructor.
        "401":
          description: Missing, expired, or inactive session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  headers:
    NoReferrer:
      description: Always `no-referrer`, so the Intake link never leaks through a referrer.
      schema: {type: string, enum: [no-referrer]}
  responses:
    BeginnersIntakeNotFound:
      description: Unknown Intake link
      headers:
        Referrer-Policy: {$ref: "#/components/headers/NoReferrer"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BeginnersIntakeConflict:
      description: The Intake cannot start a payment now
      headers:
        Referrer-Policy: {$ref: "#/components/headers/NoReferrer"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BeginnersIntakeConflictError"}
    BeginnersIntakeUnavailable:
      description: Stripe is unavailable; try again shortly
      headers:
        Referrer-Policy: {$ref: "#/components/headers/NoReferrer"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BeginnersWorkshopUnauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BeginnersWorkshopForbidden:
      description: The `beginners.workshops.manage` capability is required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BeginnersWorkshopAssignedForbidden:
      description: The `beginners.workshops.assigned.read` capability is required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BeginnersWorkshopNotFound:
      description: Beginners' Workshop not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BeginnersWorkshopIntakeCommandConflict:
      description: The Intake's state does not allow the command
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandConflictError"}
    BeginnersWorkshopCheckInConflict:
      description: Outside the check-in window, or the person has not paid
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BeginnersWorkshopCheckInConflictError"}
    BeginnersWorkshopFinishConflict:
      description: Already finalised or cancelled, check-in not open yet, or someone still paying
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BeginnersWorkshopFinishConflictError"}
    BeginnersWorkshopConflict:
      description: Lifecycle conflict (finalised, cancelled, Batch 1 already sent, or the fee locked by an Intake)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BeginnersWorkshopConflictError"}
    BeginnersWorkshopInvalid:
      description: Invalid workshop details or a refused schedule rule
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BeginnersWorkshopInvalidError"}
    TrainingAnnouncementUnauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TrainingAnnouncementForbidden:
      description: Active management role required
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TrainingAnnouncementNotFound:
      description: Announcement or scoped exception not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TrainingAnnouncementConflict:
      description: Lifecycle conflict (attempted, retired, or delivery started)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TrainingAnnouncementConflictError"}
    TrainingAnnouncementInvalid:
      description: Invalid input, elapsed first send, overlapping override or invalid copy
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieSession:
      type: apiKey
      in: cookie
      name: _dhc_session
      description: |
        The signed `_dhc_session` cookie set by `POST /api/auth/magic-link/verify`.
        Browsers send it automatically with `credentials: 'include'`; SvelteKit
        SSR forwards it explicitly. It is the dashboard's primary auth
        credential. `RequireAuth` accepts this cookie in addition to the
        transitional Supabase bearer JWT (`bearerAuth`) until the Supabase
        cutover.
    onboardingAcceptanceSession:
      type: apiKey
      in: cookie
      name: _dhc_onboarding_acceptance
      description: |
        Short-lived signed HttpOnly browser proof for one Invitation Acceptance.
        It is transport state only and is never a DHC authenticated Session.
  parameters:
    BeginnersIntakeToken:
      name: token
      in: path
      required: true
      description: The Intake link token (a capability; redacted from logs).
      schema: {type: string, minLength: 1, maxLength: 128}
    BeginnersWorkshopId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    BeginnersWorkshopRefundId:
      name: refundId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BeginnersWorkshopIntakeId:
      name: intakeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BeginnersWorkshopWaitlistId:
      name: waitlistId
      in: path
      required: true
      description: The Waitlist entry (person) id.
      schema: {type: string, format: uuid}
    TrainingAnnouncementId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TrainingAnnouncementExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WorkshopId:
      name: workshopId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The Workshop id.
    SlugOrId:
      name: slugOrId
      in: path
      required: true
      schema:
        type: string
      description: |
        The Item's immutable slug (`item-000001`) or its uuid. A value
        that parses as a uuid resolves by id, anything else by slug.
    LoanId:
      name: loanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The Loan id.
  schemas:
    MemberAnnouncementDocument:
      type: object
      description: |
        A Tiptap (ProseMirror) JSON document, as returned by
        `editor.getJSON()`. Phoenix accepts a closed vocabulary — paragraph,
        heading (levels 2–3), bullet/ordered list, list item, blockquote,
        horizontal rule, hard break, and the bold/italic/underline/strike/link
        marks (http, https, mailto) — and rejects anything else.
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          enum: [doc]
        content:
          type: array
          items:
            type: object
            additionalProperties: true
    MemberAnnouncementDraft:
      type: object
      required: [subject, body]
      additionalProperties: false
      properties:
        subject:
          type: string
          maxLength: 200
          description: A single line, also used as the email heading.
        body:
          $ref: "#/components/schemas/MemberAnnouncementDocument"
        includeInactive:
          type: boolean
          default: false
          description: Also email members whose membership is inactive. Active (including paused) members are always included.
    MemberAnnouncementPreview:
      type: object
      required: [html, text, recipientCount]
      properties:
        html:
          type: string
          description: The complete email HTML exactly as it would be sent.
        text:
          type: string
          description: The plain-text alternative part.
        recipientCount:
          type: integer
          minimum: 0
    MemberAnnouncementPreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemberAnnouncementPreview"
    MemberAnnouncementStatus:
      type: string
      enum: [queued, sent, failed]
    MemberAnnouncement:
      type: object
      required: [id, subject, includeInactive, recipientCount, status, failureReason, sentAt, createdAt, sentByName]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        includeInactive:
          type: boolean
        recipientCount:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/MemberAnnouncementStatus"
        failureReason:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        sentByName:
          type: string
          nullable: true
          description: The sender's display name, or null when their profile no longer exists.
    MemberAnnouncementResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemberAnnouncement"
    MemberAnnouncementListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberAnnouncement"
    IntakeEmailType:
      type: string
      description: An Intake Email type (`Dhc.BeginnersWorkshops.IntakeEmails.EmailType`).
      enum:
        - contact_pay
        - contact_confirm
        - place_confirmed_paid
        - place_confirmed_carried
        - pre_workshop
        - rescheduled
        - follow_up
        - declined
        - deferred
        - cancelled_with_refund
        - withdrawn_refunded
        - withdrawn_forfeited
        - carried_fee_refunded
        - payment_refunded
        - cancelled_paid
        - cancelled_unpaid
    IntakeEmailKind:
      type: string
      description: |
        `action` emails (open Intakes) end with an app-added button;
        `notice` emails (closed Intakes) are a message only.
      enum: [action, notice]
    IntakeEmailPlaceholder:
      type: string
      description: A placeholder name in the closed Intake Email vocabulary.
      enum: [firstName, date, startTime, venue, fee, windowEnd, paymentCutoff, refundAmount]
    IntakeEmailDocument:
      type: object
      description: |
        A Tiptap (ProseMirror) JSON document in the Member Announcement
        vocabulary plus the inline placeholder node
        `{"type": "placeholder", "attrs": {"name": "<placeholder>"}}`
        (marks allowed).
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          enum: [doc]
        content:
          type: array
          items:
            type: object
            additionalProperties: true
    IntakeEmailTemplate:
      type: object
      required: [emailType, kind, buttonLabel, placeholders, subject, body, updatedAt]
      properties:
        emailType: {$ref: "#/components/schemas/IntakeEmailType"}
        kind: {$ref: "#/components/schemas/IntakeEmailKind"}
        buttonLabel:
          type: string
          nullable: true
          description: The fixed label of the app-added button; null for notices.
        placeholders:
          type: array
          description: The placeholders this type can fill, in display order.
          items: {$ref: "#/components/schemas/IntakeEmailPlaceholder"}
        subject:
          type: string
          description: Plain text with `{{placeholder}}` tokens.
        body: {$ref: "#/components/schemas/IntakeEmailDocument"}
        updatedAt:
          type: string
          format: date-time
          description: When the template was last saved (or seeded).
    IntakeEmailTemplateUpdate:
      type: object
      required: [subject, body]
      additionalProperties: false
      properties:
        subject:
          type: string
          maxLength: 200
          description: One line with `{{placeholder}}` tokens.
        body: {$ref: "#/components/schemas/IntakeEmailDocument"}
    IntakeEmailTemplateResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/IntakeEmailTemplate"}
    IntakeEmailTemplateListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/IntakeEmailTemplate"}
    IntakeEmailTemplateValidationError:
      description: 422 refusals of an Intake Email template save.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - placeholder_not_allowed
                    - template_too_long
                    - invalid_template
    TrainingAnnouncementOccurrenceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/TrainingAnnouncementOccurrence'}
    TrainingAnnouncementOccurrenceResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TrainingAnnouncementOccurrence'}
    TrainingAnnouncementOccurrence:
      type: object
      description: Full inspector payload. Non-frozen evidence deliberately has null snapshot fields. Legacy rows have only their retained outcome, an empty chain and unknown when the original resolution cannot be established. No current copy or exceptions are substituted into evidence.
      required: [subject, date, announcementId, holidayDate, phase, postTime, kind, outcome, chain, decidedBy, titleSource, messageSource, mentionEveryone, renderedMessage, threadName, readOnly, renderErrors, delivery, appliedSuppressionId, appliedOverrideId]
      properties:
        subject: {type: string, enum: [occurrence, holiday]}
        date: {type: string, format: date, description: Dublin send date, not the holiday identity date for day_before}
        announcementId: {type: string, format: uuid, nullable: true}
        appliedSuppressionId: {type: string, format: uuid, nullable: true}
        appliedOverrideId: {type: string, format: uuid, nullable: true}
        holidayDate: {type: string, format: date, nullable: true}
        phase: {type: string, enum: [day_before, same_day, null], nullable: true}
        postTime: {type: string, nullable: true}
        kind: {type: string, enum: [roll_call, sparring, null], nullable: true}
        outcome: {type: string, enum: [post, post_override, skipped_holiday, skipped_disabled, skipped_suppressed, missed, unknown]}
        chain:
          type: array
          items: {type: string, enum: [holiday, disablement, suppression, override, defaults]}
        decidedBy: {type: string, enum: [holiday, disablement, suppression, override, defaults, null], nullable: true}
        titleSource: {type: string, nullable: true}
        messageSource: {type: string, nullable: true}
        mentionEveryone: {type: boolean, nullable: true}
        renderedMessage: {type: string, nullable: true}
        threadName: {type: string, nullable: true}
        readOnly: {type: boolean}
        renderErrors: {type: array, items: {type: string}}
        delivery:
          allOf:
            - {$ref: '#/components/schemas/TrainingAnnouncementDeliveryEvidence'}
          nullable: true
    TrainingAnnouncementDeliveryEvidence:
      type: object
      required: [id, state, reason, frozenAt, postingStartedAt, messagePostedAt, threadCreatedAt, concludedAt, discordMessageId, discordThreadId, permalink, errorDetail, threadAttempts, lastThreadError, appliedSuppressionId, appliedOverrideId]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [frozen, posting_message, message_posted, creating_thread, delivered, message_uncertain, thread_failed, blocked, skipped, missed]}
        reason: {type: string, enum: [holiday, disabled, suppressed, unconfigured_channel, invalid_copy, late, permission, unknown_channel, payload_rejected, timeout, server_error, worker_lost, unknown, null], nullable: true}
        frozenAt: {type: string, format: date-time, nullable: true}
        postingStartedAt: {type: string, format: date-time, nullable: true}
        messagePostedAt: {type: string, format: date-time, nullable: true}
        threadCreatedAt: {type: string, format: date-time, nullable: true}
        concludedAt: {type: string, format: date-time, nullable: true}
        discordMessageId: {type: string, nullable: true}
        discordThreadId: {type: string, nullable: true}
        permalink: {type: string, nullable: true}
        errorDetail: {type: string, nullable: true}
        threadAttempts: {type: integer, minimum: 0}
        lastThreadError: {type: string, nullable: true}
        appliedSuppressionId: {type: string, format: uuid, nullable: true}
        appliedOverrideId: {type: string, format: uuid, nullable: true}
    TrainingAnnouncementKind:
      type: string
      enum: [roll_call, sparring]
    TrainingAnnouncementWarning:
      type: string
      enum: [slot_collision, exception_intersection_changed]
    TrainingAnnouncementScheduleRequest:
      type: object
      description: Set exactly one of weekday or oneOffDate; explicitly clear the other when switching schedule type. Civil time in Europe/Dublin, first send strictly after now.
      required: [postTime]
      properties:
        weekday: {type: integer, minimum: 1, maximum: 7, nullable: true}
        oneOffDate: {type: string, format: date, nullable: true}
        postTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'}
    TrainingAnnouncementCopyRequest:
      type: object
      required: [title, message, mentionEveryone]
      properties:
        title: {type: string, minLength: 1, maxLength: 100}
        message: {type: string, minLength: 1, maxLength: 2000}
        mentionEveryone: {type: boolean}
    TrainingAnnouncementCreateRequest:
      allOf:
        - {$ref: "#/components/schemas/TrainingAnnouncementScheduleRequest"}
        - {$ref: "#/components/schemas/TrainingAnnouncementCopyRequest"}
        - type: object
          required: [kind]
          properties:
            kind: {$ref: "#/components/schemas/TrainingAnnouncementKind"}
    TrainingAnnouncementPreviewRequest:
      allOf:
        - {$ref: "#/components/schemas/TrainingAnnouncementCopyRequest"}
        - type: object
          required: [kind, date]
          properties:
            kind: {$ref: "#/components/schemas/TrainingAnnouncementKind"}
            date: {type: string, format: date}
    TrainingAnnouncement:
      allOf:
        - {$ref: "#/components/schemas/TrainingAnnouncementCreateRequest"}
        - type: object
          required: [id, weekday, oneOffDate, enabled, retired, firstAttemptedAt, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            weekday: {type: integer, minimum: 1, maximum: 7, nullable: true}
            oneOffDate: {type: string, format: date, nullable: true}
            enabled: {type: boolean}
            retired: {type: boolean}
            firstAttemptedAt: {type: string, format: date-time, nullable: true}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    TrainingAnnouncementResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TrainingAnnouncement"}
    TrainingAnnouncementListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/TrainingAnnouncement"}
    TrainingAnnouncementScheduleResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [announcement, warnings]
          properties:
            announcement: {$ref: "#/components/schemas/TrainingAnnouncement"}
            warnings:
              type: array
              items: {$ref: "#/components/schemas/TrainingAnnouncementWarning"}
    TrainingAnnouncementPreviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [threadName, renderedMessage]
          properties:
            threadName: {type: string, maxLength: 100}
            renderedMessage: {type: string, maxLength: 2000}
    TrainingAnnouncementDateRange:
      type: object
      description: Finite inclusive Dublin range; fromDate equals toDate for a single occurrence.
      required: [fromDate, toDate]
      properties:
        fromDate: {type: string, format: date}
        toDate: {type: string, format: date}
    TrainingAnnouncementSuppression:
      allOf:
        - {$ref: "#/components/schemas/TrainingAnnouncementDateRange"}
        - type: object
          required: [id, announcementId, createdAt]
          properties:
            id: {type: string, format: uuid}
            announcementId: {type: string, format: uuid}
            createdAt: {type: string, format: date-time}
    TrainingAnnouncementOverrideRequest:
      allOf:
        - {$ref: "#/components/schemas/TrainingAnnouncementDateRange"}
        - type: object
          description: Replace title, message or both; kind and mention overrides do not exist.
          properties:
            title: {type: string, minLength: 1, maxLength: 100, nullable: true}
            message: {type: string, minLength: 1, maxLength: 2000, nullable: true}
    TrainingAnnouncementOverride:
      allOf:
        - {$ref: "#/components/schemas/TrainingAnnouncementSuppression"}
        - type: object
          required: [title, message]
          properties:
            title: {type: string, nullable: true}
            message: {type: string, nullable: true}
    TrainingAnnouncementSuppressionResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TrainingAnnouncementSuppression"}
    TrainingAnnouncementOverrideResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TrainingAnnouncementOverride"}
    TrainingAnnouncementSuppressionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/TrainingAnnouncementSuppression"}
    TrainingAnnouncementOverrideListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/TrainingAnnouncementOverride"}
    TrainingAnnouncementConflictError:
      description: |
        409 lifecycle conflict on a Training Announcement command.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - attempted
                    - retired
                    - delivery_started
                    - concurrent_change
    BeginnersWorkshopStage:
      type: string
      description: |
        Where a Beginners' Workshop is in its lifecycle, as Phoenix judges it
        now. `before_contact_from`: Batch 1 waits for the contact-from date
        (10:00 Dublin time). `next_batch_due`: the next Batch goes out at the
        next sweep.
      enum:
        - before_contact_from
        - window_open
        - next_batch_due
        - batches_paused
        - full
        - payment_closed
        - today_before_check_in
        - check_in_open
        - awaiting_finalisation
        - finalised
        - cancelled
    BeginnersWorkshopStatus:
      type: string
      enum: [scheduled, finalised, cancelled]
    BeginnersWorkshopAlert:
      type: string
      description: "`unstaffed`: no coach is assigned yet (assistants alone do not staff it)."
      enum: [unstaffed]
    BeginnersWorkshopSeats:
      type: object
      description: |
        Seats taken are paid Intakes plus live Seat Holds. After Attendance
        Finalisation the meter reads `attended` / `noShow` (both 0 before).
      required: [capacity, paid, holds, free, attended, noShow]
      properties:
        capacity: {type: integer, minimum: 1}
        paid: {type: integer, minimum: 0}
        holds: {type: integer, minimum: 0}
        free: {type: integer, minimum: 0}
        attended: {type: integer, minimum: 0}
        noShow: {type: integer, minimum: 0}
    BeginnersWorkshop:
      type: object
      description: |
        One Beginners' Workshop. `date`, `startTime`, `paymentCutoffDate`,
        `paymentCutoffTime` and `contactFromDate` are Europe/Dublin civil
        values; `paymentCutoff` is the same cutoff as an instant.
      required:
        - id
        - status
        - venue
        - date
        - startTime
        - capacity
        - feeCents
        - paymentCutoff
        - paymentCutoffDate
        - paymentCutoffTime
        - contactFromDate
        - contactFromEditable
        - paymentWindowDays
        - stage
        - seats
        - alerts
        - staff
      properties:
        id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/BeginnersWorkshopStatus"}
        venue: {type: string, maxLength: 80}
        date: {type: string, format: date}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        capacity: {type: integer, minimum: 1}
        feeCents: {type: integer, minimum: 1}
        paymentCutoff: {type: string, format: date-time}
        paymentCutoffDate: {type: string, format: date}
        paymentCutoffTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        contactFromDate: {type: string, format: date}
        contactFromEditable:
          type: boolean
          description: Whether the contact-from date can still change (Batch 1 has not gone out).
        paymentWindowDays: {type: integer, minimum: 1}
        stage: {$ref: "#/components/schemas/BeginnersWorkshopStage"}
        seats: {$ref: "#/components/schemas/BeginnersWorkshopSeats"}
        alerts:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopAlert"}
        staff: {$ref: "#/components/schemas/BeginnersWorkshopStaff"}
    BeginnersWorkshopStaffMember:
      type: object
      required: [principalId, name]
      properties:
        principalId: {type: string, format: uuid}
        name: {type: string}
    BeginnersWorkshopStaff:
      type: object
      description: |
        One coach (or none: the workshop is Unstaffed) and any assistants,
        assistants sorted by name.
      required: [coach, assistants]
      properties:
        coach:
          allOf:
            - $ref: "#/components/schemas/BeginnersWorkshopStaffMember"
          nullable: true
        assistants:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopStaffMember"}
    BeginnersWorkshopStaffRole:
      type: string
      enum: [coach, assistant]
    BeginnersWorkshopStaffRequest:
      type: object
      description: |
        The whole Staff list. A missing or null `coachPrincipalId` means no
        coach; a missing `assistantPrincipalIds` means no assistants.
      properties:
        coachPrincipalId: {type: string, format: uuid, nullable: true}
        assistantPrincipalIds:
          type: array
          items: {type: string, format: uuid}
    BeginnersWorkshopStaffCandidate:
      type: object
      required: [principalId, name, coach]
      properties:
        principalId: {type: string, format: uuid}
        name: {type: string}
        coach:
          type: boolean
          description: Whether this Member may be assigned as coach (holds the coach role).
    BeginnersWorkshopStaffCandidatesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopStaffCandidate"}
    BeginnersWorkshopAssignment:
      type: object
      description: One of the caller's Staff assignments. Civil values are Europe/Dublin.
      required: [id, status, venue, date, startTime, stage, role]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/BeginnersWorkshopStatus"}
        venue: {type: string}
        date: {type: string, format: date}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        stage: {$ref: "#/components/schemas/BeginnersWorkshopStage"}
        role: {$ref: "#/components/schemas/BeginnersWorkshopStaffRole"}
    BeginnersWorkshopAssignmentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopAssignment"}
    BeginnersWorkshopDoor:
      type: object
      description: |
        The door view. Its own shape: it never carries email, payment,
        refund or Waitlist fields. Civil values are Europe/Dublin.
      required: [id, status, venue, date, startTime, stage, alerts, staff, checkIn, people, finalisation]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/BeginnersWorkshopStatus"}
        venue: {type: string}
        date: {type: string, format: date}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        stage: {$ref: "#/components/schemas/BeginnersWorkshopStage"}
        alerts:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopAlert"}
        staff: {$ref: "#/components/schemas/BeginnersWorkshopStaff"}
        checkIn: {$ref: "#/components/schemas/BeginnersWorkshopCheckIn"}
        people:
          type: array
          description: Everyone with a seat (`paid`, then `attended` / `no_show`), by name.
          items: {$ref: "#/components/schemas/BeginnersWorkshopDoorPerson"}
        finalisation:
          allOf:
            - $ref: "#/components/schemas/BeginnersWorkshopDoorFinalisation"
          nullable: true
          description: The finalised summary; null until Attendance Finalisation.
    BeginnersWorkshopDoorFinalisation:
      type: object
      required: [at, by, attended, noShow]
      properties:
        at: {type: string, format: date-time}
        by:
          type: string
          nullable: true
          description: Who pressed Finish, by name; null when it finalised automatically at the end of the day.
        attended: {type: integer, minimum: 0}
        noShow: {type: integer, minimum: 0}
    BeginnersWorkshopCheckInWindow:
      type: string
      description: |
        `open` from 1 hour before the start on the workshop date until
        Attendance Finalisation or the end of that Dublin day; `before` until
        then; `closed` after it (or once finalised or cancelled).
      enum: [before, open, closed]
    BeginnersWorkshopCheckIn:
      type: object
      required: [window, opensAt]
      properties:
        window: {$ref: "#/components/schemas/BeginnersWorkshopCheckInWindow"}
        opensAt:
          type: string
          format: date-time
          description: When check-in opens (1 hour before the start).
    BeginnersWorkshopDoorPerson:
      type: object
      description: |
        One person at the door. A minor (under 18 on the workshop date)
        carries `minor: true` and the Guardian's name and phone; nobody
        else carries a Guardian.
      required: [id, firstName, lastName, pronouns, state, minor, medicalConditions, guardian, checkedIn]
      properties:
        id: {type: string, format: uuid, description: The Intake id.}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        pronouns: {type: string, nullable: true}
        state: {$ref: "#/components/schemas/BeginnersWorkshopIntakeState"}
        minor: {type: boolean}
        medicalConditions: {type: string, nullable: true}
        guardian:
          allOf:
            - $ref: "#/components/schemas/BeginnersWorkshopGuardian"
          nullable: true
        checkedIn:
          allOf:
            - $ref: "#/components/schemas/BeginnersWorkshopCheckInRecord"
          nullable: true
    BeginnersWorkshopGuardian:
      type: object
      required: [name, phoneNumber]
      properties:
        name: {type: string}
        phoneNumber: {type: string}
    BeginnersWorkshopCheckInRecord:
      type: object
      description: Who checked the person in, by name, and when.
      required: [at, by]
      properties:
        at: {type: string, format: date-time}
        by: {type: string}
    BeginnersWorkshopDoorResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshopDoor"}
    BeginnersWorkshopScheduleItem:
      type: object
      description: |
        One workshop to schedule. Civil values are Europe/Dublin. The Payment
        Cutoff defaults to the start time 3 days before the date
        (`paymentCutoffDate` and `paymentCutoffTime` default independently);
        it must be before the start. `contactFromDate` defaults to the Dublin
        day it is scheduled and must be on or before the cutoff date.
      required: [venue, date, startTime, capacity, feeCents]
      properties:
        venue: {type: string, minLength: 1, maxLength: 80}
        date: {type: string, format: date}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'}
        capacity: {type: integer, minimum: 1}
        feeCents: {type: integer, minimum: 1, maximum: 99999}
        paymentCutoffDate: {type: string, format: date}
        paymentCutoffTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'}
        contactFromDate: {type: string, format: date}
        paymentWindowDays: {type: integer, minimum: 1}
        coachPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: Optional coach; must hold the coach role.
        assistantPrincipalIds:
          type: array
          description: Optional assistants; each must be an active Member.
          items: {type: string, format: uuid}
    BeginnersWorkshopScheduleRequest:
      type: object
      required: [workshops]
      properties:
        workshops:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: "#/components/schemas/BeginnersWorkshopScheduleItem"}
    BeginnersWorkshopSettingsRequest:
      type: object
      description: |
        Any subset of the workshop settings; omitted fields keep their value.
        `paymentCutoffDate` and `paymentCutoffTime` each keep the current
        cutoff's other half. Civil values are Europe/Dublin.
      properties:
        capacity: {type: integer, minimum: 1}
        feeCents: {type: integer, minimum: 1, maximum: 99999}
        paymentCutoffDate: {type: string, format: date}
        paymentCutoffTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'}
        contactFromDate: {type: string, format: date}
        paymentWindowDays: {type: integer, minimum: 1}
    BeginnersWorkshopRescheduleRequest:
      type: object
      description: |
        The new date, start time and/or venue (Europe/Dublin civil values),
        optionally with a new Payment Cutoff date or time and, while Batch 1
        has not gone out, a new contact-from date. Omitted fields keep their
        value or their offset before the start.
      properties:
        venue: {type: string, minLength: 1, maxLength: 80}
        date: {type: string, format: date}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'}
        paymentCutoffDate: {type: string, format: date}
        paymentCutoffTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'}
        contactFromDate: {type: string, format: date}
    BeginnersWorkshopResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshop"}
    BeginnersWorkshopScheduleResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshop"}
    BeginnersWorkshopListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [upcoming, past]
          properties:
            upcoming:
              type: array
              description: Scheduled workshops, soonest first.
              items: {$ref: "#/components/schemas/BeginnersWorkshop"}
            past:
              type: array
              description: Finalised and cancelled workshops, most recent first.
              items: {$ref: "#/components/schemas/BeginnersWorkshop"}
    BeginnersWorkshopBatch:
      type: object
      description: |
        One automatic Batch. Its payment window ends at `windowEndsAt`
        (23:59 Dublin time, or the Payment Cutoff when it reaches the cutoff
        date).
      required: [number, size, sentAt, windowEndsAt]
      properties:
        number: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        sentAt: {type: string, format: date-time}
        windowEndsAt: {type: string, format: date-time}
    BeginnersWorkshopBatchPause:
      type: object
      description: Whether automatic Batches are paused, and who paused or resumed them last.
      required: [paused, pausedAt, pausedBy, resumedAt, resumedBy]
      properties:
        paused: {type: boolean}
        pausedAt: {type: string, nullable: true, format: date-time}
        pausedBy: {type: string, nullable: true}
        resumedAt: {type: string, nullable: true, format: date-time}
        resumedBy: {type: string, nullable: true}
    BeginnersWorkshopNextBatchStatus:
      type: string
      description: |
        `due`: it goes out at the next sweep. `scheduled`: it goes out at
        `goesOutAt` (10:00 Dublin time). `paused`: Batches are paused.
        `full`: every seat is paid; it goes as soon as a seat frees. `closed`:
        no further Batch can go before the Payment Cutoff.
      enum: [due, scheduled, paused, full, closed]
    BeginnersWorkshopProposedPerson:
      type: object
      description: One person in the Next Batch proposal, in Waitlist priority order.
      required: [firstName, lastName, minor, queueDate]
      properties:
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        minor: {type: boolean, description: Under 18 on the workshop date.}
        queueDate: {type: string, format: date-time}
    BeginnersWorkshopNextBatch:
      type: object
      description: |
        The Next Batch preview. `size` is capacity − Intakes already paid;
        `people` is the live proposal (at most `size` waiting people without
        an open Intake), empty when the Batch is `full` or `closed`.
      required: [status, goesOutAt, number, size, capacity, paid, people]
      properties:
        status: {$ref: "#/components/schemas/BeginnersWorkshopNextBatchStatus"}
        goesOutAt: {type: string, nullable: true, format: date-time}
        number: {type: integer, minimum: 1}
        size: {type: integer, minimum: 0}
        capacity: {type: integer, minimum: 1}
        paid: {type: integer, minimum: 0}
        people:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopProposedPerson"}
    BeginnersWorkshopIntakeState:
      type: string
      description: "`contacted` and `paid` are open; every other state is terminal."
      enum:
        - contacted
        - paid
        - attended
        - no_show
        - lapsed
        - declined
        - returned
        - deferred
        - cancelled_refunded
        - withdrawn
    BeginnersWorkshopIntakeOrigin:
      type: string
      enum: [batch, fast_track]
    BeginnersWorkshopRosterIntake:
      type: object
      description: |
        One Intake on the console roster. Names are null once the person is
        anonymised; `batchNumber` is null for a fast-track.
      required: [id, state, origin, batchNumber, firstName, lastName, minor, medical, queueDate, contactedAt, windowEndsAt, holdExpiresAt, checkedInAt, refund, linkGeneration, emailLog, history, availableCommands, standing]
      properties:
        id: {type: string, format: uuid}
        state: {$ref: "#/components/schemas/BeginnersWorkshopIntakeState"}
        origin: {$ref: "#/components/schemas/BeginnersWorkshopIntakeOrigin"}
        batchNumber: {type: integer, nullable: true, minimum: 1}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        minor: {type: boolean}
        medical:
          type: boolean
          description: Whether the person gave medical conditions (the details stay on their profile).
        queueDate: {type: string, format: date-time}
        contactedAt: {type: string, format: date-time}
        windowEndsAt:
          type: string
          format: date-time
          description: When the person's payment window ends — their Batch's, or the Payment Cutoff for a fast-track.
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the person's live Seat Hold runs out (null without one).
        checkedInAt:
          type: string
          format: date-time
          nullable: true
          description: When the person was checked in at the door (null until then).
        refund:
          allOf: [{$ref: "#/components/schemas/BeginnersWorkshopIntakeRefund"}]
          nullable: true
          description: The Intake's latest refund (null without one).
        standing:
          allOf: [{$ref: "#/components/schemas/WaitlistStatus"}]
          nullable: true
          description: |
            The person's Waitlist standing now (null once anonymised). After
            finalisation it says whether an attended person is still
            Invitable (`attended`), `invited` or `joined`.
        linkGeneration:
          type: integer
          minimum: 1
          description: Which link the person has; Rotate link increments it.
        emailLog:
          type: array
          description: |
            The Intake Emails queued for the person, oldest first (queued, not
            delivery status), followed by the scheduled ones still owed.
          items: {$ref: "#/components/schemas/BeginnersWorkshopIntakeEmailLogEntry"}
        history:
          type: array
          description: The console commands run on the Intake, oldest first.
          items: {$ref: "#/components/schemas/BeginnersWorkshopIntakeHistoryEntry"}
        availableCommands:
          type: array
          description: |
            The commands valid in the Intake's current state, from the same
            rule the boundary applies under the lock. Advisory: a stale list
            is refused with a named reason.
          items: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommand"}
    BeginnersWorkshopIntakeCommand:
      type: string
      enum: [decline, cancel_with_refund, withdraw, resend_link, rotate_link]
    BeginnersWorkshopIntakeEmailLogEntry:
      type: object
      description: |
        One Intake Email. `scheduled: false` — queued at `at`. `scheduled:
        true` — not queued yet; a time-driven pass sends it at `at` (a past
        `at` means at the next sweep).
      required: [emailType, at, scheduled]
      properties:
        emailType: {$ref: "#/components/schemas/IntakeEmailType"}
        at: {type: string, format: date-time}
        scheduled: {type: boolean}
    BeginnersWorkshopIntakeHistoryEntry:
      type: object
      description: One console command run on an Intake. `actor` is null once the person who ran it is gone.
      required: [command, actor, occurredAt, note]
      properties:
        command: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommand"}
        actor: {type: string, nullable: true}
        occurredAt: {type: string, format: date-time}
        note: {type: string, nullable: true}
    BeginnersWorkshopIntakeCommandRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: Why (optional), recorded in the Intake's history.
    BeginnersWorkshopWithdrawRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: Why (optional), recorded in the Intake's history when there is one.
        refund:
          type: boolean
          description: |
            Required whenever the person has a paid Intake: `true` refunds
            the full amount, `false` forfeits it.
    BeginnersWorkshopWithdrawPersonResult:
      type: object
      required: [waitlistId, status, intake, outcome]
      properties:
        waitlistId: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/WaitlistStatus"}
        intake:
          description: The open Intake the withdraw closed, or null without one.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BeginnersWorkshopIntakeCommandResult"
        outcome: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandOutcome"}
    BeginnersWorkshopWithdrawPersonResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshopWithdrawPersonResult"}
    BeginnersWorkshopIntakeCommandOutcome:
      type: string
      description: "`done`: the command acted. `already_done`: the Intake was already where it leads; nothing happened again."
      enum: [done, already_done]
    BeginnersWorkshopIntakeCommandResult:
      type: object
      required: [id, state, linkGeneration, outcome]
      properties:
        id: {type: string, format: uuid}
        state: {$ref: "#/components/schemas/BeginnersWorkshopIntakeState"}
        linkGeneration: {type: integer, minimum: 1}
        outcome: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandOutcome"}
    BeginnersWorkshopIntakeCommandResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshopIntakeCommandResult"}
    BeginnersWorkshopUnpaidAfterWindow:
      type: object
      description: A contacted person still unpaid after their payment window ended.
      required: [id, firstName, lastName, batchNumber, windowEndsAt]
      properties:
        id: {type: string, format: uuid, description: The Intake id}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        batchNumber: {type: integer, nullable: true, minimum: 1}
        windowEndsAt: {type: string, format: date-time}
    BeginnersWorkshopRefundStatus:
      type: string
      description: |
        `pending` (not yet submitted), `processing` (Stripe accepted it),
        `completed`, `failed`. `completed` and `failed` are final.
      enum: [pending, processing, completed, failed]
    BeginnersWorkshopRefundMethod:
      type: string
      description: "`stripe`: refunded through Stripe. `manual`: paid back outside Stripe and recorded."
      enum: [stripe, manual]
    BeginnersWorkshopIntakeRefund:
      type: object
      description: |
        A roster Intake's latest refund. `automatic`: the system owed it (a
        payment that failed the amount/currency check, or one that completed
        after the Intake closed).
      required: [status, method, automatic, amountCents, currency]
      properties:
        status: {$ref: "#/components/schemas/BeginnersWorkshopRefundStatus"}
        method: {$ref: "#/components/schemas/BeginnersWorkshopRefundMethod"}
        automatic: {type: boolean}
        amountCents: {type: integer, minimum: 1}
        currency: {type: string}
    BeginnersWorkshopFailedRefund:
      type: object
      description: A refund that failed and has not been retried or recorded as manual.
      required: [id, intakeId, firstName, lastName, amountCents, currency, reason, failedAt]
      properties:
        id: {type: string, format: uuid}
        intakeId: {type: string, format: uuid}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        amountCents: {type: integer, minimum: 1}
        currency: {type: string}
        reason: {type: string, description: "Why the refund was owed, e.g. `policy_failed`, `paid_after_close`."}
        failedAt: {type: string, format: date-time, nullable: true}
    BeginnersWorkshopRefund:
      type: object
      required: [id, intakeId, followsRefundId, status, method, reason, amountCents, currency, requestedAt, completedAt]
      properties:
        id: {type: string, format: uuid}
        intakeId: {type: string, format: uuid}
        followsRefundId: {type: string, format: uuid, nullable: true}
        status: {$ref: "#/components/schemas/BeginnersWorkshopRefundStatus"}
        method: {$ref: "#/components/schemas/BeginnersWorkshopRefundMethod"}
        reason: {type: string}
        amountCents: {type: integer, minimum: 1}
        currency: {type: string}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
    BeginnersWorkshopRefundResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshopRefund"}
    BeginnersWorkshopManualRefundRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
          description: How the person was paid back (optional).
    BeginnersWorkshopRefundConflictError:
      description: 409 refusal of `retry` or `recordManual`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [refund_not_failed, refund_followed_up, already_requested]
    BeginnersIntakeState:
      type: string
      description: |
        `pay`: a seat is free (or the person's own hold is live).
        `payment_in_progress`: back from checkout, or the hold ran out and
        Stripe has not ended it yet — refresh until `paid`. `full`: every seat
        is paid or held; seats may free up before the cutoff. `paid`.
        `closed`: see `closedReason`.
      enum: [pay, payment_in_progress, full, paid, closed]
    BeginnersIntakeAction:
      type: string
      description: |
        The one action: `pay` (start checkout), `continue_payment` (back to the
        live hold's checkout), `check_again` (reload), `none`.
      enum: [pay, continue_payment, check_again, none]
    BeginnersIntakeClosedReason:
      type: string
      description: "`inactive`: the Intake is no longer open. `payment_closed`: the Payment Cutoff has passed."
      enum: [inactive, payment_closed]
    BeginnersIntakeWorkshop:
      type: object
      required: [date, startTime, venue]
      properties:
        date: {type: string, format: date, description: Europe/Dublin civil date}
        startTime: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", description: "Europe/Dublin HH:MM"}
        venue: {type: string}
    BeginnersIntakePage:
      type: object
      description: |
        The person's Intake page (`Dhc.BeginnersWorkshops.IntakePage`): a
        closed safe view; `state` is the discriminator. The person and
        workshop details are null only on an `inactive` closed page.
      required: [state, action, closedReason, firstName, workshop, feeCents]
      properties:
        state: {$ref: "#/components/schemas/BeginnersIntakeState"}
        action: {$ref: "#/components/schemas/BeginnersIntakeAction"}
        closedReason:
          allOf: [{$ref: "#/components/schemas/BeginnersIntakeClosedReason"}]
          nullable: true
        firstName: {type: string, nullable: true}
        workshop:
          allOf: [{$ref: "#/components/schemas/BeginnersIntakeWorkshop"}]
          nullable: true
        feeCents: {type: integer, nullable: true, minimum: 1}
    BeginnersIntakePageResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersIntakePage"}
    BeginnersIntakeCheckoutResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [checkoutUrl]
          properties:
            checkoutUrl: {type: string, format: uri, description: The hosted Stripe Checkout page}
    BeginnersIntakeReturnRequest:
      type: object
      properties:
        sessionId:
          type: string
          description: The Checkout Session id Stripe put in the success URL.
    BeginnersIntakeConflictError:
      description: 409 refusal of `startPayment`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [after_cutoff, full, already_paid, intake_closed, payment_in_progress]
    BeginnersWorkshopRoster:
      type: object
      description: |
        Before Attendance Finalisation: `seated` (paid), `asked` (contacted,
        not paid yet) and `out`. After it: `attended`, `noShow` and `out`.
        `out` is every other closed Intake.
      required: [seated, asked, attended, noShow, out]
      properties:
        seated:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopRosterIntake"}
        asked:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopRosterIntake"}
        attended:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopRosterIntake"}
        noShow:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopRosterIntake"}
        out:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopRosterIntake"}
    BeginnersWorkshopAttention:
      type: string
      description: "`nobody_waiting`: a Batch is due with free seats, but nobody eligible is waiting."
      enum: [nobody_waiting]
    BeginnersWorkshopConsole:
      type: object
      required: [workshop, batches, pause, nextBatch, roster, failedRefunds, unpaidAfterWindow, attention, fastTrackOpen, finalisation]
      properties:
        workshop: {$ref: "#/components/schemas/BeginnersWorkshop"}
        batches:
          type: array
          description: Every Batch sent, oldest first.
          items: {$ref: "#/components/schemas/BeginnersWorkshopBatch"}
        pause: {$ref: "#/components/schemas/BeginnersWorkshopBatchPause"}
        nextBatch: {$ref: "#/components/schemas/BeginnersWorkshopNextBatch"}
        roster: {$ref: "#/components/schemas/BeginnersWorkshopRoster"}
        failedRefunds:
          type: array
          description: Needs attention — refunds that failed and wait for Retry or Record manual refund, oldest first.
          items: {$ref: "#/components/schemas/BeginnersWorkshopFailedRefund"}
        unpaidAfterWindow:
          type: array
          description: Needs attention — contacted people still unpaid after their payment window, oldest window first.
          items: {$ref: "#/components/schemas/BeginnersWorkshopUnpaidAfterWindow"}
        attention:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopAttention"}
        fastTrackOpen:
          type: boolean
          description: |
            Whether Fast-track is offered now: the workshop is scheduled and
            before its Payment Cutoff (the rule `fast_track` applies).
        finalisation:
          allOf:
            - $ref: "#/components/schemas/BeginnersWorkshopConsoleFinalisation"
          nullable: true
          description: Attendance Finalisation; null until the workshop is finalised.
    BeginnersWorkshopConsoleFinalisation:
      type: object
      required: [at, by, followUpAt, invitations]
      properties:
        at: {type: string, format: date-time}
        by:
          type: string
          nullable: true
          description: Who pressed Finish, by name; null when it finalised automatically at the end of the day.
        followUpAt:
          type: string
          format: date-time
          description: When attended people get the Follow-up (10:00 Dublin the morning after).
        invitations: {$ref: "#/components/schemas/BeginnersWorkshopConsoleInvitations"}
    BeginnersWorkshopConsoleResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshopConsole"}
    BeginnersWorkshopFastTrackCandidate:
      type: object
      description: |
        A person the Fast-track dialog may place: `waiting`, or `removed`
        within the 3-month retention window (placing them restores them).
        Nobody with an open Intake is listed.
      required: [waitlistId, firstName, lastName, email, status, removedAt, minor]
      properties:
        waitlistId: {type: string, format: uuid}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        email: {type: string, format: email}
        status: {type: string, enum: [waiting, removed]}
        removedAt: {type: string, nullable: true, format: date-time}
        minor:
          type: boolean
          description: Under 18 on the workshop date.
    BeginnersWorkshopFastTrackCandidatesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopFastTrackCandidate"}
    BeginnersWorkshopFastTrackRequest:
      type: object
      required: [waitlistId]
      properties:
        waitlistId: {type: string, format: uuid}
    BeginnersWorkshopFastTrack:
      type: object
      description: |
        The fast-tracked Intake. `placed` says how the person got there:
        `waiting` (already waiting), `restored` (removed within retention,
        now waiting again) or `added` (new to the Waitlist).
      required: [intakeId, workshopId, waitlistId, state, origin, contactedAt, placed]
      properties:
        intakeId: {type: string, format: uuid}
        workshopId: {type: string, format: uuid}
        waitlistId: {type: string, format: uuid}
        state: {$ref: "#/components/schemas/BeginnersWorkshopIntakeState"}
        origin: {$ref: "#/components/schemas/BeginnersWorkshopIntakeOrigin"}
        contactedAt: {type: string, format: date-time}
        placed: {type: string, enum: [waiting, restored, added]}
    BeginnersWorkshopFastTrackResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshopFastTrack"}
    BeginnersWorkshopFastTrackConflictError:
      description: |
        409 refusal of a Fast-track. The three `email_*` codes come from the
        staff "add a new person" path and carry `fields.email`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum:
                    - after_finalisation
                    - already_cancelled
                    - after_cutoff
                    - open_intake
                    - not_eligible
                    - email_on_waitlist
                    - email_is_principal
                    - email_has_pending_invitation
                    - concurrent_change
    BeginnersWorkshopFastTrackInvalidError:
      description: |
        422 refusal of a new person's details: `invalid_payload` (a missing
        or malformed field, an age under 16, a minor without a Guardian), or
        field messages only for a value the Waitlist refuses.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              properties:
                code:
                  type: string
                  enum: [invalid_payload]
    BeginnersWorkshopConflictError:
      description: 409 lifecycle conflict on a Beginners' Workshop command.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [after_finalisation, already_cancelled, contact_from_locked, fee_locked, staff_conflict, capacity_below_taken]
    BeginnersWorkshopCheckInConflictError:
      description: 409 on a door check-in or its undo.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [check_in_not_open, check_in_closed, not_paid]
    BeginnersWorkshopFinishConflictError:
      description: 409 on Finish workshop.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [after_finalisation, already_cancelled, check_in_not_open, payment_in_progress]
    BeginnersWorkshopInviteConflictError:
      description: 409 refusal of an Invitation handoff.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [not_finalised, not_attended, already_invited, already_joined, not_invitable, email_is_principal, email_has_pending_invitation, email_on_waitlist, concurrent_change]
    BeginnersWorkshopInviteInvalidError:
      description: 422 refusal of an Invitation handoff.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [incomplete_details]
    BeginnersWorkshopFollowUpStatus:
      type: string
      description: "`sent`: the Follow-up was queued. `scheduled`: it goes out at `at` (10:00 Dublin the morning after)."
      enum: [sent, scheduled]
    BeginnersWorkshopFollowUp:
      type: object
      required: [status, at]
      properties:
        status: {$ref: "#/components/schemas/BeginnersWorkshopFollowUpStatus"}
        at:
          type: string
          format: date-time
          description: When it was queued (`sent`) or goes out (`scheduled`).
    BeginnersWorkshopInvitable:
      type: object
      description: One Invitable person and the attended Intake to invite them from.
      required: [intakeId, workshopId, workshopDate, waitlistId, firstName, lastName, email, followUp]
      properties:
        intakeId: {type: string, format: uuid}
        workshopId: {type: string, format: uuid}
        workshopDate: {type: string, format: date, description: Europe/Dublin civil date}
        waitlistId: {type: string, format: uuid}
        firstName: {type: string, nullable: true}
        lastName: {type: string, nullable: true}
        email: {type: string, format: email}
        followUp: {$ref: "#/components/schemas/BeginnersWorkshopFollowUp"}
    BeginnersWorkshopInvitableResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/BeginnersWorkshopInvitable"}
    BeginnersWorkshopInvitation:
      type: object
      description: The Invitation handoff's result; the standing is now `invited`.
      required: [intakeId, workshopId, waitlistId, invitationId, standing]
      properties:
        intakeId: {type: string, format: uuid}
        workshopId: {type: string, format: uuid}
        waitlistId: {type: string, format: uuid}
        invitationId: {type: string, format: uuid}
        standing: {$ref: "#/components/schemas/WaitlistStatus"}
    BeginnersWorkshopInvitationResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/BeginnersWorkshopInvitation"}
    BeginnersWorkshopConsoleInvitations:
      type: object
      description: |
        "N attended · N invited · N joined": every attended Intake, and how
        many of those people's standing is now `invited` or `joined`.
      required: [attended, invited, joined]
      properties:
        attended: {type: integer, minimum: 0}
        invited: {type: integer, minimum: 0}
        joined: {type: integer, minimum: 0}
    BeginnersWorkshopInvalidError:
      description: |
        422 refusal on a Beginners' Workshop command. Domain reasons carry a
        `code`; plain validation failures carry `fields` only.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - invalid_workshop
                    - start_in_past
                    - invalid_payment_cutoff
                    - invalid_contact_from
                    - no_workshops
                    - too_many_workshops
                    - invalid_staff
                    - not_a_coach
                    - not_a_member
                    - invalid_note
                    - refund_choice_required
                    - invalid_refund_choice
    BeginnersWorkshopIntakeCommandConflictError:
      description: 409 refusal of a console Intake command.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum:
                    - already_paid
                    - intake_closed
                    - intake_not_paid
                    - carried_fee_paid
                    - nothing_to_refund
                    - already_requested
                    - already_invited
    OnboardingStartAcceptanceRequest:
      type: object
      required: [invitationId, email, dateOfBirth]
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        dateOfBirth: { type: string, format: date }
    OnboardingPaymentRequest:
      type: object
      required: [nextOfKinName, nextOfKinPhone]
      properties:
        nextOfKinName:
          type: string
          minLength: 1
        nextOfKinPhone:
          type: string
          minLength: 1
        stripeConfirmationToken:
          type: string
          description: Required for paid invitations and omitted for complimentary coach invitations.
        couponCode:
          type: string
        mandateContext:
          type: object
          additionalProperties: true
          description: Client mandate context needed for server-side Stripe confirmation.
    OnboardingAcceptanceStateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum:
                - awaitingDiscord
                - awaiting_oauth
                - discordVerified
                - discordCollision
                - discordUnavailable
                - restartVerification
                - restart_verification
                - paymentReady
                - paymentPending
                - paymentNeedsAction
                - paymentTerminal
                - accepted
            invitationEmail:
              type: string
              format: email
            discord:
              $ref: "#/components/schemas/OnboardingSafeDiscordPresentation"
            discordVerified:
              type: boolean
              description: Whether Discord proof has already been consumed into the durable Acceptance Attempt.
            retryAllowed:
              type: boolean
              description: Whether the current payment/finalization state permits an explicit client retry.
            expiresAt:
              type: string
              format: date-time
            complimentary:
              type: boolean
              description: True when the invitation requires no payment details or membership fees.
    OnboardingSafeDiscordPresentation:
      type: object
      description: Mutable display snapshot for account recognition; never an identity binding fact.
      properties:
        username:
          type: string
        avatarUrl:
          type: string
          format: uri
    InvitationCreateRequest:
      type: object
      required:
        - invites
      properties:
        invites:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvitationCreateInvite"
    InvitationCreateInvite:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - dateOfBirth
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        pricingTier:
          type: string
          enum:
            - standard
            - coach
            - student
          default: standard
          description: >-
            Membership discount tier resolved at acceptance. `coach` applies a
            100%-off forever coupon to both subscriptions; `student` applies a
            20%-off forever coupon scoped to the monthly product.
    InvitationCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            queued:
              type: boolean
              example: true
            job_id:
              type: integer
              description: Oban job ID
    InvitationDeleteRequest:
      type: object
      required:
        - invitationIds
      properties:
        invitationIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    InvitationResendCreateRequest:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
    InvitationResendCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            succeeded:
              type: integer
            failed:
              type: integer
    InvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - expired
        - revoked
      description: |
        Invitation lifecycle status. The list endpoint always filters to
        `pending` and `expired`; `accepted`/`revoked` rows are never returned.
        The field is still present in the DTO for UI badge rendering.
    InvitationListSortField:
      type: string
      enum:
        - email
        - status
        - expiresAt
        - createdAt
    InvitationListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - invitations
            - totalCount
            - limit
            - nextCursor
            - previousCursor
          properties:
            invitations:
              type: array
              items:
                $ref: "#/components/schemas/Invitation"
            totalCount:
              type: integer
              minimum: 0
              description: Exact `COUNT(*)`, not estimated.
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
            previousCursor:
              type: string
              nullable: true
    Invitation:
      type: object
      required:
        - id
        - email
        - status
        - pricingTier
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/InvitationStatus"
        pricingTier:
          type: string
          enum:
            - standard
            - coach
            - student
          description: Membership discount tier applied at acceptance.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PublicInvitation:
      type: object
      required:
        - id
        - status
        - invitationType
        - pricingTier
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitationType:
          type: string
          description: Domain invitation type used by the signup UI.
        pricingTier:
          type: string
          enum:
            - standard
            - coach
            - student
          description: Membership discount tier applied at acceptance.
        expiresAt:
          type: string
          format: date-time
    PublicInvitationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PublicInvitation"
    DineroAmount:
      type: object
      required:
        - amount
        - currency
        - precision
      properties:
        amount:
          type: integer
          description: Amount in minor currency units.
        currency:
          type: string
          example: EUR
        precision:
          type: integer
          example: 2
    InvitationPricing:
      type: object
      required:
        - proratedPrice
        - proratedMonthlyPrice
        - proratedAnnualPrice
        - monthlyFee
        - annualFee
        - discountPercentage
      properties:
        complimentary:
          type: boolean
          description: True when the invitation grants membership with no current or future membership fees.
        proratedPrice:
          $ref: "#/components/schemas/DineroAmount"
        proratedMonthlyPrice:
          $ref: "#/components/schemas/DineroAmount"
        proratedAnnualPrice:
          $ref: "#/components/schemas/DineroAmount"
        monthlyFee:
          $ref: "#/components/schemas/DineroAmount"
        annualFee:
          $ref: "#/components/schemas/DineroAmount"
        discountedMonthlyFee:
          $ref: "#/components/schemas/DineroAmount"
        discountedAnnualFee:
          $ref: "#/components/schemas/DineroAmount"
        coupon:
          type: string
        discountPercentage:
          type: number
    InvitationPricingResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InvitationPricing"
    InvitationVerifyRequest:
      type: object
