            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopRegistrationResponse"
        "404":
          description: Workshop or Checkout Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Workshop is full or the attendee is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Payment is incomplete, mismatched, or missing attendee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/registrations/{registrationId}/refund:
    post:
      operationId: workshops.refundRegistration
      tags:
        - Workshops
      summary: Refund a Workshop registration
      description: |
        Explicit coordinator refund command. Phoenix enforces the Workshop's
        refund eligibility rules, creates the refund record before contacting
        Stripe, and records Stripe failures as failed attempts. Requires
        `workshop_coordinator`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopRefundRequest"
      responses:
        "201":
          description: Refund attempt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopRefundResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Workshop registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Registration is not eligible for a refund or the reason is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe refund request failed; the failed attempt remains traceable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/attendance:
    patch:
      operationId: workshops.updateAttendance
      tags:
        - Workshops
      summary: Atomically record Workshop attendee attendance
      description: |
        Records attendance for a batch of active Workshop attendees. Phoenix
        derives the marker from the authenticated coordinator JWT, accepts only
        pending/confirmed registrations belonging to this Workshop, and rejects
        the entire batch if any update is invalid. Attendance is available only
        once the Workshop has started. Requires `workshop_coordinator`,
        `president`, or `admin`; `beginners_coordinator` is not authorized.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopAttendanceUpdateRequest"
      responses:
        "200":
          description: Attendance batch applied atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopAttendanceUpdateResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Workshop has not started, the batch is invalid, or an update targets a non-active attendee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      operationId: settings.index
      tags:
        - Settings
      summary: List allowlisted generic settings
      description: |
        Returns the generic admin-managed settings allowlisted for the
        generic Settings API: `hema_insurance_form_link`,
        `subscription_max_pause_months`, and `subscription_min_pause_days`.

        Domain-owned settings (e.g. `waitlist_open`) are intentionally not
        exposed here; they belong to their owning capability's API.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `committee_coordinator`, or `admin`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Allowlisted generic settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a settings admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/categories:
    get:
      operationId: inventoryCategories.index
      tags:
        - InventoryCategories
      summary: List equipment categories
      description: |
        Returns equipment categories ordered by name, each with an `itemCount`
        of inventory items in that category.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Equipment categories ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryCategories.create
      tags:
        - InventoryCategories
      summary: Create an equipment category
      description: |
        Creates a new equipment category. The `availableAttributes` array
        defines the dynamic attribute definitions items in this category may
        carry. Supported attribute `type` values: `text`, `select`, `number`,
        `boolean`. Select attributes must include `options`.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCategoryCreateRequest"
      responses:
        "201":
          description: The created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid category payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A category with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/categories/{id}:
    get:
      operationId: inventoryCategories.show
      tags:
        - InventoryCategories
      summary: Get one equipment category
      description: |
        Returns a single equipment category by id, including its `itemCount`.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The category id.
      responses:
        "200":
          description: The equipment category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No category exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryCategories.update
      tags:
        - InventoryCategories
      summary: Update an equipment category
      description: |
        Updates a single equipment category. Accepts the same writable fields
        as create (`name`, `description`, `availableAttributes`).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The category id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCategoryCreateRequest"
      responses:
        "200":
          description: The updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No category exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A category with the new name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid category payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: inventoryCategories.delete
      tags:
        - InventoryCategories
      summary: Delete an equipment category
      description: |
        Deletes an equipment category. The delete is rejected with `409` when
        any inventory items still reference the category; remove or reassign
        those items first.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The category id.
      responses:
        "204":
          description: The category was deleted
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No category exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The category is still referenced by inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers:
    get:
      operationId: inventoryContainers.index
      tags:
        - InventoryContainers
      summary: List inventory containers
      description: |
        Returns inventory containers as a flat list ordered by name, each
        annotated with its `itemCount` (the number of `inventory_items` rows
        directly in it) and a `parentContainer` summary (`{id, name}` or null).
        The UI rebuilds the parent/child hierarchy client-side from
        `parentContainerId`.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory containers ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryContainers.create
      tags:
        - InventoryContainers
      summary: Create an inventory container
      description: |
        Creates a new inventory container. Optionally nest it under a parent
        container via `parentContainerId`. `createdBy` is derived from the
        caller's Supabase JWT `sub`.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryContainerCreateRequest"
      responses:
        "201":
          description: The created container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid container payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers/{id}:
    get:
      operationId: inventoryContainers.show
      tags:
        - InventoryContainers
      summary: Get one inventory container with relations
      description: |
        Returns a single inventory container by id with its `parentContainer`
        summary, `childContainers` (`[{id, name}]`), and the `items` directly
        in it — each item carrying a `category` summary (`{id, name}`) and
        `quantity`/`outForMaintenance`. Item-level history is not embedded.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "200":
          description: The inventory container with relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerDetailResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryContainers.update
      tags:
        - InventoryContainers
      summary: Update an inventory container
      description: |
        Updates a single inventory container. Accepts the same writable
        fields as create (`name`, `description`, `parentContainerId`).

        Setting `parentContainerId` to the container itself or one of its
        descendants is rejected with `422` (circular-parent prevention); the
        UI also filters available parents client-side, but the server enforces
        the invariant for safety.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryContainerCreateRequest"
      responses:
        "200":
          description: The updated container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid payload, or `parentContainerId` would create a cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: inventoryContainers.delete
      tags:
        - InventoryContainers
      summary: Delete an inventory container
      description: |
        Deletes an inventory container. The delete is rejected with `409` when
        the container still directly contains inventory items; remove or move
        those items first. Child containers cascade-delete per the
        `containers.parent_container_id` `on_delete: :delete_all` foreign key;
        a child that itself holds items will surface as `409` via that cascade.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "204":
          description: The container was deleted
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The container still contains inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items:
    get:
      operationId: inventoryItems.index
      tags:
        - InventoryItems
      summary: List inventory items
      description: |
        Returns a cursor-paginated list of inventory items, newest first, each
        carrying `container` and `category` summaries.

        Filters (all optional): `categoryId`, `containerId`,
        `outForMaintenance` (boolean), and `search` (case-insensitive partial
        match against item notes, category name, and container name).

        Cursor is opaque and stable within the current filter set; pass the
        `nextCursor` from a previous response to fetch the next page. When the
        returned page is the last, `nextCursor` is `null`.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: containerId
          in: query
          schema:
            type: string
            format: uuid
        - name: outForMaintenance
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive partial match across notes, category name, and container name.
      responses:
        "200":
          description: Cursor-paginated inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryItems.create
      tags:
        - InventoryItems
      summary: Create an inventory item
      description: |
        Creates a new inventory item. `createdBy` is derived from the caller's
        JWT `sub` and is never user-writable. On insert, an `inventory_history`
        row with action `created` is recorded in the same transaction
        (`changedBy` = caller `sub`, `newContainerId` = the item's container).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemCreateRequest"
      responses:
        "201":
          description: The created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid item payload or unknown container/category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items/{id}:
    get:
      operationId: inventoryItems.show
      tags:
        - InventoryItems
      summary: Get one inventory item
      description: |
        Returns a single inventory item by id with `container` and `category`
        summaries. Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      responses:
        "200":
          description: The inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryItems.update
      tags:
        - InventoryItems
      summary: Update an inventory item
      description: |
        Updates a single inventory item. Accepts the same writable fields as
        create, all optional on update (PATCH semantics). `updatedBy` is set
        from the caller's JWT `sub`.

        On a successful update, an `inventory_history` row with action
        `updated` is recorded in the same transaction (`changedBy` = caller
        `sub`). If `containerId` changed, the move is additionally recorded
        with action `moved` and the old/new container ids (preserves the
        SvelteKit `ItemService.moveToContainer` history behavior); the `moved`
        row is written before the `updated` row so the chronological order is
        move → update.

        Setting `containerId` to a missing container returns `422`. Setting
        `categoryId` to a missing category returns `422`.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemCreateRequest"
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid item payload or unknown container/category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: inventoryItems.delete
      tags:
        - InventoryItems
      summary: Delete an inventory item
      description: |
        Deletes a single inventory item. `inventory_history.item_id` is
        `on_delete: :delete_all`, so the item's history rows are cascade-removed
        with it; no dedicated `deleted` history row is recorded (it would be
        cascade-wiped and is pointless).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      responses:
        "204":
          description: Item deleted
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items/{id}/history:
    get:
      operationId: inventoryItems.history
      tags:
        - InventoryItems
      summary: List history for one inventory item
      description: |
        Returns the most recent `inventory_history` rows for a single item,
        newest first, each with `oldContainer` and `newContainer` name
        summaries. The item's `attributes` snapshot is not embedded in history
        rows (the source schema stores it on the item, not the history row).

        Requires a valid Supabase JWT (any authenticated member). Returns
        `404` when the item id does not exist.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: History rows for the item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemHistoryListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items/{id}/move:
    post:
      operationId: inventoryItems.move
      tags:
        - InventoryItems
      summary: Move an inventory item to a different container
      description: |
        Moves a single inventory item to a different container in one transaction
        and records an `inventory_history` row with action `moved` carrying the
        old/new container ids and the optional `notes` (preserves the prior
        SvelteKit `ItemService.moveToContainer` behavior as a dedicated command
        endpoint — ALE-108).

        `updatedBy` is set from the caller's JWT `sub`. The item's other fields
        (quantity, category, attributes, maintenance flag) are left untouched; use
        `PATCH /inventory/items/{id}` for general edits.

        Setting `containerId` to the item's current container is a no-op move
        (still records a `moved` history row with identical old/new container,
        mirroring the standalone move command's contract). Setting `containerId`
        to a missing container returns `422`.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemMoveRequest"
      responses:
        "200":
          description: The moved item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid move payload or unknown container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items/{id}/maintenance:
    post:
      operationId: inventoryItems.maintenance
      tags:
        - InventoryItems
      summary: Toggle an inventory item's maintenance state
      description: |
        Sets an inventory item's `outForMaintenance` flag and records an
        `inventory_history` row in the same transaction: action
        `maintenance_out` when the flag is set to `true`, action `maintenance_in`
        when set to `false` (ALE-108). `updatedBy` is set from the caller's JWT
        `sub`; the optional `notes` is stored on the history row.

        The previous SvelteKit `ItemService.markMaintenance` toggled the flag
        without recording history; this command endpoint preserves the toggle
        and adds the audit side effect required by the Inventory contract.

        Sending the same value the item already holds is allowed and still
        records a `maintenance_out`/`maintenance_in` row (explicit command
        semantics — the caller chose to mark it).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemMaintenanceRequest"
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid maintenance payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/history:
    get:
      operationId: inventoryHistory.index
      tags:
        - InventoryHistory
      summary: List recent global inventory activity
      description: |
        Returns the most recent `inventory_history` rows across all inventory
        items, newest first, each carrying `oldContainer`/`newContainer` name
        summaries and an `item` summary (`{ id, attributes }`) so the UI can
        render the affected item's display name without a second lookup. The
        per-item `GET /inventory/items/{id}/history` endpoint leaves `item` null
        because the caller already knows the item.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Recent global inventory activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemHistoryListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/stats:
    get:
      operationId: inventoryDashboard.stats
      tags:
        - InventoryDashboard
      summary: Get inventory dashboard counts
      description: |
        Returns aggregate counts for containers, equipment categories, items,
        and items currently out for maintenance. Requires a valid Supabase JWT
        from any authenticated member.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory dashboard counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryDashboardStatsResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings/{key}:
    patch:
      operationId: settings.update
      tags:
        - Settings
      summary: Update one allowlisted generic setting
      description: |
        Updates a single allowlisted generic setting by key. The request body
        is `{ "value": ... }` where the value type depends on the key:

        - `hema_insurance_form_link`: non-empty http/https URL string
        - `subscription_max_pause_months`: integer, valid range 1..24
        - `subscription_min_pause_days`: integer, valid range 1..365

        Unknown or non-allowlisted keys return `404`. Invalid values return
        `422`. The `type` column is not part of the public contract.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `committee_coordinator`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The setting key (must be allowlisted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: The updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsUpdateResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a settings admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or non-allowlisted setting key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid value for the given key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/magic-link:
    post:
      operationId: auth.requestMagicLink
      tags:
        - AuthSession
      summary: Request a magic-link sign-in email
      description: |
        Enqueues a magic-link email to the Principal with the given email, if
        any. Non-enumerating: always returns `200 {"data":{"sent":true}}` for a
        well-formed email whether or not a Principal exists. Rate-limited to
        3 requests per email per 15 minutes and 10 per IP per hour; over-the-
        limit requests return the same `200` body (the plug halts before the
        controller). ALE-164 replaces the Supabase `signInWithOtp` browser
        path with this endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Magic link requested (or rate-limited with the same body)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - sent
                    properties:
                      sent:
                        type: boolean
                        description: Always `true`.

  /auth/magic-link/verify:
    post:
      operationId: auth.verifyMagicLink
      tags:
        - AuthSession
      summary: Consume a magic link and establish a session
      description: |
        Verifies the magic-link token, creates a DB-backed session, and sets
        the signed `_dhc_session` cookie. Returns the session projection. An
        invalid, expired, or reused token returns `401` with the same generic
        body (non-enumerating). A valid token for an inactive Principal is
        consumed but returns `403` with a clear membership message and creates
        no session. ALE-164 routes the dashboard magic-link landing page here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: URL-safe Base64-encoded magic-link token.
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionProjection"
        "401":
          description: Invalid, expired, or reused token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Valid token for an inactive Principal; no session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/discord/link:
    get:
      operationId: auth.linkDiscord
      tags:
        - AuthSession
      summary: Start authenticated Discord identity linking
      description: |
        Starts Discord OAuth for the currently authenticated Principal. The
        initiating Phoenix Session is bound to the OAuth flow and revalidated
        on callback before the Discord identity is linked. Discord email is
        retained as metadata and need not match the Principal email.
      security:
        - cookieSession: []
      responses:
        "302":
          description: Redirect to Discord authorization
        "401":
          description: Missing, expired, or inactive session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/session:
    get:
      operationId: auth.showSession
      tags:
        - AuthSession
      summary: Read the current session projection
      description: |
        Returns `{ principal: { id, email }, roles }` for the session carried
        by the `_dhc_session` cookie. Used by SvelteKit SSR and the browser
        to read who is signed in. Returns `401` when there is no valid,
        active session. ALE-164: the dashboard consumes this instead of the
        Supabase `getSession()` projection.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Current session projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionProjection"
        "401":
          description: Missing, expired, or inactive session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: auth.deleteSession
      tags:
        - AuthSession
      summary: Sign out the current device
      description: |
        Revokes the current session token and clears the `_dhc_session`
        cookie. Idempotent. ALE-164 replaces `supabase.auth.signOut()` on the
        dashboard.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - signedOut
                    properties:
                      signedOut:
                        type: boolean
                        description: Always `true`.

  /auth/socket-token:
    get:
      operationId: auth.socketToken
      tags:
        - AuthSession
      summary: Exchange the session cookie for a short-lived socket token
      description: |
        ALE-164: the dashboard browser cannot read the HTTP-only
        `_dhc_session` cookie to pass it via the Phoenix JS `authToken` socket
        option, and `new WebSocket(url, protocols)` has no `withCredentials`
        so a cross-origin socket cannot send the cookie. This endpoint
        exchanges the cookie for a short-lived, JS-readable, DB-backed socket
        token the browser can pass as `authToken`. `UserSocket.connect/3`
        verifies it through the same auth boundary.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Socket token issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - socketToken
                    properties:
                      socketToken:
                        type: string
                        description: |
                          URL-safe Base64-encoded opaque socket token. Pass
                          as the `authToken` option to the Phoenix JS `Socket`
                          constructor.
        "401":
          description: Missing, expired, or inactive session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieSession:
      type: apiKey
      in: cookie
      name: _dhc_session
      description: |
        The signed `_dhc_session` cookie set by `POST /api/auth/magic-link/verify`.
        Browsers send it automatically with `credentials: 'include'`; SvelteKit
        SSR forwards it explicitly. ALE-164: the dashboard's primary auth
        credential. `RequireAuth` accepts this cookie in addition to the
        transitional Supabase bearer JWT (`bearerAuth`) until the ALE-163
        cutover.
    onboardingAcceptanceSession:
      type: apiKey
      in: cookie
      name: _dhc_onboarding_acceptance
      description: |
        Short-lived signed HttpOnly browser proof for one Invitation Acceptance.
        It is transport state only and is never a DHC authenticated Session.
  parameters:
    WorkshopId:
      name: workshopId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The Workshop id.
  schemas:
    OnboardingStartAcceptanceRequest:
      type: object
      required: [invitationId, email, dateOfBirth]
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        dateOfBirth: { type: string, format: date }
    OnboardingPaymentRequest:
      type: object
      required: [nextOfKinName, nextOfKinPhone, stripeConfirmationToken]
      properties:
        nextOfKinName:
          type: string
          minLength: 1
        nextOfKinPhone:
          type: string
          minLength: 1
        stripeConfirmationToken:
          type: string
          minLength: 1
        couponCode:
          type: string
        mandateContext:
          type: object
          additionalProperties: true
          description: Client mandate context needed for server-side Stripe confirmation.
    OnboardingAcceptanceStateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum:
                - awaitingDiscord
                - awaiting_oauth
                - discordVerified
                - discordCollision
                - discordUnavailable
                - restartVerification
                - restart_verification
                - paymentReady
                - paymentPending
                - paymentNeedsAction
                - paymentTerminal
                - accepted
            invitationEmail:
              type: string
              format: email
            discord:
              $ref: "#/components/schemas/OnboardingSafeDiscordPresentation"
            discordVerified:
              type: boolean
              description: Whether Discord proof has already been consumed into the durable Acceptance Attempt.
            retryAllowed:
              type: boolean
              description: Whether the current payment/finalization state permits an explicit client retry.
            expiresAt:
              type: string
              format: date-time
    OnboardingSafeDiscordPresentation:
      type: object
      description: Mutable display snapshot for account recognition; never an identity binding fact.
      properties:
        username:
          type: string
        avatarUrl:
          type: string
          format: uri
    InvitationCreateRequest:
      type: object
      required:
        - invites
      properties:
        invites:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: "#/components/schemas/InvitationCreateInvite"
              - type: string
                format: uuid
                description: Waitlist entry ID to convert into an invitation.
    InvitationCreateInvite:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - dateOfBirth
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
    InvitationCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            queued:
              type: boolean
              example: true
            job_id:
              type: integer
              description: Oban job ID
    InvitationDeleteRequest:
      type: object
      required:
        - invitationIds
      properties:
        invitationIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    InvitationResendCreateRequest:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
    InvitationResendCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            succeeded:
              type: integer
            failed:
              type: integer
    InvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - expired
        - revoked
      description: |
        Invitation lifecycle status. The list endpoint always filters to
        `pending` and `expired`; `accepted`/`revoked` rows are never returned.
        The field is still present in the DTO for UI badge rendering.
    InvitationListSortField:
      type: string
      enum:
        - email
        - status
        - expiresAt
        - createdAt
    InvitationListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - invitations
            - totalCount
            - limit
            - nextCursor
            - previousCursor
          properties:
            invitations:
              type: array
              items:
                $ref: "#/components/schemas/Invitation"
            totalCount:
              type: integer
              minimum: 0
              description: Exact `COUNT(*)`, not estimated.
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
            previousCursor:
              type: string
              nullable: true
    Invitation:
      type: object
      required:
        - id
        - email
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PublicInvitation:
      type: object
      required:
        - id
        - status
        - invitationType
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InvitationStatus"
        invitationType:
          type: string
          description: Domain invitation type used by the signup UI.
        expiresAt:
          type: string
          format: date-time
    PublicInvitationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PublicInvitation"
    DineroAmount:
      type: object
      required:
        - amount
        - currency
        - precision
      properties:
        amount:
          type: integer
          description: Amount in minor currency units.
        currency:
          type: string
          example: EUR
        precision:
          type: integer
          example: 2
    InvitationPricing:
      type: object
      required:
        - proratedPrice
        - proratedMonthlyPrice
        - proratedAnnualPrice
        - monthlyFee
        - annualFee
        - discountPercentage
      properties:
        proratedPrice:
          $ref: "#/components/schemas/DineroAmount"
        proratedMonthlyPrice:
          $ref: "#/components/schemas/DineroAmount"
        proratedAnnualPrice:
          $ref: "#/components/schemas/DineroAmount"
        monthlyFee:
          $ref: "#/components/schemas/DineroAmount"
        annualFee:
          $ref: "#/components/schemas/DineroAmount"
        discountedMonthlyFee:
          $ref: "#/components/schemas/DineroAmount"
        discountedAnnualFee:
          $ref: "#/components/schemas/DineroAmount"
        coupon:
          type: string
        discountPercentage:
          type: number
    InvitationPricingResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InvitationPricing"
    InvitationVerifyRequest:
      type: object
      required:
        - email
        - dateOfBirth
      properties:
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          format: date
    InvitationVerifyResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - verified
          properties:
            verified:
              type: boolean
              description: Always true when credentials verify successfully.
    InvitationAcceptRequest:
      type: object
      required:
        - nextOfKinName
        - nextOfKinPhone
        - stripeConfirmationToken
      properties:
        nextOfKinName:
          type: string
          minLength: 1
        nextOfKinPhone:
          type: string
          minLength: 1
        stripeConfirmationToken:
          type: string
          minLength: 1
        couponCode:
          type: string
        mandateContext:
          type: object
          additionalProperties: true
          description: Client mandate context needed for Stripe confirmation.
    InvitationAcceptResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accepted
            - memberId
          properties:
            accepted:
              type: boolean
              description: Always true when the invitation is accepted successfully.
            memberId:
              type: string
              format: uuid
    WaitlistStatusResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - isOpen
          properties:
            isOpen:
              type: boolean
              description: Whether the public waitlist accepts registrations.
    WaitlistStatusUpdateRequest:
      type: object
      required:
        - isOpen
      properties:
        isOpen:
          type: boolean
    WaitlistAnalyticsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - totalCount
            - averageAge
            - genderDistribution
            - ageDistribution
          properties:
            totalCount:
              type: integer
              minimum: 0
            averageAge:
              type: number
              format: double
              minimum: 0
            genderDistribution:
              type: array
              items:
                $ref: "#/components/schemas/WaitlistGenderDistributionItem"
            ageDistribution:
              type: array
              items:
                $ref: "#/components/schemas/WaitlistAgeDistributionItem"
    WaitlistGenderDistributionItem:
      type: object
      required:
        - gender
        - value
      properties:
        gender:
          type: string
        value:
          type: integer
          minimum: 0
    WaitlistAgeDistributionItem:
      type: object
      required:
        - age
        - value
      properties:
        age:
          type: integer
          minimum: 0
        value:
          type: integer
          minimum: 0
    WaitlistStatus:
      type: string
      enum:
        - waiting
        - invited
        - paid
        - deferred
        - cancelled
        - completed
        - no_reply
        - joined
    SocialMediaConsent:
      type: string
      enum:
        - no
        - yes_recognizable
        - yes_unrecognizable
    WaitlistEntryCreateRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - dateOfBirth
        - pronouns
        - gender
        - medicalConditions
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
