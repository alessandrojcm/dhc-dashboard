  /members/{memberId}/membership/resume:
    post:
      operationId: membership.resume
      tags:
        - Membership
      summary: Resume a member's paused subscription
      description: |
        Resumes the member's paused Stripe membership subscription and clears
        `subscription_paused_until`. Stripe is source of truth (ADR-0008): the
        DB write only happens after Stripe confirms. 409 if not paused or no
        paused membership subscription is found. Self-or-broad-committee auth.
        Returns the full flat Member DTO.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
