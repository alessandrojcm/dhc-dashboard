  /members:
    get:
      operationId: members.list
      tags:
        - Members
      summary: List members
      description: |
        Returns a domain-shaped, cursor-paginated list of members for the
        dashboard table, replacing the browser-side PostgREST read over
        `member_management_view`.

        `membershipStatus` is computed server-side, reproducing the legacy
        view's CASE: `inactive` when `user_profiles.is_active = false`;
        `paused` when `member_profiles.subscription_paused_until` is not null
        and greater than `now()`; otherwise `active`. This is distinct from
        the Member's `isActive` flag — a paused member has
        `isActive: true, membershipStatus: "paused"`.

        Member email is read directly from `auth.users` via the `AuthUser`
        schema (no PostgREST-era helper function). Internal/leaky fields
        (`searchText`, `userProfileId`, `createdAt`, `updatedAt`, `roles`,
        `additionalData`, `fromWaitlistId`, `waitlistRegistrationDate`) are
        not exposed.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of the
        broad committee roles: `admin`, `president`, `treasurer`,
        `committee_coordinator`, `sparring_coordinator`, `workshop_coordinator`,
        `beginners_coordinator`, `quartermaster`, `pr_manager`,
        `volunteer_coordinator`, `research_coordinator`, or `coach`. A `member`
        role 403s; a missing token 401s.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response. Binds to the query params (limit, sort, direction, membershipStatus, q); a mismatched cursor returns 400.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query over `user_profiles.search_text`.
        - name: membershipStatus
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of membership statuses to include. Absent or
            empty returns all statuses (no filter). Example: `active,paused`.
            Valid values: `active`, `inactive`, `paused`.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/MembersListSortField"
            default: lastName
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Cursor-paginated members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a broad committee role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/insurance-form:
    get:
      operationId: members.insuranceForm
      tags:
        - Members
      summary: Read the member insurance form link
      description: |
        Returns the URL of the HEMA insurance form link configured for members.

        Exposes a specific domain read, not a generic settings proxy: the
        `Dhc.Members` context owns the `hema_insurance_form_link` settings read.

        Any authenticated user (valid Supabase JWT) may read this; no committee
        role is required, mirroring the `settings` SELECT RLS policy
        (`USING (true)` for authenticated). A member can read the insurance
        form link on their own profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insurance form link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersInsuranceFormResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/analytics:
    get:
      operationId: members.analytics
      tags:
        - Members
      summary: Read members analytics
      description: |
        Returns dashboard analytics for active members, computed server-side
        over `member_profiles` joined to `user_profiles` where `is_active = true`.

        Replaces the five browser-side PostgREST aggregate queries over
        `member_management_view` with a single domain-shaped read. The
        `preferred_weapon[]` array is unnested and counted in SQL so the
        browser no longer downloads every active member's weapon array to
        count it in JavaScript. Raw enum strings are returned for weapons;
        the UI keeps doing display prettification.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of the
        broad committee roles: `admin`, `president`, `treasurer`,
        `committee_coordinator`, `sparring_coordinator`, `workshop_coordinator`,
        `beginners_coordinator`, `quartermaster`, `pr_manager`,
        `volunteer_coordinator`, `research_coordinator`, or `coach`. This
        mirrors the `user_profiles` SELECT RLS policy for broad committee
        roles. A `member` role 403s; a missing token 401s.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersAnalyticsResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a broad committee role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/me:
    get:
      operationId: members.me
      tags:
        - Members
      summary: Read the current user's dashboard identity
      description: |
        Returns the authenticated user's identity, contact details, optional
        Stripe customer reference, and JWT roles. Replaces the browser-side
        user_profiles/user_roles reads and get_current_user_with_profile RPC
        used by the dashboard shell.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user profile exists for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}:
    get:
      operationId: members.show
      tags:
        - Members
      summary: Read a single member
      description: |
        Returns the flat Member DTO (same shape as `GET /members`) for one
        member: Member profile facts plus the Membership state projection
        fields contributed by `Dhc.Membership`. Replaces the PostgREST-era
        `get_member_data` RPC. Self-or-broad-committee auth: a member may
        read their own record (`JWT sub == {memberId}`); any broad committee
        role may read any member.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Supabase user id (`auth.users.id`) of the member.
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is neither the member nor a broad committee role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      operationId: members.update
      tags:
        - Members
      summary: Update a member's profile facts
      description: |
        Partial update of Member profile facts (only the fields present in the
        body are written). Replaces the PostgREST-era `update_member_data`
        RPC. `isActive` is NOT writable — it is a Stripe-webhook projection
        (ADR-0008); sending it returns 422. When name or phone changes, a
        best-effort `customers.update` echoes to Stripe (Member is SoT for
        customer facts); a Stripe failure still returns 200 and the periodic
        `Dhc.StripeSync` batch reconciles later. Self-or-broad-committee auth.
        Returns the full flat Member DTO.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Supabase user id of the member to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdateRequest"
      responses:
        "200":
          description: The updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is neither the member nor a broad committee role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid update payload (e.g. isActive present, or a field failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/membership/pause:
    post:
      operationId: membership.pause
      tags:
        - Membership
      summary: Pause a member's subscription
      description: |
        Pauses the member's Stripe membership subscription and writes the
        confirmed `resumes_at` to `subscription_paused_until`. Stripe is the
        source of truth (ADR-0008): the DB write only happens after Stripe
        confirms. 409 if no active membership subscription exists; 404 if the
        member/customer is missing. Self-or-broad-committee auth (same as
        `GET /members/{id}`). `pauseUntil` must be 1 day–6 months from now.
        Returns the full flat Member DTO.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Supabase user id of the member whose subscription to pause.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipPauseRequest"
      responses:
        "200":
          description: Subscription paused; returns the updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user is neither the member nor a broad committee role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member/customer record exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No active membership subscription found for this customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid pause payload (e.g. pauseUntil out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe rejected the pause call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/billing-portal:
    post:
      operationId: membership.billingPortal
      tags:
        - Membership
      summary: Create a Stripe Billing Portal session
      description: |
        Creates a short-lived Stripe Billing Portal URL for the member's Stripe
        customer. Self-or-broad-committee auth, matching other membership commands.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPortalRequest"
      responses:
        "200":
