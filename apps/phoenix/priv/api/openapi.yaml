          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            No member/customer record exists for the given id. Also returned, indistinguishably, when the
            caller is neither the member nor holds the owner-scoped
            `members.profile.*` capability (the member is concealed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Subscription is not paused, or no paused membership subscription found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe rejected the resume call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/membership/reactivate:
    post:
      operationId: membership.reactivate
      tags:
        - Membership
      summary: Reactivate an inactive member's membership
      description: |
        Creates fresh monthly + annual membership subscriptions against the
        member's previously saved SEPA Direct Debit payment method, charging
        off-session. No mandate is collected — the mandate already attached to
        the saved method is reused, so the first-invoice confirmation runs
        without `mandate_data`. Async SEPA settlement surfaces as a
        `pending`/`needs_action` `paymentState`, not an error.

        The operator-chosen start date anchors the monthly subscription via
        Stripe's `billing_cycle_anchor`: the first invoice raised today covers
        the prorated remainder up to the anchor, then full periods bill from
        the anchor onward.

        The annual fee starts per `annualFeeMode`: `prorated_now` (default)
        keeps signup semantics — anchored at next January and charged prorated
        for the remainder of this year; `deferred_next_year` creates the
        annual subscription immediately with a free trial ending at next
        January's anchor, so nothing is charged for the annual fee until that
        renewal date (the Stripe sync treats trialing coverage as active).

        Restricted to officers with billing authority — `admin`, `president`,
        `treasurer`, `committee_coordinator` only. NOT self-or-admin and NOT
        the broader members-admin role list, because this mints new charges.
        Retries with identical params are idempotent: Stripe idempotency keys
        are derived from the member id, requested start date, and annual fee
        mode — so a retry after switching modes reaches Stripe as fresh
        requests instead of replaying the other mode's stored responses.

        Distinct error conditions: `409` when the member already has an active
        or paused/trialing membership subscription; `409` with
        `code: no_saved_payment_method` when the customer has no usable saved
        SEPA method (the UI offers the billing portal as manual fallback);
        `404` unknown member/customer; `403` non-committee caller; `422`
        invalid start date; `502` Stripe failure.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The member to reactivate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipReactivateRequest"
      responses:
        "200":
          description: |
            Subscriptions created and first invoices confirmed off-session.
            `paymentState` reports the async SEPA settlement outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipReactivateResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not admin, president, treasurer, or committee_coordinator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member/customer record exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Member already has an active or paused membership subscription,
            or has no usable saved SEPA payment method (`code:
            no_saved_payment_method`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid payload (e.g. startDate not a date, in the past, or too far ahead)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe rejected part of the reactivation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/membership/reactivation-preview:
    get:
      operationId: membership.reactivationPreview
      tags:
        - Membership
      summary: Preview the saved SEPA method a reactivation would charge
      description: |
        Read-side companion to `POST /members/{memberId}/membership/reactivate`:
        projects the member's saved SEPA Direct Debit payment method
        from Stripe so the operator modal can show what would be charged
        BEFORE any charge happens. Performs no mutation.

        `savedPaymentMethod` is `null` when the customer has no usable saved
        SEPA method. The UI then offers the billing portal as the manual
        fallback instead of a confirmation button. The same lookup the
        reactivation command performs is used, so "preview shows a method"
        implies "confirm will not fail with `no_saved_payment_method`"
        (modulo races).

        Restricted to the same officers with billing authority as the
        reactivation command itself (`admin`, `president`, `treasurer`,
        `committee_coordinator`) because saved payment data must not leak to
        the broader members-admin list.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The member whose saved payment method to preview.
      responses:
        "200":
          description: |
            The saved payment method a reactivation would charge, or `null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipReactivationPreviewResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not admin, president, treasurer, or committee_coordinator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member/customer record exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe payment-method lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/membership/reactivation-preview/amounts:
    get:
      operationId: membership.reactivationPreviewAmounts
      tags:
        - Membership
      summary: Preview the amounts a reactivation would charge
      description: |
        Read-side companion to `POST /members/{memberId}/membership/reactivate`:
        projects what Stripe will charge for a reactivation starting
        on the operator-chosen `startDate` — the amount due today plus the
        upcoming recurring fees. Performs no mutation.

        The optional `annualFeeMode` query param mirrors the command's annual
        fee choice so the previewed numbers always match what the
        chosen mode would actually charge.

        All amounts are computed by Stripe's invoice-preview machinery for a
        hypothetical subscription pair with exactly the parameters the command
        will use (monthly anchored at the start date when it is in the future;
        annual anchored at next January's renewal date), so the operator sees
        the real numbers instead of client-side approximations.

        Independent of the saved-payment-method preview by design: this read
        may fail without invalidating it, and the UI hides the amounts while
        keeping the form functional (graceful degradation). Performs no
        reactivatability guard either — the command's guards stay authoritative
        at POST time.

        Restricted to the same officers with billing authority as the
        reactivation command itself (`admin`, `president`, `treasurer`,
        `committee_coordinator`).
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The member whose reactivation amounts to preview.
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: |
            Operator-chosen membership start date (YYYY-MM-DD), within the same
            window the reactivation command accepts (today up to one year
            ahead).
        - name: annualFeeMode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MembershipReactivateAnnualFeeMode"
          description: |
            Mirrors the reactivation command's annual fee choice.
            In `deferred_next_year` mode nothing is charged for the annual fee
            today, so `dueToday` covers only the monthly subscription while
            `annualFee` previews the full fee that will bill at next January's
            anchor. Defaults to `prorated_now`.
      responses:
        "200":
          description: The Stripe-computed amounts for the chosen start date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipReactivationAmountsResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not admin, president, treasurer, or committee_coordinator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No member/customer record exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: startDate missing, not a date, or outside the allowed window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe invoice-preview computation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /options:
