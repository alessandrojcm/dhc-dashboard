openapi: 3.0.3
info:
  title: DHC Dashboard API
  description: |
    Dublin Hema Club dashboard API.

    **Auth**: Phoenix validates the signed `_dhc_session` cookie
    (`cookieSession`). Target Inventory and session operations declare
    that scheme. Remaining `bearerAuth` entries are transitional leftover
    on unmigrated operations.
  version: 0.1.0

servers:
  - url: /api
    description: Relative path (same origin)

tags:
  - name: TrainingAnnouncements
    description: Committee-managed Training Announcements and absolute-date exceptions.
    x-context: Dhc.TrainingAnnouncements
    x-resource: Announcement
  - name: Inventory
    description: |
      Target Inventory capability (ALE-272 / ALE-283c / ALE-284c / ALE-289).
      Category management, container management, target Items, member
      catalog, own loans, operator loans, and the shared queue live here
      under the one `/api/inventory` root.

      Target item operations live on the freed `/inventory/items` URLs;
      the legacy quantity/JSON-attributes/history slice is gone.
      Operator loan commands and the shared queue stay under
      `/inventory/operator/loans` — they have no legacy twin.
    x-context: Dhc.Inventory
    x-resource: PropertyDefinition
  - name: Members
    description: |
      Member profile facts (identity, contact, preferred weapon), aggregate
      member reads, and cross-cutting enum-option reads (gender, preferred
      weapon) shared by the authenticated member edit form and the public
      waitlist intake. Profile facts are owned by the Dhc.Members context;
      membership state fields on the same DTOs are contributed by
      Dhc.Membership. Enum options are sourced from Postgres enum types at
      runtime and are public (no auth).
    x-context: Dhc.Members
    x-resource: Member
  - name: Membership
    description: |
      A Member's subscription/access state (active, inactive, paused) and the
      Stripe-facing pause/resume/reactivate commands. Owned by the
      Dhc.Membership context; shares storage with Dhc.Members
      (`subscription_paused_until` lives in `member_profiles`) — the boundary
      is expressed in the contract and context functions, not in a separate
      schema (see ADR-0007).
    x-context: Dhc.Membership
    x-resource: Membership
  - name: Workshops
    description: Workshop reads and coordinator management lifecycle commands.
    x-context: Dhc.Workshops
    x-resource: Workshop
  - name: AuthSession
    description: |
      Phoenix-owned session auth API. Magic-link sign-in,
      session projection read, sign-out, and socket-token exchange. The
      dashboard authenticates through the signed `_dhc_session` cookie
       (`cookieSession` security scheme) instead of the Supabase bearer JWT.
  - name: Onboarding
    description: Protected, pre-payment Invitation Acceptance journey.
  - name: DiscordDoctor
    description: Live Discord server reconciliation for authorized committee administrators.
    x-context: Dhc.Discord
    x-resource: DoctorReport

  - name: MemberAnnouncements
    description: |
      Committee emails to many members at once (ADR 0028). The body is a
      Tiptap rich-text document rendered by Phoenix into the code-authored
      shell; recipients are BCC'd and delivered through Resend's batch API.
      Active members receive it by default; inactive members are opt-in.
    x-context: Dhc.MemberAnnouncements
    x-resource: Announcement

  - name: BeginnersWorkshops
    description: |
      Beginners' Workshops (ADR 0029): the club's intake events between the
      Waitlist and Invitation. Never a Workshop, never listed publicly or
      announced. Every write is one command on the `Dhc.BeginnersWorkshops`
      boundary. Its slices share the one `/api/beginners-workshops` root; the
      Intake Email template slice (`beginnersWorkshopEmailTemplates`, ALE-383)
      edits the club-wide subject and body of every Intake Email type.
    x-context: Dhc.BeginnersWorkshops
    x-resource: BeginnersWorkshop

paths:
  /training-announcements/occurrences/window:
    get:
      operationId: trainingAnnouncementOccurrences.window
      tags: [TrainingAnnouncements]
      summary: Calendar window with retained evidence and prospective occurrences
      security: [{cookieSession: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Inclusive window of at most 62 Dublin dates, from no earlier than the retention horizon. Delivery rows win over projections; day-before holiday items use their send date.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingAnnouncementOccurrenceListResponse'}
        '401': {$ref: '#/components/responses/TrainingAnnouncementUnauthorized'}
        '403': {$ref: '#/components/responses/TrainingAnnouncementForbidden'}
        '422': {$ref: '#/components/responses/TrainingAnnouncementInvalid'}
  /training-announcements/{id}/occurrences:
    get:
      operationId: trainingAnnouncementOccurrences.listForAnnouncement
      tags: [TrainingAnnouncements]
      summary: Upcoming occurrences or recent delivery evidence for a rail card
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/TrainingAnnouncementId'}
        - {name: direction, in: query, schema: {type: string, enum: [upcoming, recent], default: upcoming}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 3}}
      responses:
        '200':
          description: Upcoming in send order, including the Holiday Announcements this announcement currently drives; recent evidence newest first, never Holiday Announcement items. At most limit items.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingAnnouncementOccurrenceListResponse'}
        '401': {$ref: '#/components/responses/TrainingAnnouncementUnauthorized'}
        '403': {$ref: '#/components/responses/TrainingAnnouncementForbidden'}
        '404': {$ref: '#/components/responses/TrainingAnnouncementNotFound'}
        '422': {$ref: '#/components/responses/TrainingAnnouncementInvalid'}
  /training-announcements/{id}/occurrences/{date}:
    get:
      operationId: trainingAnnouncementOccurrences.get
      tags: [TrainingAnnouncements]
      summary: Announcement Occurrence inspector, never a Holiday Announcement
      security: [{cookieSession: []}]
      parameters:
        - {$ref: '#/components/parameters/TrainingAnnouncementId'}
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Retained row or prospective occurrence; an elapsed slot without evidence is absent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainingAnnouncementOccurrenceResponse'}
        '401': {$ref: '#/components/responses/TrainingAnnouncementUnauthorized'}
        '403': {$ref: '#/components/responses/TrainingAnnouncementForbidden'}
        '404': {$ref: '#/components/responses/TrainingAnnouncementNotFound'}
        '422': {$ref: '#/components/responses/TrainingAnnouncementInvalid'}
  /training-announcements:
    get:
      operationId: trainingAnnouncements.list
      tags: [TrainingAnnouncements]
      summary: List announcements (retired excluded by default)
      security: [{cookieSession: []}]
      parameters:
        - name: includeRetired
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementListResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "422": {$ref: "#/components/responses/TrainingAnnouncementInvalid"}
    post:
      operationId: trainingAnnouncements.create
      tags: [TrainingAnnouncements]
      summary: Create an announcement and its first future send
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainingAnnouncementCreateRequest"}
      responses:
        "201":
          description: Created with advisory warnings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementScheduleResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "422": {$ref: "#/components/responses/TrainingAnnouncementInvalid"}
  /training-announcements/preview-copy:
    post:
      operationId: trainingAnnouncements.previewCopy
      tags: [TrainingAnnouncements]
      summary: Render copy for a date without saving or posting
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainingAnnouncementPreviewRequest"}
      responses:
        "200":
          description: Rendered Discord copy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementPreviewResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "422": {$ref: "#/components/responses/TrainingAnnouncementInvalid"}
  /training-announcements/{id}:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    get:
      operationId: trainingAnnouncements.get
      tags: [TrainingAnnouncements]
      summary: Get an announcement, including retired announcements
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Announcement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
    delete:
      operationId: trainingAnnouncements.delete
      tags: [TrainingAnnouncements]
      summary: Delete only an announcement that has never attempted delivery
      security: [{cookieSession: []}]
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
  /training-announcements/{id}/schedule:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    put:
      operationId: trainingAnnouncements.updateSchedule
      tags: [TrainingAnnouncements]
      summary: Replace the future schedule (exceptions keep their absolute dates)
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainingAnnouncementScheduleRequest"}
      responses:
        "200":
          description: Updated with advisory warnings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementScheduleResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
        "422": {$ref: "#/components/responses/TrainingAnnouncementInvalid"}
  /training-announcements/{id}/copy:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    put:
      operationId: trainingAnnouncements.updateCopy
      tags: [TrainingAnnouncements]
      summary: Update default title, message and explicit mention toggle
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainingAnnouncementCopyRequest"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
        "422": {$ref: "#/components/responses/TrainingAnnouncementInvalid"}
  /training-announcements/{id}/disable:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    post:
      operationId: trainingAnnouncements.disable
      tags: [TrainingAnnouncements]
      summary: Pause indefinitely
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
  /training-announcements/{id}/enable:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    post:
      operationId: trainingAnnouncements.enable
      tags: [TrainingAnnouncements]
      summary: Resume future deliveries
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
  /training-announcements/{id}/retire:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    post:
      operationId: trainingAnnouncements.retire
      tags: [TrainingAnnouncements]
      summary: Retire while retaining evidence
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
  /training-announcements/{id}/suppressions:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    get:
      operationId: trainingAnnouncementExceptions.listSuppressions
      tags: [TrainingAnnouncements]
      summary: List absolute-date suppressions
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Suppressions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementSuppressionListResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
    post:
      operationId: trainingAnnouncementExceptions.createSuppression
      tags: [TrainingAnnouncements]
      summary: Suppress a single date or finite inclusive range
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainingAnnouncementDateRange"}
      responses:
        "201":
          description: Suppression created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementSuppressionResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
        "422": {$ref: "#/components/responses/TrainingAnnouncementInvalid"}
  /training-announcements/{id}/suppressions/{exceptionId}:
    parameters:
      - {$ref: "#/components/parameters/TrainingAnnouncementId"}
      - {$ref: "#/components/parameters/TrainingAnnouncementExceptionId"}
    delete:
      operationId: trainingAnnouncementExceptions.deleteSuppression
      tags: [TrainingAnnouncements]
      summary: Remove a suppression without rewriting delivery evidence
      security: [{cookieSession: []}]
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
  /training-announcements/{id}/overrides:
    parameters: [{$ref: "#/components/parameters/TrainingAnnouncementId"}]
    get:
      operationId: trainingAnnouncementExceptions.listOverrides
      tags: [TrainingAnnouncements]
      summary: List absolute-date copy overrides
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Overrides
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementOverrideListResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
    post:
      operationId: trainingAnnouncementExceptions.createOverride
      tags: [TrainingAnnouncements]
      summary: Override title, message or both (overlapping ranges rejected)
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrainingAnnouncementOverrideRequest"}
      responses:
        "201":
          description: Override created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainingAnnouncementOverrideResponse"}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
        "422": {$ref: "#/components/responses/TrainingAnnouncementInvalid"}
  /training-announcements/{id}/overrides/{exceptionId}:
    parameters:
      - {$ref: "#/components/parameters/TrainingAnnouncementId"}
      - {$ref: "#/components/parameters/TrainingAnnouncementExceptionId"}
    delete:
      operationId: trainingAnnouncementExceptions.deleteOverride
      tags: [TrainingAnnouncements]
      summary: Remove an override without rewriting delivery evidence
      security: [{cookieSession: []}]
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/TrainingAnnouncementUnauthorized"}
        "403": {$ref: "#/components/responses/TrainingAnnouncementForbidden"}
        "404": {$ref: "#/components/responses/TrainingAnnouncementNotFound"}
        "409": {$ref: "#/components/responses/TrainingAnnouncementConflict"}
  /discord-doctor/report:
    get:
      operationId: discordDoctor.report
      tags:
        - DiscordDoctor
      summary: Get the Discord Doctor reconciliation report
      description: Returns every human server account in exactly one reconciliation bucket and every Member not known to be in the server.
      security:
        - cookieSession: []
      parameters:
        - name: refresh
          in: query
          required: false
          description: Bypass the short-lived Discord member-list cache.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Complete reconciliation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordDoctorReportResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Discord Doctor role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Discord member list could not be fetched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /discord-doctor/kick:
    post:
      operationId: discordDoctor.kick
      tags:
        - DiscordDoctor
      summary: Kick reviewed Discord server accounts
      description: |
        Kicks the explicit Discord user ids after re-deriving each account's
        current reconciliation bucket and enforcing every safety rule. Partial
        failures are returned as per-row outcomes; this operation never bans an
        account and does not create an application-side audit record.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordDoctorKickRequest"
      responses:
        "200":
          description: Per-account kick outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordDoctorKickResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Discord Doctor role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid kick request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Discord member list could not be fetched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /member-announcements:
    get:
      operationId: memberAnnouncements.index
      tags: [MemberAnnouncements]
      summary: List recent Member Announcements
      description: The 20 most recent sends, newest first, with their delivery status.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Recent Member Announcements.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberAnnouncementListResponse"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: The `member_announcements.send` capability is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    post:
      operationId: memberAnnouncements.create
      tags: [MemberAnnouncements]
      summary: Send a Member Announcement
      description: |
        Renders the email, freezes the recipient addresses of the chosen
        audience, records the announcement, and enqueues its delivery. The
        response is returned before Resend is called; `status` moves from
        `queued` to `sent` or `failed`.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberAnnouncementDraft"}
      responses:
        "202":
          description: The announcement is recorded and queued for delivery.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberAnnouncementResponse"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: The `member_announcements.send` capability is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: |
            Invalid subject or body (`fields.subject`, `fields.body`), or the
            chosen audience has no recipients (`code: no_recipients`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /member-announcements/preview:
    post:
      operationId: memberAnnouncements.preview
      tags: [MemberAnnouncements]
      summary: Render a Member Announcement without sending it
      description: |
        Returns the exact email HTML `create` would send for this draft and
        the number of recipients in the chosen audience. Writes nothing.
      security: [{cookieSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberAnnouncementDraft"}
      responses:
        "200":
          description: The rendered email and its audience size.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberAnnouncementPreviewResponse"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: The `member_announcements.send` capability is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: Invalid subject or body (`fields.subject`, `fields.body`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /beginners-workshops/email-templates:
    get:
      operationId: beginnersWorkshopEmailTemplates.list
      tags: [BeginnersWorkshops]
      summary: List the Intake Email templates
      description: |
        One club-wide template per Intake Email type, in display order
        (action emails first). Each row carries the placeholders its type can
        fill and, for action emails, the fixed button label the app adds.
      security: [{cookieSession: []}]
      responses:
        "200":
          description: Every Intake Email template.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntakeEmailTemplateListResponse"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: The `beginners.workshops.manage` capability is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /beginners-workshops/email-templates/{emailType}:
    put:
      operationId: beginnersWorkshopEmailTemplates.update
      tags: [BeginnersWorkshops]
      summary: Save an Intake Email template
      description: |
        Replaces the type's subject and body. Only emails queued afterwards
        use the new copy; there is no preview. Refused when the subject or
        body uses a placeholder the type can't fill
        (`code: placeholder_not_allowed`), when the body with every
        placeholder at its longest exceeds 2,000 characters
        (`code: template_too_long`), or when it is otherwise invalid
        (`code: invalid_template`). `fields.subject` / `fields.body` carry
        every message.
      security: [{cookieSession: []}]
      parameters:
        - name: emailType
          in: path
          required: true
          schema: {$ref: "#/components/schemas/IntakeEmailType"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IntakeEmailTemplateUpdate"}
      responses:
        "200":
          description: The saved template.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntakeEmailTemplateResponse"}
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: The `beginners.workshops.manage` capability is required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: Not an Intake Email type.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: The template was refused; see `code` and `fields`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntakeEmailTemplateValidationError"}

  /health:
    get:
      operationId: health.index
      tags:
        - Health
      summary: Health check
      description: Returns a static status response. Used to verify the API is reachable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /webhooks/stripe:
    post:
      operationId: stripeWebhooks.create
      tags:
        - StripeWebhooks
      summary: Handle Stripe webhook events
      description: |
        Receives Stripe webhook events, validates the Stripe-Signature header
        using HMAC-SHA256, and enqueues an Oban job for background processing.

        This endpoint is unauthenticated — Stripe sends webhooks without auth tokens.
        Signature verification is the authentication mechanism.

        Returns 200 immediately after validation + enqueue (Stripe requires fast responses).
        Returns 400 for invalid or missing signatures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Stripe event ID (e.g. evt_1abc)
                object:
                  type: string
                  example: event
                type:
                  type: string
                  description: Stripe event type (e.g. charge.succeeded)
                  enum:
                    - charge.succeeded
                    - charge.expired
                    - charge.refunded
                    - customer.subscription.created
                    - customer.subscription.updated
                    - customer.subscription.deleted
                    - customer.subscription.paused
                    - customer.subscription.resumed
                    - customer.subscription.pending_update_applied
                    - customer.subscription.pending_update_expired
                    - customer.subscription.trial_will_end
                    - invoice.paid
                    - invoice.payment_failed
                    - invoice.payment_action_required
                    - invoice.upcoming
                    - invoice.marked_uncollectible
                    - invoice.payment_succeeded
                    - payment_intent.succeeded
                    - payment_intent.payment_failed
                    - payment_intent.canceled
                data:
                  type: object
                  description: Event payload
                created:
                  type: integer
                  description: Unix timestamp when the event was created
                livemode:
                  type: boolean
                  description: Whether the event was in live mode
                pending_webhooks:
                  type: integer
                  description: Number of pending webhooks
                request:
                  type: object
                  description: Request details (id and idempotency_key)
                api_version:
                  type: string
                  description: Stripe API version
      responses:
        "200":
          description: Event validated and enqueued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      received:
                        type: boolean
                        example: true
                      event_id:
                        type: string
                        description: Oban job ID
        "400":
          description: Invalid or missing Stripe signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations:
    get:
      operationId: invitations.list
      tags:
        - Invitations
      summary: List member invitations
      description: |
        Returns a domain-shaped, cursor-paginated list of member invitations
        for the dashboard table.

        The server always filters to `pending` and `expired` invitations,
        matching the previous hardcoded client filter. The `status` field is
        still returned in the DTO so the UI can render the badge, but there is
        no `status` query param — `accepted`/`revoked` rows are never returned.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `admin`, `president`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query over `invitations.search_text`.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/InvitationListSortField"
            default: createdAt
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Cursor-paginated member invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: invitations.create
      tags:
        - Invitations
      summary: Enqueue bulk member invitations
      description: |
        Enqueues a Phoenix/Oban bulk invitation job. This replaces the
        `bulk_invite_with_subscription` Supabase edge function invocation.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.

        Under ADR 0010, issue time is side-effect free: the
        enqueued worker only inserts the pending invitation row (carrying
        the invite's first/last name, phone, date of birth, and a fresh
        Phoenix UUID for `user_id`) and enqueues the invite email. It no
        longer calls the Supabase admin API, creates a Stripe customer, or
        inserts a `user_profiles` row — acceptance materializes the
        Principal + Member record set atomically.

        Each invite is a direct Invitation; Waitlist entry ids are not
        accepted (a Waitlist person is invited from their Beginners' Workshop
        Intake instead). An invite is refused per-invite (case-insensitively)
        when its email already has a pending invitation, belongs to a
        Principal (a Member or former Member), or is on the Waitlist in any
        standing. Every invite, issued or refused, is recorded in the
        processing log; re-inviting a pending email is possible again once
        the pending invitation expires or is revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "202":
          description: Bulk invitation job accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreateResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: invitations.delete
      tags:
        - Invitations
      summary: Delete member invitations in bulk
      description: |
        Permanently deletes the requested invitations. Missing invitation ids
        are ignored, matching the dashboard's previous service-layer behavior.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationDeleteRequest"
      responses:
        "204":
          description: Invitations deleted
        "400":
          description: Invalid or empty invitation id list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/resend:
    post:
      operationId: invitations.resend
      tags:
        - Invitations
      summary: Resend existing member invitations
      description: |
        Re-enqueues invite-member emails through the Phoenix Email Oban worker.
        This replaces the SvelteKit service-layer `pgmq.send_batch('email_queue', ...)`
        producer used by invitation resend actions.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResendCreateRequest"
      responses:
        "202":
          description: Resend emails accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResendCreateResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{id}:
    get:
      operationId: invitations.showPublic
      tags:
        - Invitations
      summary: Read public invitation state
      description: |
        Public-safe invitation lookup for rendering signup state. This response
        deliberately excludes invitee PII such as email, date of birth, names,
        and profile facts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public invitation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitationResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{id}/verify:
    post:
      operationId: invitations.verify
      tags:
        - Invitations
      summary: Verify public invitation credentials
      description: |
        Compatibility-only credential check. It never returns a bearer token;
        new acceptance flows use the protected Onboarding Continuation endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationVerifyRequest"
      responses:
        "200":
          description: Invitation credentials verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationVerifyResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Credentials do not match a pending invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /onboarding/invitation-acceptance/verify:
    post:
      operationId: onboarding.verifyInvitationAcceptance
      tags: [Onboarding]
      summary: Verify Invitation credentials and begin protected acceptance
      description: |
        Proves Invitation email and date of birth, then creates or resumes the
        one active Acceptance Attempt and its awaiting-OAuth Continuation.
        This starts no OAuth or Stripe work and creates no Principal, identity,
        Membership, role, magic link, or DHC Session. The opaque Continuation
        reference is retained only in a signed HttpOnly cookie and is never
        returned in the response view.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingStartAcceptanceRequest"
      responses:
        "200":
          description: Safe protected acceptance state with signed HttpOnly browser proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Malformed or invalid Invitation credentials; safe restart state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: A live flow exists but this browser has no valid proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance:
    get:
      operationId: onboarding.showInvitationAcceptance
      tags: [Onboarding]
      summary: Read the protected acceptance state
      description: |
        Reads state only from opaque references held in the protected browser
        session. Missing, expired, or mismatched proof returns restart
        verification and never accepts an Invitation identifier from the caller.
      security:
        - onboardingAcceptanceSession: []
      responses:
        "200":
          description: Safe protected acceptance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Browser proof is missing or no longer eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/discord:
    get:
      operationId: onboarding.startDiscord
      tags: [Onboarding]
      summary: Begin Discord verification for Invitation Acceptance
      description: |
        Starts acceptance-specific Discord OAuth only for the current
        awaiting-OAuth Continuation. The protected Phoenix browser session binds
        the opaque Continuation reference to Assent state and PKCE data. The
        reference is never placed in OAuth state, a URL, or the response body.
      security:
        - onboardingContinuation: []
      responses:
        "302":
          description: Redirect to Discord OAuth authorization
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "409":
          description: Browser proof is missing or no longer awaiting OAuth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/discord/cancel:
    post:
      operationId: onboarding.cancelDiscord
      tags: [Onboarding]
      summary: End the current Discord verification before payment
      description: |
        Atomically terminalizes and zeroizes the current pre-payment
        Continuation and releases its transient Discord Subject Claim. It starts
        no Stripe work and creates no Principal, External Identity, or Session.
      security:
        - onboardingContinuation: []
      responses:
        "200":
          description: Discord verification ended; Invitation credentials must be verified again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Browser proof is missing, consumed, or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/continue:
    post:
      operationId: onboarding.continueAcceptance
      tags: [Onboarding]
      summary: Consume verified Discord proof and authorize the payment form
      description: |
        Atomically binds the browser-held verified Continuation to its one active
        Acceptance Attempt before any Stripe mutation. Replays return the current
        safe Attempt projection and cannot create another Attempt, Claim, or
        provider operation. This operation has no request body and creates no
        Stripe state. A successful response is paymentReady.
      security:
        - onboardingContinuation: []
      responses:
        "200":
          description: Current safe Acceptance Attempt state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Transition is stale or disallowed; current safe state is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Browser proof is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/payment:
    post:
      operationId: onboarding.submitPayment
      tags: [Onboarding]
      summary: Submit membership details and Stripe Elements payment input
      description: |
        Records the payment payload durably against the consumed protected
        Attempt before provider mutation, then advances the server-owned Stripe
        workflow with stable inputs and idempotency keys.
      security:
        - onboardingContinuation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingPaymentRequest"
      responses:
        "200":
          description: Current safe Acceptance Attempt state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "402":
          description: Payment input was terminally rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Transition is stale or disallowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Payment payload is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Provider progression is temporarily unavailable and recovery is scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Local finalization failed with durable reconciliation retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /onboarding/invitation-acceptance/retry:
    post:
      operationId: onboarding.retryAcceptance
      tags: [Onboarding]
      summary: Resume the current durable Acceptance Attempt
      description: |
        Reconciles only the Attempt already bound to this browser proof. It never
        creates another proof, Claim, or Attempt. Once Stripe is ready, all local
        Member and Discord identity records are finalized in one transaction.
      security:
        - onboardingContinuation: []
      responses:
        "200":
          description: Current safe Acceptance Attempt state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Transition is stale or provider progress is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Browser proof is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/pricing:
    get:
      operationId: onboarding.previewPricing
      tags: [Onboarding]
      summary: Read the signup pricing preview for the current acceptance session
      description: |
        Returns the membership pricing preview for the Invitation behind the
        browser's acceptance proof. The proof is the only workflow authority:
        the Invitation id is never accepted as input. Pricing is available only
        to a `paymentReady` session — after its Discord proof has been consumed
        and before payment submission begins (ADR 0019). When a promotion code
        is supplied, Stripe validates it and applies it to the invoice previews
        for standard invitations; tiered invitations resolve their discount
        server-side and ignore the code. This read creates no Stripe state.
      security:
        - onboardingContinuation: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Optional Stripe promotion code entered by the invitee.
      responses:
        "200":
          description: Invitation signup pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPricingResponse"
        "409":
          description: Session is not paymentReady (proof missing, not yet consumed, payment already started, or ended); current safe state is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Invalid or inactive promotion code, or the Invitation does not require Membership pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Pricing calculation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/status:
    get:
      operationId: waitlist.status
      tags:
        - Waitlist
      summary: Read public waitlist status
      description: |
        Returns whether the public beginners workshop waitlist is currently open.

        This endpoint is public and intentionally exposes only the domain-shaped
        waitlist status, not the generic settings table.
      responses:
        "200":
          description: Waitlist status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStatusResponse"
    patch:
      operationId: waitlist.updateStatus
      tags:
        - Waitlist
      summary: Set whether the public waitlist is open
      description: |
        Sets the beginners workshop waitlist to an explicit open or closed
        state. This is a domain command rather than a generic settings update.

        Requires the `beginners.waitlist.toggle` capability (officers only);
        the rest of the beginners staff, who may read and work the list,
        get 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistStatusUpdateRequest"
      responses:
        "200":
          description: Updated waitlist status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStatusResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `beginners.waitlist.toggle` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: isOpen is missing or not boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/analytics:
    get:
      operationId: waitlist.analytics
      tags:
        - Waitlist
      summary: Read waitlist analytics
      description: |
        Returns dashboard analytics over the `waiting` Waitlist queue only.
        `totalCount` is the number of people waiting.

        Requires the `beginners.waitlist.manage` capability.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Waitlist analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistAnalyticsResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `beginners.waitlist.manage` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/entries:
    post:
      operationId: waitlist.createEntry
      tags:
        - Waitlist
      summary: Submit a public waitlist entry
      description: |
        Public beginners workshop intake endpoint. Phoenix validates the payload,
        enforces waitlist-open server-side, normalizes email/pronouns, creates
        the waitlist row and inactive profile, and records guardian details for
        16–17 year old applicants.

        The endpoint is public, so it must not reveal whether an email is
        known: a submission is refused, changing nothing, when its email is
        on the waitlist in any standing but `removed`, belongs to a Principal
        (a Member or former Member), or has a pending invitation, and that
        refusal answers exactly like a new entry (`202` with the same neutral
        body).

        A `removed` email that registers again reopens at the back of the
        queue: `waiting`, with its priority set to the re-registration date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistEntryCreateRequest"
      responses:
        "202":
          description: |
            Submission received. Returned both when an entry was created or
            reopened and when registration refused the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntryCreateResponse"
        "403":
          description: Waitlist is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: waitlist.entries
      tags:
        - Waitlist
      summary: List waitlist entries
      description: |
        Returns a domain-shaped, cursor-paginated list of beginners workshop
        waitlist entries for the dashboard table.

        Requires the `beginners.waitlist.manage` capability.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query.
        - name: status
          in: query
          schema:
            type: string
            enum: [waiting, removed]
            default: waiting
          description: Waitlist Status to list. Defaults to `waiting`, the queue; pass `removed` to list removed people instead.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/WaitlistEntriesSortField"
            default: position
        - name: direction
          in: query
