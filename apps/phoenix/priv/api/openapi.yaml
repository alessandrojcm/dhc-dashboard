        Minimal inventory item summary shown on the container detail page:
        identity, `category` summary, quantity, and maintenance flag. Item
        attributes are not embedded (full item detail lives in the items slice).
      required:
        - id
        - quantity
        - outForMaintenance
        - category
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: integer
        outForMaintenance:
          type: boolean
        category:
          type: object
          nullable: true
          description: Summary of the item's equipment category, or null.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    InventoryContainerDetail:
      type: object
      description: Container detail with parent, child containers, and direct items.
      required:
        - id
        - name
        - description
        - parentContainerId
        - parentContainer
        - childContainers
        - items
        - itemCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        parentContainerId:
          type: string
          format: uuid
          nullable: true
        parentContainer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        childContainers:
          type: array
          items:
            $ref: "#/components/schemas/InventoryContainerChild"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryContainerItem"
        itemCount:
          type: integer
          description: Number of inventory items directly in this container.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InventoryContainerDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryContainerDetail"
    InventoryItem:
      type: object
      description: |
        Inventory item with `container` and `category` summaries used by both
        the list and single-item responses.
      required:
        - id
        - containerId
        - categoryId
        - quantity
        - outForMaintenance
        - attributes
        - container
        - category
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        containerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Container the item lives in. Nullable in the schema for forward
            compatibility, but the persistence layer marks the column NOT
            NULL today, so reads always return a value.
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Equipment category the item belongs to. Nullable in the schema;
            the persistence column is NOT NULL today.
        quantity:
          type: integer
          minimum: 1
        outForMaintenance:
          type: boolean
        attributes:
          type: object
          description: |
            Free-form attribute values keyed by the category's attribute
            `name`. Shape is not validated against the category's
            `availableAttributes` in this slice (future work).
        notes:
          type: string
          nullable: true
          maxLength: 1000
        photoUrl:
          type: string
          nullable: true
        container:
          type: object
          nullable: true
          description: Summary of the item's container, or null.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            parentContainerId:
              type: string
              format: uuid
              nullable: true
          required:
            - id
            - name
            - parentContainerId
        category:
          type: object
          nullable: true
          description: Summary of the item's equipment category, or null.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: Supabase user id of the creator (JWT `sub`).
        updatedBy:
          type: string
          format: uuid
          nullable: true
          description: Supabase user id of the last updater (JWT `sub`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InventoryItemListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
            - limit
            - nextCursor
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InventoryItem"
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
              description: Opaque cursor for the next page, or null when this is the last page.
    InventoryItemResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryItem"
    InventoryItemCreateRequest:
      type: object
      required:
        - containerId
        - categoryId
        - quantity
      properties:
        containerId:
          type: string
          format: uuid
          description: Container the item lives in. Required on create.
        categoryId:
          type: string
          format: uuid
          description: Equipment category for the item. Required on create.
        attributes:
          type: object
          description: |
            Free-form attribute values keyed by the category's attribute
            `name`. Defaults to `{}` when omitted.
        quantity:
          type: integer
          minimum: 1
          description: Item count; must be positive (DB CHECK constraint).
        notes:
          type: string
          nullable: true
          maxLength: 1000
        outForMaintenance:
          type: boolean
          default: false
        photoUrl:
          type: string
          nullable: true
    InventoryItemHistory:
      type: object
      description: |
        One `inventory_history` row for an item. `oldContainer` and
        `newContainer` are name summaries (nullable when the action did not
        involve a container move).
      required:
        - id
        - itemId
        - action
        - oldContainerId
        - newContainerId
        - oldContainer
        - newContainer
        - notes
        - changedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - created
            - updated
            - moved
            - maintenance_out
            - maintenance_in
        oldContainerId:
          type: string
          format: uuid
          nullable: true
        newContainerId:
          type: string
          format: uuid
          nullable: true
        oldContainer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        newContainer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        notes:
          type: string
          nullable: true
        changedBy:
          type: string
          format: uuid
          nullable: true
          description: Supabase user id of the actor (JWT `sub`).
        createdAt:
          type: string
          format: date-time
    InventoryItemHistoryListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - history
            - limit
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/InventoryItemHistory"
            limit:
              type: integer
              minimum: 1
              maximum: 100
    Error:
      type: object
      properties:
        errors:
          type: object
          properties:
            detail:
              type: string
