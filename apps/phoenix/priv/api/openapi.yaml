          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No loan exists with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The loan is not checked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanConflictError"

  /inventory/operator/loans/{loanId}/dates:
    post:
      operationId: inventoryOperatorLoans.editDates
      tags:
        - Inventory
      summary: Edit the approved dates of a live loan
      description: |
        Edits the approved start and/or due date of an `approved` or
        `checked_out` Loan. Omitted dates are left as they are. The
        start is immutable after checkout; the due date stays editable
        but may never precede the handover day.

        A due-date change notifies the borrower. Reminders reschedule
        from the new date with no write on this path.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
