openapi: 3.0.3
info:
  title: DHC Dashboard API
  description: |
    Dublin Hema Club dashboard API.

    **Auth**: Phoenix validates Supabase JWT. Pass as `Authorization: Bearer <token>`.
  version: 0.1.0

servers:
  - url: /api
    description: Relative path (same origin)

tags:
  - name: InventoryCategories
    description: Equipment category management (quartermaster)
    x-context: Dhc.Inventory
    x-resource: EquipmentCategory
  - name: InventoryContainers
    description: Inventory container (storage location) management with parent/child hierarchy (quartermaster)
    x-context: Dhc.Inventory
    x-resource: Container
  - name: InventoryItems
    description: Inventory item CRUD with audit history recording (quartermaster)
    x-context: Dhc.Inventory
    x-resource: Item

paths:
  /health:
    get:
      operationId: health.index
      tags:
        - Health
      summary: Health check
      description: Returns a static status response. Used to verify the API is reachable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /webhooks/stripe:
    post:
      operationId: stripeWebhooks.create
      tags:
        - StripeWebhooks
      summary: Handle Stripe webhook events
      description: |
        Receives Stripe webhook events, validates the Stripe-Signature header
        using HMAC-SHA256, and enqueues an Oban job for background processing.

        This endpoint is unauthenticated — Stripe sends webhooks without auth tokens.
        Signature verification is the authentication mechanism.

        Returns 200 immediately after validation + enqueue (Stripe requires fast responses).
        Returns 400 for invalid or missing signatures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Stripe event ID (e.g. evt_1abc)
                object:
                  type: string
                  example: event
                type:
                  type: string
                  description: Stripe event type (e.g. charge.succeeded)
                  enum:
                    - charge.succeeded
                    - charge.expired
                    - charge.refunded
                    - customer.subscription.created
                    - customer.subscription.updated
                    - customer.subscription.deleted
                    - customer.subscription.paused
                    - customer.subscription.resumed
                    - customer.subscription.pending_update_applied
                    - customer.subscription.pending_update_expired
                    - customer.subscription.trial_will_end
                    - invoice.paid
                    - invoice.payment_failed
                    - invoice.payment_action_required
                    - invoice.upcoming
                    - invoice.marked_uncollectible
                    - invoice.payment_succeeded
                    - payment_intent.succeeded
                    - payment_intent.payment_failed
                    - payment_intent.canceled
                data:
                  type: object
                  description: Event payload
                created:
                  type: integer
                  description: Unix timestamp when the event was created
                livemode:
                  type: boolean
                  description: Whether the event was in live mode
                pending_webhooks:
                  type: integer
                  description: Number of pending webhooks
                request:
                  type: object
                  description: Request details (id and idempotency_key)
                api_version:
                  type: string
                  description: Stripe API version
      responses:
        "200":
          description: Event validated and enqueued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      received:
                        type: boolean
                        example: true
                      event_id:
                        type: string
                        description: Oban job ID
        "400":
          description: Invalid or missing Stripe signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations:
    get:
      operationId: invitations.list
      tags:
        - Invitations
      summary: List member invitations
      description: |
        Returns a domain-shaped, cursor-paginated list of member invitations
        for the dashboard table.

        The server always filters to `pending` and `expired` invitations,
        matching the previous hardcoded client filter. The `status` field is
        still returned in the DTO so the UI can render the badge, but there is
        no `status` query param — `accepted`/`revoked` rows are never returned.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `admin`, `president`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query over `invitations.search_text`.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/InvitationListSortField"
            default: createdAt
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Cursor-paginated member invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: invitations.create
      tags:
        - Invitations
      summary: Enqueue bulk member invitations
      description: |
        Enqueues a Phoenix/Oban bulk invitation job. This replaces the
        `bulk_invite_with_subscription` Supabase edge function invocation.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "202":
          description: Bulk invitation job accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreateResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/resend:
    post:
      operationId: invitations.resend
      tags:
        - Invitations
      summary: Resend existing member invitations
      description: |
        Re-enqueues invite-member emails through the Phoenix Email Oban worker.
        This replaces the SvelteKit service-layer `pgmq.send_batch('email_queue', ...)`
        producer used by invitation resend actions.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResendCreateRequest"
      responses:
        "202":
          description: Resend emails accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResendCreateResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/status:
    get:
      operationId: waitlist.status
      tags:
        - Waitlist
      summary: Read public waitlist status
      description: |
        Returns whether the public beginners workshop waitlist is currently open.

        This endpoint is public and intentionally exposes only the domain-shaped
        waitlist status, not the generic settings table.
      responses:
        "200":
          description: Waitlist status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistStatusResponse"

  /waitlist/analytics:
    get:
      operationId: waitlist.analytics
      tags:
        - Waitlist
      summary: Read waitlist analytics
      description: |
        Returns dashboard analytics for current beginners workshop waitlist entries.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `admin`, `president`, `committee_coordinator`, `beginners_coordinator`, or `coach`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Waitlist analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistAnalyticsResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a waitlist admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/entries:
    get:
      operationId: waitlist.entries
      tags:
        - Waitlist
      summary: List waitlist entries
      description: |
        Returns a domain-shaped, cursor-paginated list of beginners workshop
        waitlist entries for the dashboard table.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `admin`, `president`, `committee_coordinator`, `beginners_coordinator`, or `coach`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query.
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WaitlistStatus"
          description: Defaults to all statuses except `joined`; pass `joined` explicitly to include joined entries only.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/WaitlistEntriesSortField"
            default: position
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Cursor-paginated waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntriesResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a waitlist admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications:
    get:
      operationId: notifications.list
      tags:
        - Notifications
      summary: List current user notifications
      description: |
        Returns the authenticated user's in-app notifications in newest-first
        order plus the unread notification count. This endpoint mirrors the
        old `notifications.user_id = auth.uid()` RLS boundary: users can only
        read notifications generated for their own Supabase Auth user id.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
      responses:
        "200":
          description: Cursor-paginated notifications for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members:
    get:
      operationId: members.list
      tags:
        - Members
      summary: List members
      description: |
        Returns a domain-shaped, cursor-paginated list of members for the
        dashboard table, replacing the browser-side PostgREST read over
        `member_management_view`.

        `membershipStatus` is computed server-side, reproducing the legacy
        view's CASE: `inactive` when `user_profiles.is_active = false`;
        `paused` when `member_profiles.subscription_paused_until` is not null
        and greater than `now()`; otherwise `active`. This is distinct from
        the Member's `isActive` flag — a paused member has
        `isActive: true, membershipStatus: "paused"`.

        Member email is read directly from `auth.users` via the `AuthUser`
        schema (no PostgREST-era helper function). Internal/leaky fields
        (`searchText`, `userProfileId`, `createdAt`, `updatedAt`, `roles`,
        `additionalData`, `fromWaitlistId`, `waitlistRegistrationDate`) are
        not exposed.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of the
        broad committee roles: `admin`, `president`, `treasurer`,
        `committee_coordinator`, `sparring_coordinator`, `workshop_coordinator`,
        `beginners_coordinator`, `quartermaster`, `pr_manager`,
        `volunteer_coordinator`, `research_coordinator`, or `coach`. A `member`
        role 403s; a missing token 401s.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response. Binds to the query params (limit, sort, direction, membershipStatus, q); a mismatched cursor returns 400.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query over `user_profiles.search_text`.
        - name: membershipStatus
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of membership statuses to include. Absent or
            empty returns all statuses (no filter). Example: `active,paused`.
            Valid values: `active`, `inactive`, `paused`.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/MembersListSortField"
            default: lastName
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Cursor-paginated members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a broad committee role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/insurance-form:
    get:
      operationId: members.insuranceForm
      tags:
        - Members
      summary: Read the member insurance form link
      description: |
        Returns the URL of the HEMA insurance form link configured for members.

        Exposes a specific domain read, not a generic settings proxy: the
        `Dhc.Members` context owns the `hema_insurance_form_link` settings read.

        Any authenticated user (valid Supabase JWT) may read this; no committee
        role is required, mirroring the `settings` SELECT RLS policy
        (`USING (true)` for authenticated). A member can read the insurance
        form link on their own profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insurance form link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersInsuranceFormResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/analytics:
    get:
      operationId: members.analytics
      tags:
        - Members
      summary: Read members analytics
      description: |
        Returns dashboard analytics for active members, computed server-side
        over `member_profiles` joined to `user_profiles` where `is_active = true`.

        Replaces the five browser-side PostgREST aggregate queries over
        `member_management_view` with a single domain-shaped read. The
        `preferred_weapon[]` array is unnested and counted in SQL so the
        browser no longer downloads every active member's weapon array to
        count it in JavaScript. Raw enum strings are returned for weapons;
        the UI keeps doing display prettification.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of the
        broad committee roles: `admin`, `president`, `treasurer`,
        `committee_coordinator`, `sparring_coordinator`, `workshop_coordinator`,
        `beginners_coordinator`, `quartermaster`, `pr_manager`,
        `volunteer_coordinator`, `research_coordinator`, or `coach`. This
        mirrors the `user_profiles` SELECT RLS policy for broad committee
        roles. A `member` role 403s; a missing token 401s.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersAnalyticsResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a broad committee role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/calendar:
    get:
      operationId: workshops.calendar
      tags:
        - Workshops
      summary: Read the coordinator Workshop calendar
      description: |
        Returns non-cancelled Workshops for the coordinator management
        calendar, replacing the browser-side PostgREST read over
        `club_activities` joined to `club_activity_interest_counts` and
        `club_activity_registrations`.

        Each Workshop carries scheduling, pricing, and status fields, the
        interest count, and total pending/confirmed registration counts —
        the demand and attendance signals a coordinator needs. The DTO does
        NOT carry current-user registration or interest state: the old
        `user_interest` / `user_registrations` PostgREST joins were
        current-user artifacts that leaked into the management view and are
        intentionally dropped (PRD #142).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `workshop_coordinator`, `president`, or `admin`. This mirrors the
        corrected `club_activity_registrations` RLS policy
        (`20250923100806_fix_workshops_rls.sql`) and does NOT reproduce the
        historical `beginners_coordinator` registration-visibility drift.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Coordinator Workshop calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopCalendarResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a workshop coordinator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{id}/attendees:
    get:
      operationId: workshops.attendees
      tags:
        - Workshops
      summary: Read Workshop attendees and refunds
      description: |
        Returns the combined coordinator attendee/refund management payload for
        a single Workshop: the Workshop summary, the active attendees
        (registrations with status `confirmed` or `pending`, ordered by
        `registeredAt` ascending), and the refund records (ordered by
        `requestedAt` descending).

        Attendee and refund participants are normalized into a single domain
        `participant` DTO (`type` `member` | `external`, `displayName`,
        `email`) so member and external registrations are displayed
        consistently and the storage join shapes (`user_profiles` /
        `external_users`) do not leak into the contract.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `workshop_coordinator`, `president`, or `admin`. This mirrors the
        corrected registration RLS policy
        (`20250923100806_fix_workshops_rls.sql`) and deliberately does NOT
        reproduce the historical `beginners_coordinator` registration
        visibility drift (see the `Dhc.Workshops` moduledoc). A
        `beginners_coordinator` token 403s; a missing token 401s; an unknown
        Workshop id 404s.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Workshop id.
      responses:
        "200":
          description: Workshop attendees and refunds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopAttendeesResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops:
    get:
      operationId: workshops.list
      tags:
        - Workshops
      summary: List member-safe Workshops
      description: |
        Returns the member-safe Workshop collection, replacing the browser-side
        PostgREST reads over `club_activities` (with `club_activity_interest`
        and `club_activity_registrations` joins) on the member-facing My
        Workshops screen.

        The collection defaults to the member-visible active statuses —
        `planned` and `published` — so members see Workshops they can express
        interest in or register for. `finished` and `cancelled` Workshops are
        never returned to members.

        Any `status` filter is **constrained to member-safe statuses**: the
        endpoint intersects the requested statuses with `{planned, published}`,
        so a member can never craft a query that returns `finished` or
        `cancelled` Workshops. Unknown statuses are dropped (no `400`).

        Each Workshop DTO carries availability counts and the current user's
        state, computed server-side from the Supabase JWT `sub`:

          * `interestCount` — number of members who expressed interest
            (meaningful for `planned` Workshops).
          * `pendingRegistrationCount` / `confirmedRegistrationCount` —
            registrations counted toward availability (PRD #142 corrects the
            old `attendee_count` length, which counted every row including
            `cancelled`/`refunded`, to pending/confirmed only).
          * `currentUserInterest` — whether the authenticated member expressed
            interest in this Workshop.
          * `currentUserRegistration` — the authenticated member's registration
            (`{id, status}`) for this Workshop, or `null`. Returned regardless
            of status so the UI can derive "am I registered" and "was I
            refunded" state.

        Member-safe Workshop DTOs do **not** expose other attendee identities
        or storage-shaped join details (no `participant`, no `attendees`, no
        `member_user_id` lists). Those live behind the coordinator
        attendee/refund read.

        Any authenticated user (valid Supabase JWT) may read this; no committee
        role is required. A missing token returns `401`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of Workshop statuses to include, constrained to
            the member-safe set `{planned, published}`. Absent or empty returns
            both `planned` and `published`. Any requested status outside the
            member-safe set is dropped (e.g. `?status=finished` returns no
            Workshops). Example: `planned`, `published`, `planned,published`.
      responses:
        "200":
          description: Member-safe Workshop collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopsListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      operationId: settings.index
      tags:
        - Settings
      summary: List allowlisted generic settings
      description: |
        Returns the generic admin-managed settings allowlisted for the
        generic Settings API: `hema_insurance_form_link`,
        `subscription_max_pause_months`, and `subscription_min_pause_days`.

        Domain-owned settings (e.g. `waitlist_open`) are intentionally not
        exposed here; they belong to their owning capability's API.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `committee_coordinator`, or `admin`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Allowlisted generic settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a settings admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/categories:
    get:
      operationId: inventoryCategories.index
      tags:
        - InventoryCategories
      summary: List equipment categories
      description: |
        Returns equipment categories ordered by name, each with an `itemCount`
        of inventory items in that category.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Equipment categories ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryCategories.create
      tags:
        - InventoryCategories
      summary: Create an equipment category
      description: |
        Creates a new equipment category. The `availableAttributes` array
        defines the dynamic attribute definitions items in this category may
        carry. Supported attribute `type` values: `text`, `select`, `number`,
        `boolean`. Select attributes must include `options`.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCategoryCreateRequest"
      responses:
        "201":
          description: The created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid category payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A category with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/categories/{id}:
    get:
      operationId: inventoryCategories.show
      tags:
        - InventoryCategories
      summary: Get one equipment category
      description: |
        Returns a single equipment category by id, including its `itemCount`.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The category id.
      responses:
        "200":
          description: The equipment category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No category exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryCategories.update
      tags:
        - InventoryCategories
      summary: Update an equipment category
      description: |
        Updates a single equipment category. Accepts the same writable fields
        as create (`name`, `description`, `availableAttributes`).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The category id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCategoryCreateRequest"
      responses:
        "200":
          description: The updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCategoryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No category exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A category with the new name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid category payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: inventoryCategories.delete
      tags:
        - InventoryCategories
      summary: Delete an equipment category
      description: |
        Deletes an equipment category. The delete is rejected with `409` when
        any inventory items still reference the category; remove or reassign
        those items first.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The category id.
      responses:
        "204":
          description: The category was deleted
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No category exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The category is still referenced by inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers:
    get:
      operationId: inventoryContainers.index
      tags:
        - InventoryContainers
      summary: List inventory containers
      description: |
        Returns inventory containers as a flat list ordered by name, each
        annotated with its `itemCount` (the number of `inventory_items` rows
        directly in it) and a `parentContainer` summary (`{id, name}` or null).
        The UI rebuilds the parent/child hierarchy client-side from
        `parentContainerId`.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory containers ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryContainers.create
      tags:
        - InventoryContainers
      summary: Create an inventory container
      description: |
        Creates a new inventory container. Optionally nest it under a parent
        container via `parentContainerId`. `createdBy` is derived from the
        caller's Supabase JWT `sub`.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryContainerCreateRequest"
      responses:
        "201":
          description: The created container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid container payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/containers/{id}:
    get:
      operationId: inventoryContainers.show
      tags:
        - InventoryContainers
      summary: Get one inventory container with relations
      description: |
        Returns a single inventory container by id with its `parentContainer`
        summary, `childContainers` (`[{id, name}]`), and the `items` directly
        in it — each item carrying a `category` summary (`{id, name}`) and
        `quantity`/`outForMaintenance`. Item-level history is not embedded.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "200":
          description: The inventory container with relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerDetailResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryContainers.update
      tags:
        - InventoryContainers
      summary: Update an inventory container
      description: |
        Updates a single inventory container. Accepts the same writable
        fields as create (`name`, `description`, `parentContainerId`).

        Setting `parentContainerId` to the container itself or one of its
        descendants is rejected with `422` (circular-parent prevention); the
        UI also filters available parents client-side, but the server enforces
        the invariant for safety.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryContainerCreateRequest"
      responses:
        "200":
          description: The updated container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryContainerListItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid payload, or `parentContainerId` would create a cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: inventoryContainers.delete
      tags:
        - InventoryContainers
      summary: Delete an inventory container
      description: |
        Deletes an inventory container. The delete is rejected with `409` when
        the container still directly contains inventory items; remove or move
        those items first. Child containers cascade-delete per the
        `containers.parent_container_id` `on_delete: :delete_all` foreign key;
        a child that itself holds items will surface as `409` via that cascade.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The container id.
      responses:
        "204":
          description: The container was deleted
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No container exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The container still contains inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items:
    get:
      operationId: inventoryItems.index
      tags:
        - InventoryItems
      summary: List inventory items
      description: |
        Returns a cursor-paginated list of inventory items, newest first, each
        carrying `container` and `category` summaries.

        Filters (all optional): `categoryId`, `containerId`,
        `outForMaintenance` (boolean), and `search` (case-insensitive partial
        match against item notes, category name, and container name).

        Cursor is opaque and stable within the current filter set; pass the
        `nextCursor` from a previous response to fetch the next page. When the
        returned page is the last, `nextCursor` is `null`.

        Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: containerId
          in: query
          schema:
            type: string
            format: uuid
        - name: outForMaintenance
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive partial match across notes, category name, and container name.
      responses:
        "200":
          description: Cursor-paginated inventory items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryItems.create
      tags:
        - InventoryItems
      summary: Create an inventory item
      description: |
        Creates a new inventory item. `createdBy` is derived from the caller's
        JWT `sub` and is never user-writable. On insert, an `inventory_history`
        row with action `created` is recorded in the same transaction
        (`changedBy` = caller `sub`, `newContainerId` = the item's container).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemCreateRequest"
      responses:
        "201":
          description: The created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid item payload or unknown container/category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items/{id}:
    get:
      operationId: inventoryItems.show
      tags:
        - InventoryItems
      summary: Get one inventory item
      description: |
        Returns a single inventory item by id with `container` and `category`
        summaries. Requires a valid Supabase JWT (any authenticated member).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      responses:
        "200":
          description: The inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryItems.update
      tags:
        - InventoryItems
      summary: Update an inventory item
      description: |
        Updates a single inventory item. Accepts the same writable fields as
        create, all optional on update (PATCH semantics). `updatedBy` is set
        from the caller's JWT `sub`.

        On a successful update, an `inventory_history` row with action
        `updated` is recorded in the same transaction (`changedBy` = caller
        `sub`). If `containerId` changed, the move is additionally recorded
        with action `moved` and the old/new container ids (preserves the
        SvelteKit `ItemService.moveToContainer` history behavior); the `moved`
        row is written before the `updated` row so the chronological order is
        move → update.

        Setting `containerId` to a missing container returns `422`. Setting
        `categoryId` to a missing category returns `422`.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemCreateRequest"
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid item payload or unknown container/category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: inventoryItems.delete
      tags:
        - InventoryItems
      summary: Delete an inventory item
      description: |
        Deletes a single inventory item. `inventory_history.item_id` is
        `on_delete: :delete_all`, so the item's history rows are cascade-removed
        with it; no dedicated `deleted` history row is recorded (it would be
        cascade-wiped and is pointless).

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
      responses:
        "204":
          description: Item deleted
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items/{id}/history:
    get:
      operationId: inventoryItems.history
      tags:
        - InventoryItems
      summary: List history for one inventory item
      description: |
        Returns the most recent `inventory_history` rows for a single item,
        newest first, each with `oldContainer` and `newContainer` name
        summaries. The item's `attributes` snapshot is not embedded in history
        rows (the source schema stores it on the item, not the history row).

        Requires a valid Supabase JWT (any authenticated member). Returns
        `404` when the item id does not exist.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The item id.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: History rows for the item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItemHistoryListResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings/{key}:
    patch:
      operationId: settings.update
      tags:
        - Settings
      summary: Update one allowlisted generic setting
      description: |
        Updates a single allowlisted generic setting by key. The request body
        is `{ "value": ... }` where the value type depends on the key:

        - `hema_insurance_form_link`: non-empty http/https URL string
        - `subscription_max_pause_months`: integer, valid range 1..24
        - `subscription_min_pause_days`: integer, valid range 1..365

        Unknown or non-allowlisted keys return `404`. Invalid values return
        `422`. The `type` column is not part of the public contract.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `committee_coordinator`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The setting key (must be allowlisted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: The updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsUpdateResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a settings admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or non-allowlisted setting key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid value for the given key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    InvitationCreateRequest:
      type: object
      required:
        - invites
      properties:
        invites:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: "#/components/schemas/InvitationCreateInvite"
              - type: string
                format: uuid
                description: Waitlist entry ID to convert into an invitation.
    InvitationCreateInvite:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - dateOfBirth
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
    InvitationCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            queued:
              type: boolean
              example: true
            job_id:
              type: integer
              description: Oban job ID
    InvitationResendCreateRequest:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          minItems: 1
          items:
            type: string
            format: email
    InvitationResendCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            succeeded:
              type: integer
            failed:
              type: integer
    InvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - expired
        - revoked
      description: |
        Invitation lifecycle status. The list endpoint always filters to
        `pending` and `expired`; `accepted`/`revoked` rows are never returned.
        The field is still present in the DTO for UI badge rendering.
    InvitationListSortField:
      type: string
      enum:
        - email
        - status
        - expiresAt
        - createdAt
    InvitationListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - invitations
            - totalCount
            - limit
            - nextCursor
            - previousCursor
          properties:
            invitations:
              type: array
              items:
                $ref: "#/components/schemas/Invitation"
            totalCount:
              type: integer
              minimum: 0
              description: Exact `COUNT(*)`, not estimated.
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
            previousCursor:
              type: string
              nullable: true
    Invitation:
      type: object
      required:
        - id
        - email
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
