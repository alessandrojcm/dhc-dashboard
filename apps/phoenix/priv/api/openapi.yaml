          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: workshops.update
      tags:
        - Workshops
      summary: Update Workshop management fields
      description: |
        Updates Workshop management fields. General edits are planned-only.
        Lifecycle/status is not directly writable here; use publish/cancel
        command endpoints. Pricing edits preserve the current looser rule:
        pricing may be changed while planned, or after publish only while there
        are zero active (`pending`/`confirmed`) registrations.

        Requires `workshop_coordinator`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopManagementUpdateRequest"
      responses:
        "200":
          description: Workshop updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopManagementResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid edit for current Workshop lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: workshops.delete
      tags:
        - Workshops
      summary: Delete a planned Workshop
      description: Deletes planned Workshops only. Requires `workshop_coordinator`, `president`, or `admin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkshopId"
      responses:
        "204":
          description: Workshop deleted
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a Workshop coordinator management role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No Workshop exists for the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Workshop is not planned and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workshops/{workshopId}/publish:
    post:
      operationId: workshops.publish
      tags:
        - Workshops
      summary: Publish a planned Workshop
      description: Transitions a planned Workshop to published. Requires `workshop_coordinator`, `president`, or `admin`.
      security:
