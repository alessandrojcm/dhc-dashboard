openapi: 3.0.3
info:
  title: DHC Dashboard API
  description: |
    Dublin Hema Club dashboard API.

    **Auth**: Phoenix validates Supabase JWT. Pass as `Authorization: Bearer <token>`.
  version: 0.1.0

servers:
  - url: /api
    description: Relative path (same origin)

tags:
  - name: InventoryCategories
    description: Equipment category management (quartermaster)
    x-context: Dhc.Inventory
    x-resource: EquipmentCategory
  - name: InventoryContainers
    description: Inventory container (storage location) management with parent/child hierarchy (quartermaster)
    x-context: Dhc.Inventory
    x-resource: Container
  - name: InventoryItems
    description: Inventory item CRUD with audit history recording (quartermaster)
    x-context: Dhc.Inventory
    x-resource: Item
  - name: InventoryHistory
    description: Global inventory activity/history feed (quartermaster)
    x-context: Dhc.Inventory
    x-resource: InventoryHistory
  - name: InventoryDashboard
    description: Aggregate inventory dashboard reads
    x-context: Dhc.Inventory
    x-resource: InventoryDashboard
  - name: Members
    description: |
      Member profile facts (identity, contact, preferred weapon), aggregate
      member reads, and cross-cutting enum-option reads (gender, preferred
      weapon) shared by the authenticated member edit form and the public
      waitlist intake. Profile facts are owned by the Dhc.Members context;
      membership state fields on the same DTOs are contributed by
      Dhc.Membership. Enum options are sourced from Postgres enum types at
      runtime and are public (no auth).
    x-context: Dhc.Members
    x-resource: Member
  - name: Membership
    description: |
      A Member's subscription/access state (active, inactive, paused) and the
      Stripe-facing pause/resume commands. Owned by the Dhc.Membership context;
      shares storage with Dhc.Members (`subscription_paused_until` lives in
      `member_profiles`) — the boundary is expressed in the contract and
      context functions, not in a separate schema (see ADR-0007).
    x-context: Dhc.Membership
    x-resource: Membership
  - name: Workshops
    description: Workshop reads and coordinator management lifecycle commands.
    x-context: Dhc.Workshops
    x-resource: Workshop
  - name: AuthSession
    description: |
      Phoenix-owned session auth API (ALE-165/ALE-164). Magic-link sign-in,
      session projection read, sign-out, and socket-token exchange. The
      dashboard authenticates through the signed `_dhc_session` cookie
       (`cookieSession` security scheme) instead of the Supabase bearer JWT.
  - name: Onboarding
    description: Protected, pre-payment Invitation Acceptance journey.
  - name: DiscordDoctor
    description: Live Discord server reconciliation for authorized committee administrators.
    x-context: Dhc.Discord
    x-resource: DoctorReport

paths:
  /discord-doctor/report:
    get:
      operationId: discordDoctor.report
      tags:
        - DiscordDoctor
      summary: Get the Discord Doctor reconciliation report
      description: Returns every human server account in exactly one reconciliation bucket and every Member not known to be in the server.
      security:
        - cookieSession: []
      parameters:
        - name: refresh
          in: query
          required: false
          description: Bypass the short-lived Discord member-list cache.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Complete reconciliation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordDoctorReportResponse"
        "401":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Discord Doctor role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Discord member list could not be fetched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health:
    get:
      operationId: health.index
      tags:
        - Health
      summary: Health check
      description: Returns a static status response. Used to verify the API is reachable.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /webhooks/stripe:
    post:
      operationId: stripeWebhooks.create
      tags:
        - StripeWebhooks
      summary: Handle Stripe webhook events
      description: |
        Receives Stripe webhook events, validates the Stripe-Signature header
        using HMAC-SHA256, and enqueues an Oban job for background processing.

        This endpoint is unauthenticated — Stripe sends webhooks without auth tokens.
        Signature verification is the authentication mechanism.

        Returns 200 immediately after validation + enqueue (Stripe requires fast responses).
        Returns 400 for invalid or missing signatures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Stripe event ID (e.g. evt_1abc)
                object:
                  type: string
                  example: event
                type:
                  type: string
                  description: Stripe event type (e.g. charge.succeeded)
                  enum:
                    - charge.succeeded
                    - charge.expired
                    - charge.refunded
                    - customer.subscription.created
                    - customer.subscription.updated
                    - customer.subscription.deleted
                    - customer.subscription.paused
                    - customer.subscription.resumed
                    - customer.subscription.pending_update_applied
                    - customer.subscription.pending_update_expired
                    - customer.subscription.trial_will_end
                    - invoice.paid
                    - invoice.payment_failed
                    - invoice.payment_action_required
                    - invoice.upcoming
                    - invoice.marked_uncollectible
                    - invoice.payment_succeeded
                    - payment_intent.succeeded
                    - payment_intent.payment_failed
                    - payment_intent.canceled
                data:
                  type: object
                  description: Event payload
                created:
                  type: integer
                  description: Unix timestamp when the event was created
                livemode:
                  type: boolean
                  description: Whether the event was in live mode
                pending_webhooks:
                  type: integer
                  description: Number of pending webhooks
                request:
                  type: object
                  description: Request details (id and idempotency_key)
                api_version:
                  type: string
                  description: Stripe API version
      responses:
        "200":
          description: Event validated and enqueued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      received:
                        type: boolean
                        example: true
                      event_id:
                        type: string
                        description: Oban job ID
        "400":
          description: Invalid or missing Stripe signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations:
    get:
      operationId: invitations.list
      tags:
        - Invitations
      summary: List member invitations
      description: |
        Returns a domain-shaped, cursor-paginated list of member invitations
        for the dashboard table.

        The server always filters to `pending` and `expired` invitations,
        matching the previous hardcoded client filter. The `status` field is
        still returned in the DTO so the UI can render the badge, but there is
        no `status` query param — `accepted`/`revoked` rows are never returned.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `admin`, `president`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query over `invitations.search_text`.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/InvitationListSortField"
            default: createdAt
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Cursor-paginated member invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: invitations.create
      tags:
        - Invitations
      summary: Enqueue bulk member invitations
      description: |
        Enqueues a Phoenix/Oban bulk invitation job. This replaces the
        `bulk_invite_with_subscription` Supabase edge function invocation.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.

        Under ALE-162 (ADR 0010), issue time is side-effect free: the
        enqueued worker only inserts the pending invitation row (carrying
        the invite's first/last name, phone, date of birth, and a fresh
        Phoenix UUID for `user_id`) and enqueues the invite email. It no
        longer calls the Supabase admin API, creates a Stripe customer, or
        inserts a `user_profiles` row — acceptance materializes the
        Principal + Member record set atomically.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "202":
          description: Bulk invitation job accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreateResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: invitations.delete
      tags:
        - Invitations
      summary: Delete member invitations in bulk
      description: |
        Permanently deletes the requested invitations. Missing invitation ids
        are ignored, matching the dashboard's previous service-layer behavior.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationDeleteRequest"
      responses:
        "204":
          description: Invitations deleted
        "400":
          description: Invalid or empty invitation id list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/resend:
    post:
      operationId: invitations.resend
      tags:
        - Invitations
      summary: Resend existing member invitations
      description: |
        Re-enqueues invite-member emails through the Phoenix Email Oban worker.
        This replaces the SvelteKit service-layer `pgmq.send_batch('email_queue', ...)`
        producer used by invitation resend actions.

        Requires a Supabase JWT whose `app_metadata.roles` includes one of:
        `president`, `admin`, or `committee_coordinator`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResendCreateRequest"
      responses:
        "202":
          description: Resend emails accepted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResendCreateResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an invitation admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{id}:
    get:
      operationId: invitations.showPublic
      tags:
        - Invitations
      summary: Read public invitation state
      description: |
        Public-safe invitation lookup for rendering signup state. This response
        deliberately excludes invitee PII such as email, date of birth, names,
        and profile facts.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public invitation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInvitationResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{id}/pricing:
    get:
      operationId: invitations.pricing
      tags:
        - Invitations
      summary: Read public invitation pricing
      description: |
        Returns the signup pricing preview for a pending invitation. When a
        promotion code is supplied, Stripe validates it and applies it to the
        invoice previews before the DTO is returned.

        Under ALE-162 (ADR 0010), no `user_profiles` row exists at pricing
        time. The endpoint lazily creates a Stripe Customer on first preview
        and persists the customer id on the invitation row so acceptance can
        reuse it; subsequent pricing calls reuse the same customer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Optional Stripe promotion code entered by the invitee.
      responses:
        "200":
          description: Invitation signup pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPricingResponse"
        "400":
          description: Invalid or inactive promotion code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Pricing calculation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{id}/verify:
    post:
      operationId: invitations.verify
      tags:
        - Invitations
      summary: Verify public invitation credentials
      description: |
        Compatibility-only credential check. It never returns a bearer token;
        new acceptance flows use the protected Onboarding Continuation endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationVerifyRequest"
      responses:
        "200":
          description: Invitation credentials verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationVerifyResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Credentials do not match a pending invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /invitations/{id}/accept:
    post:
      operationId: invitations.accept
      tags:
        - Invitations
      summary: Accept a verified invitation
      description: |
        Atomically materializes a Discord-verified invitation into a Principal,
        External Identity, and Member record set in one Phoenix-owned
        transaction (ADRs 0010 and 0014). The protected Continuation header must
        identify the verified Continuation bound to this Invitation and its
        active Acceptance Attempt. Only this endpoint may transition an
        invitation to accepted.

        On success the transaction has created, all together: the
        Authentication Principal (id = invitation.user_id, authoritative
        email = invitation email), the UserProfile, the MemberProfile, the
        `member` role, the invitation flip to `accepted`,
        `user_profile.is_active = true`, and the waitlist `joined` update.

        Acceptance is registration, not login. It does **not** establish a
        Session or send a magic link — the new Member signs in through the
        normal magic-link (or Discord) login path. Failed or replayed
        acceptance leaves no partial record set. The Invitation status,
        Acceptance Attempt, one-time Discord Claim, and consumed Continuation
        provide the replay defense.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-onboarding-continuation
          in: header
          required: true
          description: Opaque verified Continuation retained only in the SvelteKit HTTP-only browser session.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptRequest"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Discord verification is missing, expired, or mismatched, or this Acceptance is already progressing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invitation or acceptance payload cannot be accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Invitation acceptance failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /onboarding/acceptance:
    post:
      operationId: onboarding.startAcceptance
      tags: [Onboarding]
      summary: Verify Invitation credentials through the legacy continuation-header transport
      description: |
        Compatibility endpoint for clients that still transport the opaque
        Continuation identifier in the x-onboarding-continuation header. New
        browser flows must use /onboarding/invitation-acceptance/verify so the
        proof remains in a signed HttpOnly cookie.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingStartAcceptanceRequest"
      responses:
        "200":
          description: Safe protected acceptance state
          headers:
            x-onboarding-continuation:
              description: Opaque proof for the SvelteKit protected HTTP-only browser session; never expose to browser JavaScript or URLs.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Malformed or invalid Invitation credentials; safe restart state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: A live flow exists but this browser has no valid proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/verify:
    post:
      operationId: onboarding.verifyInvitationAcceptance
      tags: [Onboarding]
      summary: Verify Invitation credentials and begin protected acceptance
      description: |
        Proves Invitation email and date of birth, then creates or resumes the
        one active Acceptance Attempt and its awaiting-OAuth Continuation.
        This starts no OAuth or Stripe work and creates no Principal, identity,
        Membership, role, magic link, or DHC Session. The opaque Continuation
        reference is retained only in a signed HttpOnly cookie and is never
        returned in the response view.
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingStartAcceptanceRequest"
      responses:
        "200":
          description: Safe protected acceptance state with signed HttpOnly browser proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Malformed or invalid Invitation credentials; safe restart state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: A live flow exists but this browser has no valid proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance:
    get:
      operationId: onboarding.showInvitationAcceptance
      tags: [Onboarding]
      summary: Read the protected acceptance state
      description: |
        Reads state only from opaque references held in the protected browser
        session. Missing, expired, or mismatched proof returns restart
        verification and never accepts an Invitation identifier from the caller.
      security:
        - onboardingAcceptanceSession: []
      responses:
        "200":
          description: Safe protected acceptance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Browser proof is missing or no longer eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/discord:
    get:
      operationId: onboarding.startDiscord
      tags: [Onboarding]
      summary: Begin Discord verification for Invitation Acceptance
      description: |
        Starts acceptance-specific Discord OAuth only for the current
        awaiting-OAuth Continuation. The protected Phoenix browser session binds
        the opaque Continuation reference to Assent state and PKCE data. The
        reference is never placed in OAuth state, a URL, or the response body.
      security:
        - onboardingContinuation: []
      responses:
        "302":
          description: Redirect to Discord OAuth authorization
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        "409":
          description: Browser proof is missing or no longer awaiting OAuth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/discord/cancel:
    post:
      operationId: onboarding.cancelDiscord
      tags: [Onboarding]
      summary: End the current Discord verification before payment
      description: |
        Atomically terminalizes and zeroizes the current pre-payment
        Continuation and releases its transient Discord Subject Claim. It starts
        no Stripe work and creates no Principal, External Identity, or Session.
      security:
        - onboardingContinuation: []
      responses:
        "200":
          description: Discord verification ended; Invitation credentials must be verified again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Browser proof is missing, consumed, or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/continue:
    post:
      operationId: onboarding.continueAcceptance
      tags: [Onboarding]
      summary: Consume verified Discord proof and authorize the payment form
      description: |
        Atomically binds the browser-held verified Continuation to its one active
        Acceptance Attempt before any Stripe mutation. Replays return the current
        safe Attempt projection and cannot create another Attempt, Claim, or
        provider operation. This operation has no request body and creates no
        Stripe state. A successful response is paymentReady.
      security:
        - onboardingContinuation: []
      responses:
        "200":
          description: Current safe Acceptance Attempt state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Transition is stale or disallowed; current safe state is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Browser proof is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"

  /onboarding/invitation-acceptance/payment:
    post:
      operationId: onboarding.submitPayment
      tags: [Onboarding]
      summary: Submit membership details and Stripe Elements payment input
      description: |
        Records the payment payload durably against the consumed protected
        Attempt before provider mutation, then advances the server-owned Stripe
        workflow with stable inputs and idempotency keys.
      security:
        - onboardingContinuation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingPaymentRequest"
      responses:
        "200":
          description: Current safe Acceptance Attempt state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "402":
          description: Payment input was terminally rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "409":
          description: Transition is stale or disallowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAcceptanceStateResponse"
        "422":
          description: Payment payload is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Provider progression is temporarily unavailable and recovery is scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Local finalization failed with durable reconciliation retained
          content:
            application/json:
              schema:
