  # ALE-289: target item operations live on the freed /inventory/items URLs.
  /inventory/items:
    get:
      operationId: inventoryItems.list
      tags:
        - Inventory
      summary: List target inventory items for an operator
      description: |
        Returns the cursor-paginated operator viewer for target Items. Each
        row carries the immutable slug, the server-derived label, its typed
        property values, and the recomputed availability projection.

        Ordering is by `slug` with an `id` tie-break, so page boundaries are
        stable under concurrent edits — the slug is the only ordering key no
        command can change. `totalCount` is an exact count over the same
        filtered set.

        Archived Items are absent unless `archived` asks for them. Search
        (`q`) covers the immutable slug, the derived label through its
        Category and property-value ingredients, Container name, and operator
        notes. Filters: `categoryId` (comma-separated) and `property` (comma-separated
        `definitionId:value` pairs, OR within one definition and AND across
        definitions). Absent or empty means no filter.

        Cursors are opaque and bind to limit, direction, search, and every filter; a
        cursor replayed against a different query returns `400`.

        This is the operator viewer: it discloses container location,
        operator notes, and maintenance-derived availability, so it is
        restricted to the inventory write roles rather than any member. The
        member-shaped catalog is a separate operation.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Opaque cursor from a previous response. Binds to limit,
            direction, search, and every filter; a mismatched cursor returns 400.
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Slug ordering direction.
        - name: archived
          in: query
          schema:
            type: string
            enum: [exclude, include, only]
            default: exclude
          description: |
            `exclude` (default) hides archived Items, `only` returns just
            them, `include` returns both.
        - name: q
          in: query
          schema:
            type: string
          description: |
            Free-text search over the immutable slug, Category name, property
            values, Container name, and operator notes. Empty or whitespace
            means no search.
        - name: categoryId
          in: query
          schema:
            type: string
          description: |
            Comma-separated category ids. Absent or empty returns all
            categories.
        - name: property
          in: query
          schema:
            type: string
          description: |
            Comma-separated `definitionId:value` pairs. Values of the same
            definition are ORed; separate definitions are ANDed. A value
            matches an option id, boolean, decimal, or (case-insensitive)
            text.
      responses:
        "200":
          description: Cursor-paginated operator items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an operator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: inventoryItems.create
      tags:
        - Inventory
      summary: Create one target inventory item
      description: |
        Creates one physical unit in an active Container and Category. The
        slug is server-minted and immutable; the label is derived, never
        supplied. Typed values are validated against the Category's live
        Property Definitions in the same transaction, so requiredness, value
        type, and single-select option membership are enforced together and
        reported per definition.

        Empty text is absence (no value is stored); boolean `false` is a
        real value. There are no defaults.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorItemCreateRequest"
      responses:
        "201":
          description: The created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such container or category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Archived container/category, invalid notes, or per-definition
            value errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemValidationError"

  /inventory/items/{slugOrId}:
    get:
      operationId: inventoryItems.show
      tags:
        - Inventory
      summary: Get one target inventory item by slug or id
      description: |
        Resolves one Item by its immutable slug (`item-000001`) or its id —
        the slug is stable across category changes, so operators can type
        it from a physical unit. Returns the same viewer shape as the list,
        including the derived label, typed values, and availability.

        Operator-only for the same reason as the list: it discloses container
        location, operator notes, and maintenance facts.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks an operator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: inventoryItems.update
      tags:
        - Inventory
      summary: Edit a target inventory item's notes and values
      description: |
        The generic Item edit, deliberately narrow: it touches **only**
        notes and typed values. It can never move the Item, change its
        maintenance or archive state, or affect a Loan — those are separate
        commands. A supplied `containerId` or `categoryId` is ignored;
        reclassification goes through the `category` command.

        Omitting `values` leaves the stored set untouched; supplying it
        replaces the complete set, so an omitted definition becomes absent.
        Editing an archived Item is refused — restore it first.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorItemUpdateRequest"
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The item is archived and therefore read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"
        "422":
          description: Invalid notes or per-definition value errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemValidationError"
    delete:
      operationId: inventoryItems.delete
      tags:
        - Inventory
      summary: Delete a history-free target inventory item
      description: |
        Hard-deletes an Item only when it has no Loan or Maintenance
        history, and only with explicit confirmation (`confirm: true` — a
        truthy string is not consent). Anything with history must be
        archived instead, because history is never destroyed.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorItemDeleteRequest"
      responses:
        "200":
          description: The deleted item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The item has loan or maintenance history — archive it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"
        "422":
          description: Confirmation was not given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemValidationError"

  /inventory/items/{slugOrId}/category:
    post:
      operationId: inventoryItems.changeCategory
      tags:
        - Inventory
      summary: Reclassify a target inventory item
      description: |
        Moves one Item to a different Category as a single atomic command.
        The supplied values are validated against the **new** Category's
        live definitions, so every value it requires must be present —
        partial reclassification is impossible. Old values survive only
        through explicit operator mapping onto the new definitions; anything
        unmapped stops being a current fact. The slug is unaffected.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorItemCategoryRequest"
      responses:
        "200":
          description: The reclassified item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such item or category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The item is archived and therefore read-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"
        "422":
          description: Archived category or per-definition value errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemValidationError"

  /inventory/items/{slugOrId}/move:
    post:
      operationId: inventoryItems.move
      tags:
        - Inventory
      summary: Move a target inventory item to another container
      description: |
        The dedicated movement command: it changes `containerId` and nothing
        else, so a move can never quietly reclassify or re-value an Item.

        Movement is permitted while the Item is in maintenance (servicing
        and storage are independent) and refused while a Loan is approved or
        checked out, because that Loan holds custody.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorItemMoveRequest"
      responses:
        "200":
          description: The moved item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such item or container
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The item is archived, or an approved/checked-out loan holds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"
        "422":
          description: The destination container is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemValidationError"

  /inventory/items/{slugOrId}/maintenance:
    get:
      operationId: inventoryItems.listMaintenance
      tags:
        - Inventory
      summary: List an item's retained maintenance periods
      description: |
        Returns every retained Maintenance Period of one Item, newest first,
        with start and end timestamps, the recording operators, the required
        start reason, and the optional end note. `open` is derived from the
        absence of `endedAt`.

        These are operator facts and are never exposed to members, who see
        only a generic maintenance status.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      responses:
        "200":
          description: The item's maintenance periods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMaintenancePeriodListResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/items/{slugOrId}/maintenance/start:
    post:
      operationId: inventoryItems.startMaintenance
      tags:
        - Inventory
      summary: Start a maintenance period on a target inventory item
      description: |
        Opens a Maintenance Period effective immediately. The reason is
        required — an Item leaves circulation with context or not at all.

        Pending Loan requests are rejected in the same transaction so
        servicing never strands a member waiting on a decision. An approved
        or checked-out Loan blocks the command instead, because that member
        already holds the Item. At most one period per Item is open.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMaintenanceStartRequest"
      responses:
        "200":
          description: The item, now in maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The item is archived, already has an open period, or is held by
            an approved/checked-out loan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"
        "422":
          description: The start reason is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemValidationError"

  /inventory/items/{slugOrId}/maintenance/end:
    post:
      operationId: inventoryItems.endMaintenance
      tags:
        - Inventory
      summary: End a target inventory item's open maintenance period
      description: |
        Closes the Item's open Maintenance Period, optionally with a note,
        and records the closing operator. Start and end timestamps are kept
        forever.

        Refused on an archived Item, which is read-only: archiving already
        closed any open period atomically, so there is nothing left to end.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMaintenanceEndRequest"
      responses:
        "200":
          description: The item, back in circulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The item is archived, or it has no open maintenance period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"

  /inventory/items/{slugOrId}/archive:
    post:
      operationId: inventoryItems.archive
      tags:
        - Inventory
      summary: Archive a target inventory item
      description: |
        Archives an Item instead of destroying it — the lifecycle end for
        anything with Loan or Maintenance history.

        Pending requests are rejected and any open Maintenance Period is
        closed in the same transaction, with the supplied reason recorded as
        that period's end note. An approved or checked-out Loan blocks
        archival: a member holding the Item outranks retirement. Archiving
        an already archived Item is a no-op, so a repeated command is not an
        error.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorItemArchiveRequest"
      responses:
        "200":
          description: The archived item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An approved or checked-out loan holds the item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"

  /inventory/items/{slugOrId}/restore:
    post:
      operationId: inventoryItems.restore
      tags:
        - Inventory
      summary: Restore an archived target inventory item
      description: |
        Returns an archived Item to circulation, gated on the dependencies
        an active Item needs: a live Category, an entirely active Container
        chain, and retained values that still satisfy the Category's current
        definitions.

        The last gate matters because the make-required and retire gates
        only consider *active* Items, so an archived Item can legitimately
        drift out of validity while retired. Restoring an Item that is not
        archived is a no-op.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, or `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/SlugOrId"
      responses:
        "200":
          description: The restored item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated user lacks a write role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No item exists for the given slug or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            A concurrent move kept rewriting the item's container until
            restore gave up. Retry the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemConflictError"
        "422":
          description: |
            The category or container chain is archived, or retained values
            no longer validate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorItemValidationError"

  /inventory/operator/loans/queue:
    get:
      operationId: inventoryOperatorLoanQueue.show
      tags:
        - Inventory
      summary: Shared operator loan queue
      description: |
        The duty-officer work list: every open Loan partitioned into four
        buckets — pending requests, handovers due, returns and overdue,
        and open maintenance. Each bucket is `{count, rows}` where
        `count` is the length of `rows`, so a count can never disagree
        with the list beside it.

        The queue is deliberately unpaginated. The open-loan set is
        bounded by the club's physical items, and a cursor that hid
        rows would make `count` lie about what the operator can see.
        A future-dated approval is in no bucket: there is nothing to
        hand over today. Closed loans never appear.

        Operator-only: rows name the borrower and disclose the
        Container path and maintenance reasons. This is not a role
        variant of `/inventory/loans/mine`.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
        - cookieSession: []
      responses:
        "200":
          description: The four work-list buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanQueueResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but not an inventory operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/operator/loans/{loanId}:
    get:
      operationId: inventoryOperatorLoans.show
      tags:
        - Inventory
      summary: Get one loan as an operator sees it
      description: |
        Operator-shaped Loan viewer: borrower, requested and approved
        dates, actual checkout/return timestamps, notes, the item
        snapshot, and the Container path snapshotted at approval.

        Distinct from `/inventory/loans/mine/{loanId}`, which must not
        gain operator fields.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "200":
          description: The loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but not an inventory operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No loan exists with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/operator/loans/{loanId}/approve:
    post:
      operationId: inventoryOperatorLoans.approve
      tags:
        - Inventory
      summary: Approve a pending loan request
      description: |
        Approves one `requested` Loan, reserving the Item and rejecting
        every competing pending request with a system note. Dates may
        be adjusted; omitted dates keep the Member's requested values.
        The Container path is snapshotted here — approval is the
        collection entitlement.

        Notifies the borrower with the approved dates and Container
        path. Automatically rejected competitors are not notified.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorLoanApproveRequest"
      responses:
        "200":
          description: The approved loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but not an inventory operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No loan exists with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The loan is not pending, or the item is already allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanConflictError"
        "422":
          description: Invalid dates or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanValidationError"

  /inventory/operator/loans/{loanId}/reject:
    post:
      operationId: inventoryOperatorLoans.reject
      tags:
        - Inventory
      summary: Reject a pending loan request
      description: |
        Rejects one `requested` Loan with an optional operator note.
        Reserves nothing. Notifies the borrower.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorLoanNoteRequest"
      responses:
        "200":
          description: The rejected loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but not an inventory operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No loan exists with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The loan is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanConflictError"
        "422":
          description: Invalid note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanValidationError"

  /inventory/operator/loans/{loanId}/cancel:
    post:
      operationId: inventoryOperatorLoans.cancel
      tags:
        - Inventory
      summary: Cancel an approved loan as an operator
      description: |
        Cancels one `approved` Loan. A pending request is rejected
        instead; after checkout release is a return. Notifies the
        borrower.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryOperatorLoanNoteRequest"
      responses:
        "200":
          description: The cancelled loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but not an inventory operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No loan exists with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The loan is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanConflictError"
        "422":
          description: Invalid note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanValidationError"

  /inventory/operator/loans/{loanId}/checkout:
    post:
      operationId: inventoryOperatorLoans.checkout
      tags:
        - Inventory
      summary: Check out an approved loan
      description: |
        Hands an approved Item over to its borrower. Gated to an
        `approved` Loan whose approved window contains today and whose
        Item is out of maintenance. An early or late handover edits
        the dates first — this command does not widen the window.

        No notification: checkout is a physical fact the borrower is
        present for.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "200":
          description: The checked-out loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but not an inventory operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No loan exists with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The loan is not approved, is outside its window, or the item is in maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOperatorLoanConflictError"

  /inventory/operator/loans/{loanId}/return:
    post:
      operationId: inventoryOperatorLoans.return
      tags:
        - Inventory
      summary: Return a checked-out loan
      description: |
        Returns a `checked_out` Item, releasing it immediately. There
        is no condition outcome. No notification: the borrower is
        present for the handback.

        Requires a Phoenix session whose roles include one of:
        `quartermaster`, `president`, `admin`.
      security:
        - cookieSession: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
