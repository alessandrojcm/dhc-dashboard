        - id
        - quantity
        - outForMaintenance
        - category
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: integer
        outForMaintenance:
          type: boolean
        category:
          type: object
          nullable: true
          description: Summary of the item's equipment category, or null.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    InventoryContainerDetail:
      type: object
      description: Container detail with parent, child containers, and direct items.
      required:
        - id
