            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Cursor-paginated waitlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntriesResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `beginners.waitlist.manage` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/entries/{id}:
    get:
      operationId: waitlist.showEntry
      tags:
        - Waitlist
      summary: Read one waitlist entry
      description: |
        Returns one domain-shaped waitlist entry for admin inspection.

        Requires the `beginners.waitlist.manage` capability.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Waitlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `beginners.waitlist.manage` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Waitlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: waitlist.updateEntry
      tags:
        - Waitlist
      summary: Update waitlist entry admin fields
      description: |
        Updates the entry's admin notes. Waitlist Status is not editable here:
        it changes only through named commands (spec story 121), so a
        `status` property is rejected.

        Requires the `beginners.waitlist.manage` capability.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistEntryUpdateRequest"
      responses:
        "200":
          description: Updated waitlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `beginners.waitlist.manage` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Waitlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/entries/{id}/guardian:
    get:
      operationId: waitlist.entryGuardian
      tags:
        - Waitlist
      summary: Read waitlist entry guardian details
      description: |
        Returns guardian contact details for a minor waitlist applicant, or
        `data: null` when the entry exists but has no guardian details.

        Requires the `beginners.waitlist.manage` capability.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Waitlist guardian details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistGuardianResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `beginners.waitlist.manage` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Waitlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /waitlist/entries/{id}/restore:
    post:
      operationId: waitlist.restoreEntry
      tags:
        - Waitlist
      summary: Restore a removed waitlist entry
      description: |
        Moves a `removed` entry back to `waiting` with its original priority
        (its initial registration date), within 3 months of its removal.

        Requires the `beginners.waitlist.manage` capability.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The restored waitlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntryResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `beginners.waitlist.manage` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Waitlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The entry cannot be restored: `not_removed` (its standing is not
            `removed`) or `restore_window_passed` (removed more than 3 months
            ago).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications:
    get:
      operationId: notifications.list
      tags:
        - Notifications
      summary: List current user notifications
      description: |
        Returns the authenticated user's in-app notifications in newest-first
        order plus the unread notification count. This endpoint mirrors the
        old `notifications.user_id = auth.uid()` RLS boundary: users can only
        read notifications generated for their own Supabase Auth user id.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response.
      responses:
        "200":
          description: Cursor-paginated notifications for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/read-all:
    post:
      operationId: notifications.markAllRead
      tags:
        - Notifications
      summary: Mark all current user notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsMarkAllReadResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/push/config:
    get:
      operationId: notificationsPush.config
      tags:
        - Notifications
      summary: Web Push availability and application server key
      description: |
        ALE-299. Tells the browser whether Web Push is configured on this
        deployment and, if so, the VAPID **public** key to pass as
        `applicationServerKey` to `PushManager.subscribe`. When `enabled` is
        false the key is `null` and the notification centre explains that push
        is unavailable rather than prompting for permission.

        The VAPID private key is never exposed by any endpoint.
      security:
        - cookieSession: []
      responses:
        "200":
          description: Push configuration for the browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsPushConfigResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/push/subscriptions:
    post:
      operationId: notificationsPush.subscribe
      tags:
        - Notifications
      summary: Register this browser for Web Push
      description: |
        ALE-299. Stores the browser's `PushSubscription` for the authenticated
        principal. One row per browser installation: the push-service
        `endpoint` is the identity, so re-registering the same endpoint
        refreshes its keys in place, and an endpoint last registered under a
        different principal (a shared device) is reassigned to the caller.
        A member with several devices registers each one independently.

        The response discloses only the stored row's `id` and `createdAt` —
        never the endpoint or encryption keys.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsPushSubscribeRequest"
      responses:
        "201":
          description: Subscription stored (created or refreshed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsPushSubscriptionResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Malformed subscription (non-https endpoint, bad keys)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/push/unsubscribe:
    post:
      operationId: notificationsPush.unsubscribe
      tags:
        - Notifications
      summary: Remove this browser's Web Push subscription
      description: |
        ALE-299. Deletes the caller's stored subscription for the given
        endpoint. Scoped to the authenticated principal, so a member cannot
        silence another member's device; idempotent because the browser may
        already have dropped its side. `removed` reports whether a row was
        deleted.
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsPushUnsubscribeRequest"
      responses:
        "200":
          description: Outcome of the removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsPushUnsubscribeResponse"
        "401":
          description: Missing or invalid Phoenix session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Missing endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/{id}/read:
    patch:
      operationId: notifications.markRead
      tags:
        - Notifications
      summary: Mark one current user notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Notification does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members:
    get:
      operationId: members.list
      tags:
        - Members
      summary: List members
      description: |
        Returns a domain-shaped, cursor-paginated list of members for the
        dashboard table, replacing the browser-side PostgREST read over
        `member_management_view`.

        `membershipStatus` is computed server-side, reproducing the legacy
        view's CASE: `inactive` when `user_profiles.is_active = false`;
        `paused` when `member_profiles.subscription_paused_until` is not null
        and greater than `now()`; otherwise `active`. This is distinct from
        the Member's `isActive` flag — a paused member has
        `isActive: true, membershipStatus: "paused"`.

        Member email is read directly from `auth.users` via the `AuthUser`
        schema (no PostgREST-era helper function). Internal/leaky fields
        (`searchText`, `userProfileId`, `createdAt`, `updatedAt`, `roles`,
        `additionalData`, `fromWaitlistId`, `waitlistRegistrationDate`) are
        not exposed.

        Requires the `members.directory.read` capability (`Dhc.Auth.Capabilities`);
        a session without it 403s; a missing session 401s.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            enum: [10, 25, 50, 100]
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor returned by a previous response. Binds to the query params (limit, sort, direction, membershipStatus, q); a mismatched cursor returns 400.
        - name: q
          in: query
          schema:
            type: string
          description: Websearch-style full text query over `user_profiles.search_text`.
        - name: membershipStatus
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of membership statuses to include. Absent or
            empty returns all statuses (no filter). Example: `active,paused`.
            Valid values: `active`, `inactive`, `paused`.
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/MembersListSortField"
            default: lastName
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Cursor-paginated members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersListResponse"
        "400":
          description: Invalid query parameter or mismatched cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `members.directory.read` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/insurance-form:
    get:
      operationId: members.insuranceForm
      tags:
        - Members
      summary: Read the member insurance form link
      description: |
        Returns the URL of the HEMA insurance form link configured for members.

        Exposes a specific domain read, not a generic settings proxy: the
        `Dhc.Members` context owns the `hema_insurance_form_link` settings read.

        Any authenticated user (valid Supabase JWT) may read this; no committee
        role is required, mirroring the `settings` SELECT RLS policy
        (`USING (true)` for authenticated). A member can read the insurance
        form link on their own profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insurance form link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersInsuranceFormResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/analytics:
    get:
      operationId: members.analytics
      tags:
        - Members
      summary: Read members analytics
      description: |
        Returns dashboard analytics for active members, computed server-side
        over `member_profiles` joined to `user_profiles` where `is_active = true`.

        Replaces the five browser-side PostgREST aggregate queries over
        `member_management_view` with a single domain-shaped read. The
        `preferred_weapon[]` array is unnested and counted in SQL so the
        browser no longer downloads every active member's weapon array to
        count it in JavaScript. Raw enum strings are returned for weapons;
        the UI keeps doing display prettification.

        Requires the `members.directory.read` capability (`Dhc.Auth.Capabilities`);
        a session without it 403s; a missing session 401s.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersAnalyticsResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Session lacks the `members.directory.read` capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/me:
    get:
      operationId: members.me
      tags:
        - Members
      summary: Read the current user's dashboard identity
      description: |
        Returns the authenticated user's identity, contact details, optional
        Stripe customer reference, and JWT roles. Replaces the browser-side
        user_profiles/user_roles reads and get_current_user_with_profile RPC
        used by the dashboard shell.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user profile exists for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/roles:
    get:
      operationId: memberRoles.show
      tags: [Members]
      summary: Read roles for the member role editor
      description: Requires members.roles.edit (active president or admin only).
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current and available club roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRolesResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Insufficient role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Member not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: memberRoles.update
      tags: [Members]
      summary: Replace a member's roles
      description: |
        Requires members.roles.edit (active president or admin only). The member
        role is mandatory; other existing roles may be assigned or removed,
        including on the caller. A changed role
        set revokes all sessions and socket tokens atomically and disconnects
        established sockets after commit. A no-op does not sign the member out.
        expectedRoles must match the current set, otherwise returns 409.
        Removing the last active role editor's authority returns 409.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles, expectedRoles]
              properties:
                roles:
                  type: array
                  description: Must include member; it cannot be removed.
                  minItems: 1
                  uniqueItems: true
                  maxItems: 13
                  items: { $ref: "#/components/schemas/ClubRole" }
                expectedRoles:
                  type: array
                  uniqueItems: true
                  maxItems: 13
                  items: { $ref: "#/components/schemas/ClubRole" }
      responses:
        "200":
          description: Updated roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRolesResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Insufficient role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Member not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Stale roles or last active role editor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRolesConflictError" }
        "422":
          description: Invalid roles payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRolesValidationError" }

  /members/{memberId}:
    get:
      operationId: members.show
      tags:
        - Members
      summary: Read a single member
      description: |
        Returns the flat Member DTO (same shape as `GET /members`) for one
        member: Member profile facts plus the Membership state projection
        fields contributed by `Dhc.Membership`. Replaces the PostgREST-era
        `get_member_data` RPC. Owner-scoped `members.profile.read`: a member
        may read their own record (`{memberId}` is their principal id); a
        holder of `members.profile.read` may read any member. Anyone else
        gets the same 404 as a missing member.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Supabase user id (`auth.users.id`) of the member.
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            No member exists for the given id. Also returned, indistinguishably, when the
            caller is neither the member nor holds the owner-scoped
            `members.profile.*` capability (the member is concealed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      operationId: members.update
      tags:
        - Members
      summary: Update a member's profile facts
      description: |
        Partial update of Member profile facts (only the fields present in the
        body are written). Replaces the PostgREST-era `update_member_data`
        RPC. `isActive` is NOT writable — it is a Stripe-webhook projection
        (ADR-0008); sending it returns 422. When name or phone changes, a
        best-effort `customers.update` echoes to Stripe (Member is SoT for
        customer facts); a Stripe failure still returns 200 and the periodic
        `Dhc.StripeSync` batch reconciles later. Self-or-broad-committee auth.
        Returns the full flat Member DTO.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Supabase user id of the member to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdateRequest"
      responses:
        "200":
          description: The updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            No member exists for the given id. Also returned, indistinguishably, when the
            caller is neither the member nor holds the owner-scoped
            `members.profile.*` capability (the member is concealed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid update payload (e.g. isActive present, or a field failed validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /members/{memberId}/membership/pause:
    post:
      operationId: membership.pause
      tags:
        - Membership
      summary: Pause a member's subscription
      description: |
        Pauses the member's Stripe membership subscription and writes the
        confirmed `resumes_at` to `subscription_paused_until`. Stripe is the
        source of truth (ADR-0008): the DB write only happens after Stripe
        confirms. 409 if no active membership subscription exists; 404 if the
        member/customer is missing. Self-or-broad-committee auth (same as
        `GET /members/{id}`). `pauseUntil` must be 1 day–6 months from now.
        Returns the full flat Member DTO.
      security:
        - bearerAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The Supabase user id of the member whose subscription to pause.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipPauseRequest"
      responses:
        "200":
          description: Subscription paused; returns the updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
        "401":
          description: Missing or invalid Supabase JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            No member/customer record exists for the given id. Also returned, indistinguishably, when the
            caller is neither the member nor holds the owner-scoped
            `members.profile.*` capability (the member is concealed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No active membership subscription found for this customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Invalid pause payload (e.g. pauseUntil out of range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Stripe rejected the pause call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

