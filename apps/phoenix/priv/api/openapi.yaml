          type: string
          format: date-time
    InventoryContainerDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryContainerDetail"
    InventoryDashboardStatsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - containers
            - categories
            - items
            - maintenance
          properties:
            containers:
              type: integer
              minimum: 0
            categories:
              type: integer
              minimum: 0
            items:
              type: integer
              minimum: 0
            maintenance:
              type: integer
              minimum: 0

    InventoryItem:
      type: object
      description: |
        Inventory item with `container` and `category` summaries used by both
        the list and single-item responses.
      required:
        - id
        - containerId
        - categoryId
        - quantity
        - outForMaintenance
        - attributes
        - container
        - category
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        containerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Container the item lives in. Nullable in the schema for forward
            compatibility, but the persistence layer marks the column NOT
            NULL today, so reads always return a value.
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: |
            Equipment category the item belongs to. Nullable in the schema;
            the persistence column is NOT NULL today.
        quantity:
          type: integer
          minimum: 1
        outForMaintenance:
          type: boolean
        attributes:
          type: object
          description: |
            Free-form attribute values keyed by the category's attribute
            `name`. Shape is not validated against the category's
            `availableAttributes` in this slice (future work).
        notes:
          type: string
          nullable: true
          maxLength: 1000
        photoUrl:
          type: string
          nullable: true
        container:
          type: object
          nullable: true
          description: Summary of the item's container, or null.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            parentContainerId:
              type: string
              format: uuid
              nullable: true
          required:
            - id
            - name
            - parentContainerId
        category:
          type: object
          nullable: true
          description: Summary of the item's equipment category, or null.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: Supabase user id of the creator (JWT `sub`).
        updatedBy:
          type: string
          format: uuid
          nullable: true
          description: Supabase user id of the last updater (JWT `sub`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InventoryItemListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
            - limit
            - nextCursor
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InventoryItem"
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
              description: Opaque cursor for the next page, or null when this is the last page.
    InventoryItemResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryItem"
    InventoryItemCreateRequest:
      type: object
      required:
        - containerId
        - categoryId
        - quantity
      properties:
        containerId:
          type: string
          format: uuid
          description: Container the item lives in. Required on create.
        categoryId:
          type: string
          format: uuid
          description: Equipment category for the item. Required on create.
        attributes:
          type: object
          description: |
            Free-form attribute values keyed by the category's attribute
            `name`. Defaults to `{}` when omitted.
        quantity:
          type: integer
          minimum: 1
          description: Item count; must be positive (DB CHECK constraint).
        notes:
          type: string
          nullable: true
          maxLength: 1000
        outForMaintenance:
          type: boolean
          default: false
        photoUrl:
          type: string
          nullable: true
    InventoryItemHistory:
      type: object
      description: |
        One `inventory_history` row for an item. `oldContainer` and
        `newContainer` are name summaries (nullable when the action did not
        involve a container move). `item` is the affected item summary — only
        populated by the global `GET /inventory/history` endpoint; the per-item
        history endpoint leaves it null.
      required:
        - id
        - itemId
        - action
        - oldContainerId
        - newContainerId
        - oldContainer
        - newContainer
        - item
        - notes
        - changedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - created
            - updated
            - moved
            - maintenance_out
            - maintenance_in
        oldContainerId:
          type: string
          format: uuid
          nullable: true
        newContainerId:
          type: string
          format: uuid
          nullable: true
        oldContainer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        newContainer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        item:
          type: object
          nullable: true
          description: |
            Summary of the affected item, populated only by the global history
            endpoint. `attributes` is the free-form attribute map so the UI can
            derive a display name without a second lookup.
          properties:
            id:
              type: string
              format: uuid
            attributes:
              type: object
          required:
            - id
            - attributes
        notes:
          type: string
          nullable: true
        changedBy:
          type: string
          format: uuid
          nullable: true
          description: Supabase user id of the actor (JWT `sub`).
        createdAt:
          type: string
          format: date-time
    InventoryItemMoveRequest:
      type: object
      description: Body for `POST /inventory/items/{id}/move`.
      required:
        - containerId
      properties:
        containerId:
          type: string
          format: uuid
          description: The container to move the item into.
        notes:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional note stored on the `moved` history row.
    InventoryItemMaintenanceRequest:
      type: object
      description: Body for `POST /inventory/items/{id}/maintenance`.
      required:
        - outForMaintenance
      properties:
        outForMaintenance:
          type: boolean
          description: |
            `true` records a `maintenance_out` history row; `false` records a
            `maintenance_in` history row.
        notes:
          type: string
          nullable: true
          maxLength: 1000
          description: Optional note stored on the maintenance history row.
    InventoryItemHistoryListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - history
            - limit
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/InventoryItemHistory"
            limit:
              type: integer
              minimum: 1
              maximum: 100
    Error:
      type: object
      properties:
        errors:
          type: object
          properties:
            detail:
              type: string
    AuthSessionProjection:
      type: object
      required:
        - data
      description: |
        The Phoenix session projection. The authoritative login identity
        (`principal.id` / `principal.email`) plus the current live roles. No
        `is_active`, no raw token, no Supabase `sub`/bearer/refresh
        compatibility. ALE-164: this replaces the Supabase `Session` +
        `getUser()` projection on the dashboard.
      properties:
        data:
          type: object
          required:
            - principal
            - roles
          properties:
            principal:
              type: object
              required:
                - id
                - email
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
            roles:
              type: array
              items:
                type: string
              description: |
                Current live roles from `user_roles`, loaded on every
                authenticated request.
