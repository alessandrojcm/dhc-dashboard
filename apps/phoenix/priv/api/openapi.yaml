          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 500
        parentContainerId:
          type: string
          format: uuid
          nullable: true
          description: |
            Parent container id, or null/omitted for a root container. Must
            not be the container itself or one of its descendants (enforced
            on update).
    InventoryContainerChild:
      type: object
      description: Minimal child container reference `{id, name}`.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    InventoryContainerItem:
      type: object
      description: |
        Minimal inventory item summary shown on the container detail page:
        identity and `category` summary. Availability lives in the item
        viewer, not here (full item detail lives in the items slice).
      required:
        - id
        - category
      properties:
        id:
          type: string
          format: uuid
        category:
          type: object
          nullable: true
          description: Summary of the item's equipment category, or null.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    InventoryContainerDetail:
      type: object
      description: Container detail with parent, child containers, and direct items.
      required:
        - id
        - name
        - description
        - parentContainerId
        - parentContainer
        - childContainers
        - items
        - itemCount
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        parentContainerId:
          type: string
          format: uuid
          nullable: true
        parentContainer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        childContainers:
          type: array
          items:
            $ref: "#/components/schemas/InventoryContainerChild"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryContainerItem"
        itemCount:
          type: integer
          description: Number of inventory items directly in this container.
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the container is archived instead of deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InventoryContainerDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryContainerDetail"
    InventoryPropertyOption:
      type: object
      description: |
        Operator viewer for a stable single-select option. Identity is
        immutable; `label` may change. `retiredAt` is set when the option
        has left current Item forms but remains displayable in history.
      required:
        - id
        - propertyDefinitionId
        - label
        - position
        - retiredAt
      properties:
        id:
          type: string
          format: uuid
        propertyDefinitionId:
          type: string
          format: uuid
        label:
          type: string
        position:
          type: integer
        retiredAt:
          type: string
          format: date-time
          nullable: true
    InventoryPropertyDefinition:
      type: object
      description: |
        Operator viewer for a Category-owned Property Definition. Identity
        is stable across renames. `valueType` is one of `text`, `decimal`,
        `boolean`, or `single_select`. `identifyingPosition` orders the
        derived Item label; null means the definition is not identifying.
      required:
        - id
        - categoryId
        - label
        - valueType
        - required
        - identifyingPosition
        - retiredAt
        - options
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        label:
          type: string
        valueType:
          type: string
          enum:
            - text
            - decimal
            - boolean
            - single_select
        required:
          type: boolean
        identifyingPosition:
          type: integer
          nullable: true
        retiredAt:
          type: string
          format: date-time
          nullable: true
        options:
          type: array
          items:
            $ref: "#/components/schemas/InventoryPropertyOption"
    InventoryDefinitionListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - definitions
          properties:
            definitions:
              type: array
              items:
                $ref: "#/components/schemas/InventoryPropertyDefinition"
    InventoryDefinitionResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryPropertyDefinition"
    InventoryDefinitionCreateRequest:
      type: object
      required:
        - label
        - valueType
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        valueType:
          type: string
          enum:
            - text
            - decimal
            - boolean
            - single_select
        required:
          type: boolean
        identifyingPosition:
          type: integer
          nullable: true
          minimum: 0
    InventoryDefinitionUpdateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        valueType:
          type: string
          enum:
            - text
            - decimal
            - boolean
            - single_select
        required:
          type: boolean
        identifyingPosition:
          type: integer
          nullable: true
          minimum: 0
    InventoryOptionListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - options
          properties:
            options:
              type: array
              items:
                $ref: "#/components/schemas/InventoryPropertyOption"
    InventoryOptionResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryPropertyOption"
    InventoryDefinitionUpdateError:
      description: |
        422 on a definition update: `type_immutable`, or `required_blocked`
        with one `fields["items.<itemId>"]` entry per active item that still
        lacks a valid value. A changeset failure is a plain `Error` with
        `fields` and no `code`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - type_immutable
                    - required_blocked
    InventoryDefinitionRetireError:
      description: |
        409 when a definition still has active item values.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - still_referenced
    InventoryOptionRetireError:
      description: |
        409 when an option still has active item values.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - still_referenced
    InventoryOptionCreateRequest:
      type: object
      required:
        - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        position:
          type: integer
          minimum: 0
    InventoryOptionUpdateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        position:
          type: integer
          minimum: 0
    InventoryOperatorItemValue:
      type: object
      description: |
        One typed property value of an Item, joined to its definition so the
        viewer can render it without a second lookup. Exactly one of `text`,
        `decimal`, `boolean`, or `optionId`/`optionLabel` is populated,
        matching `valueType`. Values whose definition or option has been
        retired are still returned so archived and historical facts stay
        readable.
      required:
        - definitionId
        - definitionLabel
        - valueType
        - identifyingPosition
        - text
        - decimal
        - boolean
        - optionId
        - optionLabel
      properties:
        definitionId:
          type: string
          format: uuid
        definitionLabel:
          type: string
        valueType:
          type: string
          enum:
            - text
            - decimal
            - boolean
            - single_select
        identifyingPosition:
          type: integer
          nullable: true
          description: |
            Position of this value in the derived label, or null when the
            definition is not identifying.
        text:
          type: string
          nullable: true
        decimal:
          type: string
          nullable: true
          description: Decimal serialized as a string to preserve precision.
        boolean:
          type: boolean
          nullable: true
        optionId:
          type: string
          format: uuid
          nullable: true
        optionLabel:
          type: string
          nullable: true
    InventoryOperatorItemAvailability:
      type: object
      description: |
        Recomputed on every read from archive state, the open Maintenance
        Period, and approved/checked-out Loans — never a stored flag. Status
        precedence is `archived`, then `maintenance`, then `on_loan`, then
        `available`. A pending request is not an availability input.
      required:
        - available
        - status
      properties:
        available:
          type: boolean
        status:
          type: string
          enum:
            - available
            - maintenance
            - on_loan
            - archived
    InventoryOperatorItemSummaryRef:
      type: object
      description: A minimal container or category reference for the viewer.
      required:
        - id
        - name
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true
    InventoryOperatorItem:
      type: object
      description: |
        Operator viewer for one target Item — one row is one physical unit.
        `slug` is the immutable server-minted identity; `label` is derived
        server-side from the category plus its ordered identifying values
        (slug as fallback) and is never stored. Internal and legacy columns
        (`quantity`, `photoUrl`, `attributes`, `outForMaintenance`,
        `createdBy`, `updatedBy`) are deliberately absent.
      required:
        - id
        - slug
        - label
        - categoryId
        - containerId
        - category
        - container
        - values
        - notes
        - availability
        - archivedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Immutable server-minted identity, e.g. `item-000001`.
        label:
          type: string
          description: Server-derived display label. Never stored.
        categoryId:
          type: string
          format: uuid
        containerId:
          type: string
          format: uuid
          nullable: true
        category:
          allOf:
            - $ref: "#/components/schemas/InventoryOperatorItemSummaryRef"
          nullable: true
        container:
          allOf:
            - $ref: "#/components/schemas/InventoryOperatorItemSummaryRef"
          nullable: true
        values:
          type: array
          items:
            $ref: "#/components/schemas/InventoryOperatorItemValue"
        notes:
          type: string
          nullable: true
          description: Plain-text current facts. No audit history.
        availability:
          $ref: "#/components/schemas/InventoryOperatorItemAvailability"
        archivedAt:
          type: string
          format: date-time
          nullable: true
    InventoryOperatorItemListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
            - totalCount
            - limit
            - nextCursor
            - previousCursor
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InventoryOperatorItem"
            totalCount:
              type: integer
              minimum: 0
              description: Exact count over the filtered set, never an estimate.
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
            previousCursor:
              type: string
              nullable: true
    InventoryOperatorItemResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryOperatorItem"
    InventoryOperatorItemValues:
      type: object
      description: |
        Supplied typed values keyed by Property Definition id. A value is a
        string (text, decimal, or option id), a boolean, or a number. Empty
        text means absence; boolean `false` is a real value.
      additionalProperties:
        nullable: true
        oneOf:
          - type: string
          - type: boolean
          - type: number
    InventoryOperatorItemCreateRequest:
      type: object
      required:
        - containerId
        - categoryId
      properties:
        containerId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        notes:
          type: string
          nullable: true
          maxLength: 1000
        values:
          $ref: "#/components/schemas/InventoryOperatorItemValues"
    InventoryOperatorItemUpdateRequest:
      type: object
      description: |
        The generic Item edit. It carries no container, category,
        maintenance, archive, or loan field by construction, so it cannot
        express those state changes.
      properties:
        notes:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Omit to leave notes untouched. Empty or whitespace-only clears
            them.
        values:
          allOf:
            - $ref: "#/components/schemas/InventoryOperatorItemValues"
          description: |
            Omit to leave stored values untouched. Supplying it replaces the
            complete set, so an omitted definition becomes absent.
    InventoryOperatorItemCategoryRequest:
      type: object
      required:
        - categoryId
      properties:
        categoryId:
          type: string
          format: uuid
        values:
          allOf:
            - $ref: "#/components/schemas/InventoryOperatorItemValues"
          description: |
            Values for the **new** category. Every value it requires must be
            present; anything unmapped stops being a current fact.
    InventoryOperatorItemMoveRequest:
      type: object
      required:
        - containerId
      properties:
        containerId:
          type: string
          format: uuid
          description: The destination container. Must be active.
    InventoryOperatorItemArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Recorded as the end note of an open Maintenance Period closed by
            this archival.
    InventoryOperatorItemDeleteRequest:
      type: object
      required:
        - confirm
      properties:
        confirm:
          type: boolean
          description: |
            Must be the boolean `true`. A truthy string is not consent.
    InventoryMaintenancePeriod:
      type: object
      description: |
        One retained Maintenance Period. Timestamps and recording operators
        are kept forever; `open` is derived from the absence of `endedAt`.
      required:
        - id
        - itemId
        - startedAt
        - startedByPrincipalId
        - startReason
        - endedAt
        - endedByPrincipalId
        - endNote
        - open
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        startedByPrincipalId:
          type: string
          format: uuid
        startReason:
          type: string
        endedAt:
          type: string
          format: date-time
          nullable: true
        endedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        endNote:
          type: string
          nullable: true
        open:
          type: boolean
    InventoryMaintenancePeriodListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - periods
          properties:
            periods:
              type: array
              items:
                $ref: "#/components/schemas/InventoryMaintenancePeriod"
    InventoryMaintenanceStartRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            Required — an item leaves circulation with context or not at all.
    InventoryMaintenanceEndRequest:
      type: object
      properties:
        endNote:
          type: string
          nullable: true
          maxLength: 1000
    InventoryOperatorItemConflictError:
      description: |
        409 interlock conflicts on an operator item command. Each is a domain
        conflict a losing racer receives instead of a server error: the item
        is archived and read-only, a loan holds it, a maintenance period is
        already open or absent, loan/maintenance history forbids deletion, or
        restore gave up after the item's container kept moving.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - archived
                    - loan_active
                    - maintenance_open
                    - no_open_maintenance
                    - has_history
                    - retry_exhausted
    InventoryOperatorItemValidationError:
      description: |
        422 on an operator item command. `invalid_values` carries one
        `fields["values.<definitionId>"]` entry per failing Property Definition
        whose message is the reason (`required`, `type_mismatch`,
        `unknown_option`, `retired_option`, `retired_definition`,
        `unknown_definition`), so the client can map each failure back to its
        form field. A changeset failure is a plain `Error` with `fields` and no
        `code`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - invalid_values
                    - invalid_notes
                    - archived_category
                    - archived_container
                    - reason_required
                    - confirmation_required
    InventoryCatalogAvailability:
      type: object
      description: |
        The **only** explanation a Member ever receives for an unavailable
        Item. `on_loan` and `maintenance` are deliberately generic: they can
        never identify a borrower, reveal Loan dates, or expose an operator
        Maintenance note. Recomputed on read from the same projection the
        operator viewer uses, so the two can never disagree about whether an
        Item is free.
      required:
        - available
        - reason
      properties:
        available:
          type: boolean
        reason:
          type: string
          enum:
            - available
            - on_loan
            - maintenance
    InventoryCatalogCategoryRef:
      type: object
      description: A minimal Category reference for the member catalog.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    InventoryCatalogItem:
      type: object
      description: |
        One Item as a Member sees it. This carries everything a Member is
        entitled to and nothing more: no Container, no operator notes, no
        Maintenance facts, no borrower, no archive state. The absent fields
        are the contract — this is a separate read model from
        `InventoryOperatorItem`, not a filtered view of it.

        `label` is derived server-side from the Category plus its ordered
        identifying values (slug as fallback) and is never stored.
      required:
        - id
        - slug
        - label
        - category
        - values
        - availability
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Immutable server-minted identity, e.g. `item-000001`.
        label:
          type: string
          description: Server-derived display label. Never stored.
        category:
          allOf:
            - $ref: "#/components/schemas/InventoryCatalogCategoryRef"
          nullable: true
        values:
          type: array
          items:
            $ref: "#/components/schemas/InventoryOperatorItemValue"
          description: |
            Typed property values, reusing the operator value shape: a
            value is a Category-level fact with no privacy dimension.
        availability:
          $ref: "#/components/schemas/InventoryCatalogAvailability"
    InventoryCatalogItemListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - items
            - totalCount
            - limit
            - nextCursor
            - previousCursor
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/InventoryCatalogItem"
            totalCount:
              type: integer
              minimum: 0
              description: Exact count over the filtered set, never an estimate.
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
            previousCursor:
              type: string
              nullable: true
    InventoryCatalogItemResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryCatalogItem"
    InventoryLoanRequestRequest:
      type: object
      description: |
        A Member's Loan request for themselves. There is no borrower field by
        design: the borrower is the authenticated caller.
      required:
        - startsOn
        - dueOn
      properties:
        startsOn:
          type: string
          format: date
          description: |
            Intended collection date, a calendar date in `Europe/Dublin`.
            Must be today or later.
        dueOn:
          type: string
          format: date
          description: |
            Intended return date, a calendar date in `Europe/Dublin`. Must
            be on or after `startsOn`.
        note:
          type: string
          maxLength: 1000
          description: Optional plain-text note. Blank means absent.
    InventoryLoanCancelRequest:
      type: object
      description: A Member cancelling their own Loan before checkout.
      properties:
        note:
          type: string
          maxLength: 1000
          description: Optional plain-text reason. Blank means absent.
    InventoryMemberLoan:
      type: object
      description: |
        One Loan as its borrower sees it.

        `itemSlug` and `itemLabel` are the immutable snapshots captured at
        request time, not a live Item read, so history stays readable after
        the Item is archived. `containerPath` is populated only from approval
        onward — before approval there is no entitlement to the Item's
        location.

        `overdue` is derived from passing the approved due date in
        `Europe/Dublin` calendar days, never a stored state: extending the
        due date clears it with no transition to undo.

        `cancellable` is advisory: it uses the same predicate the cancel
        command applies, so it may be stale but never disagrees in rule.
      required:
        - id
        - itemId
        - status
        - overdue
        - cancellable
        - requestedStartOn
        - requestedDueOn
        - approvedStartOn
        - approvedDueOn
        - checkedOutAt
        - returnedAt
        - requestNote
        - decisionNote
        - itemSlug
        - itemLabel
        - containerPath
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - requested
            - approved
            - rejected
            - cancelled
            - checked_out
            - returned
        overdue:
          type: boolean
          description: Derived, never stored.
        cancellable:
          type: boolean
          description: |
            Whether the borrower may still cancel (requested or approved).
            The cancel command re-decides under the item lock.
        requestedStartOn:
          type: string
          format: date
        requestedDueOn:
          type: string
          format: date
        approvedStartOn:
          type: string
          format: date
          nullable: true
        approvedDueOn:
          type: string
          format: date
          nullable: true
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
        returnedAt:
          type: string
          format: date-time
          nullable: true
        requestNote:
          type: string
          nullable: true
        decisionNote:
          type: string
          nullable: true
          description: |
            The rejection, cancellation, or approval note, including the
            system-authored note on an automatically rejected competing
            request.
        itemSlug:
          type: string
          description: Immutable snapshot captured at request time.
        itemLabel:
          type: string
          description: Immutable snapshot captured at request time.
        containerPath:
          type: string
          nullable: true
          description: |
            The Item's location, disclosed only from approval onward for
            collection.
        createdAt:
          type: string
          format: date-time
    InventoryMemberLoanListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - loans
            - totalCount
            - limit
            - nextCursor
            - previousCursor
          properties:
            loans:
              type: array
              items:
                $ref: "#/components/schemas/InventoryMemberLoan"
            totalCount:
              type: integer
              minimum: 0
              description: |
                Exact count of the Member's own Loans in the filtered set,
                never an estimate.
            limit:
              type: integer
              enum: [10, 25, 50, 100]
            nextCursor:
              type: string
              nullable: true
            previousCursor:
              type: string
              nullable: true
    InventoryMemberLoanResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryMemberLoan"
    InventoryMemberLoanConflictError:
      description: |
        409 conflicts on a member Loan command. Each is a domain conflict a
        losing racer receives instead of a server error. `item_unavailable`
        is deliberately generic — it never says who holds the Item or why.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - item_unavailable
                    - duplicate_request
                    - not_cancellable
    InventoryMemberLoanValidationError:
      description: |
        422 validation failures on a member Loan command.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - invalid_dates
                    - invalid_note
    InventoryOperatorLoan:
      type: object
      description: |
        One Loan as an operator sees it.

        Distinct from `InventoryMemberLoan`: this viewer names the
        borrower, always carries the Container path (snapshotted at
        approval), and includes deciding-operator and actual handover
        timestamps. It must never be handed to a member read.

        `itemSlug` and `itemLabel` are the immutable snapshots captured
        at request time. `overdue` is derived from passing the approved
        due date in `Europe/Dublin` calendar days, never a stored state.
      required:
        - id
        - itemId
        - borrowerPrincipalId
        - status
        - overdue
        - requestedStartOn
        - requestedDueOn
        - approvedStartOn
        - approvedDueOn
        - checkedOutAt
        - returnedAt
        - decidedAt
        - decidedByPrincipalId
        - returnedByPrincipalId
        - requestNote
        - decisionNote
        - itemSlug
        - itemLabel
        - containerPath
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        borrowerPrincipalId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - requested
            - approved
            - rejected
            - cancelled
            - checked_out
            - returned
        overdue:
          type: boolean
          description: Derived, never stored.
        requestedStartOn:
          type: string
          format: date
        requestedDueOn:
          type: string
          format: date
        approvedStartOn:
          type: string
          format: date
          nullable: true
        approvedDueOn:
          type: string
          format: date
          nullable: true
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
        returnedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decidedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        returnedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        requestNote:
          type: string
          nullable: true
        decisionNote:
          type: string
          nullable: true
        itemSlug:
          type: string
        itemLabel:
          type: string
        containerPath:
          type: string
          nullable: true
          description: |
            Snapshotted at approval. Always present on this viewer once
            the Loan has been approved; null while still requested.
        createdAt:
          type: string
          format: date-time
    InventoryOperatorLoanHandover:
      allOf:
        - $ref: "#/components/schemas/InventoryOperatorLoan"
        - type: object
          required:
            - readyForCheckout
          properties:
            readyForCheckout:
              type: boolean
              description: |
                Advisory: whether `checkout` would accept this Loan
                right now. The command re-decides under the item lock.
    InventoryOperatorLoanMaintenanceRow:
      type: object
      description: |
        One Item with an open Maintenance Period, as it appears in the
        operator queue. `itemLabel` is the derived catalog label.
      required:
        - id
        - itemId
        - itemSlug
        - itemLabel
        - startedAt
        - startedByPrincipalId
        - startReason
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        itemSlug:
          type: string
          nullable: true
        itemLabel:
          type: string
        startedAt:
          type: string
          format: date-time
        startedByPrincipalId:
          type: string
          format: uuid
          nullable: true
        startReason:
          type: string
          nullable: true
    InventoryOperatorLoanBucket:
      type: object
      required:
        - count
        - rows
      properties:
        count:
          type: integer
          minimum: 0
          description: Length of `rows`. Never a second aggregate.
        rows:
          type: array
          items:
            $ref: "#/components/schemas/InventoryOperatorLoan"
    InventoryOperatorLoanHandoverBucket:
      type: object
      required:
        - count
        - rows
      properties:
        count:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: "#/components/schemas/InventoryOperatorLoanHandover"
    InventoryOperatorLoanMaintenanceBucket:
      type: object
      required:
        - count
        - rows
      properties:
        count:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            $ref: "#/components/schemas/InventoryOperatorLoanMaintenanceRow"
    InventoryOperatorLoanQueue:
      type: object
      description: |
        The four work-list buckets. Unpaginated by design: each
        `count` is `length(rows)` of the bucket beside it.
      required:
        - pendingRequests
        - handoversDue
        - returnsAndOverdue
        - openMaintenance
      properties:
        pendingRequests:
          $ref: "#/components/schemas/InventoryOperatorLoanBucket"
        handoversDue:
          $ref: "#/components/schemas/InventoryOperatorLoanHandoverBucket"
        returnsAndOverdue:
          $ref: "#/components/schemas/InventoryOperatorLoanBucket"
        openMaintenance:
          $ref: "#/components/schemas/InventoryOperatorLoanMaintenanceBucket"
    InventoryOperatorLoanQueueResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryOperatorLoanQueue"
    InventoryOperatorLoanResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/InventoryOperatorLoan"
    InventoryOperatorLoanApproveRequest:
      type: object
      description: |
        Approve a pending request. Omitted dates keep the Member's
        requested values. The approved start may be in the past.
      properties:
        startsOn:
          type: string
          format: date
        dueOn:
          type: string
          format: date
        note:
          type: string
          maxLength: 1000
          description: Optional plain-text note. Blank means absent.
    InventoryOperatorLoanNoteRequest:
      type: object
      description: Optional operator note on reject or operator cancel.
      properties:
        note:
          type: string
          maxLength: 1000
          description: Optional plain-text reason. Blank means absent.
    InventoryOperatorLoanDatesRequest:
      type: object
      description: |
        Edit approved dates. Omitted dates are left as they are. The
        start is immutable after checkout.
      properties:
        startsOn:
          type: string
          format: date
        dueOn:
          type: string
          format: date
    InventoryOperatorLoanConflictError:
      description: |
        409 interlock and invalid-transition conflicts on an operator
        Loan command. Each is a domain conflict a losing racer or a
        wrong-state tap receives instead of a server error.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - not_pending
                    - not_approved
                    - not_checked_out
                    - not_editable
                    - item_unavailable
                    - already_allocated
                    - start_immutable
                    - outside_window
                    - maintenance_open
    InventoryOperatorLoanValidationError:
      description: |
        422 validation failures on an operator Loan command.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  enum:
                    - invalid_dates
                    - invalid_note
    InventoryContainerMoveRequest:
      type: object
      properties:
        parentContainerId:
          type: string
          format: uuid
          nullable: true
          description: |
            New parent container id, or null to make this a root container.
    Error:
      type: object
      description: |
        The one HTTP problem body (`DhcWeb.Problem`, ALE-343). Every error
        outside Invitation Acceptance's safe views and the Stripe webhook
        renders this shape. Slices that type their codes compose it with
        `allOf: [Error, {errors.code enum}]`.
      required:
        - errors
      properties:
        errors:
          type: object
          required:
            - detail
          properties:
            detail:
              type: string
              description: |
                Human-readable explanation. For a validation failure it is
                built from `fields` as `field: message; field: message`.
            code:
              type: string
              description: |
                The snake_case domain reason, present on 409 and 422 domain
                reasons only (e.g. `no_saved_payment_method`,
                `not_cancellable`, `duplicate_request`, `item_unavailable`).
                Absent on generic 400/401/403/404/5xx responses and on plain
                changeset validation failures.
            fields:
              type: object
              description: |
                Public camelCase field name → messages, placeholders filled
                in. Nested values use dotted paths (`values.<definitionId>`).
              additionalProperties:
                type: array
                items:
                  type: string
    MemberRolesConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [roles_changed, last_role_editor]
    MemberRolesValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [invalid_roles]
    ClubRole:
      type: string
      enum: [admin, president, treasurer, committee_coordinator, sparring_coordinator, workshop_coordinator, beginners_coordinator, quartermaster, pr_manager, volunteer_coordinator, research_coordinator, coach, member]
    MemberRolesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [roles, availableRoles]
          properties:
            roles:
              type: array
              items: { $ref: "#/components/schemas/ClubRole" }
            availableRoles:
              type: array
              items: { $ref: "#/components/schemas/ClubRole" }
    AuthCapability:
      type: string
      description: |
        A capability name from the `Dhc.Auth.Capabilities` registry, shared
        with the dashboard's `#lib/server/authorization` registry.
      enum:
        - beginners.waitlist.manage
        - beginners.waitlist.toggle
        - beginners.workshops.alerts.receive
        - beginners.workshops.assigned.read
        - beginners.workshops.lead
        - beginners.workshops.manage
        - beginners.workshops.run
        - discord.assignments.manage
        - discord.doctor.use
        - inventory.catalog.read
        - inventory.loans.own.read
        - inventory.manage
        - member_announcements.send
        - members.directory.read
        - members.invite
        - members.profile.read
        - members.profile.update
        - members.roles.edit
        - members.settings.edit
        - membership.reactivate
        - training_announcements.manage
        - workshops.manage
        - workshops.own.read
    AuthSessionProjection:
      type: object
      required:
        - data
      description: |
        The Phoenix session projection. The authoritative login identity
        (`principal.id` / `principal.email`) plus the current live roles and
        the capabilities they grant. No `is_active`, no raw token, no
        Supabase `sub`/bearer/refresh compatibility. This replaces the
        Supabase `Session` + `getUser()` projection on the dashboard.
      properties:
        data:
          type: object
          required:
            - principal
            - roles
            - capabilities
          properties:
            principal:
              type: object
              required:
                - id
                - email
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
            roles:
              type: array
              items:
                type: string
              description: |
                Current live roles from `user_roles`, loaded on every
                authenticated request.
            capabilities:
              type: array
              items:
                $ref: "#/components/schemas/AuthCapability"
              description: |
                Capabilities the roles grant without resource context, worked
                out by `Dhc.Auth.Capabilities` (ALE-344). Owner-scoped
                capabilities (`members.profile.*`) are listed only when a role
                grants them; the dashboard adds the owner rule itself.
