      type: object
      required:
        - pauseUntil
      additionalProperties: false
      properties:
        pauseUntil:
          type: string
          format: date-time
          description: Must be 1 day–6 months from now.
    MembershipReactivateRequest:
      type: object
      required:
        - startDate
      additionalProperties: false
      properties:
        startDate:
          type: string
          format: date
          description: |
            The date monthly billing begins (today or a future date, at most
            one year ahead). The first paid monthly invoice is prorated from
            this date through the first day of the following month, then full
            monthly periods bill from that anchor. How the annual fee starts is
            chosen separately via annualFeeMode.
        annualFeeMode:
          $ref: "#/components/schemas/MembershipReactivateAnnualFeeMode"
    MembershipReactivateAnnualFeeMode:
      type: string
      enum:
        - prorated_now
        - deferred_next_year
      default: prorated_now
      description: |
        How the annual membership fee begins.

        `prorated_now` keeps signup semantics: the annual fee is charged
        prorated for the remainder of this year at reactivation time, then
        renews each January anchor.

        `deferred_next_year` creates the annual subscription immediately with
        a free trial ending at next January's anchor: nothing is charged for
        the annual fee until then, and the subscription sits in `trialing`
        status — which the Stripe sync treats as covering the price, so the
        member stays active across sync runs.
    MembershipReactivatePaymentState:
      type: string
      enum:
        - succeeded
        - pending
        - needs_action
        - terminal
      description: |
        Off-session first-invoice payment outcome. SEPA Direct Debit settles
        asynchronously, so a healthy reactivation typically reports `pending`
        until `payment_intent.succeeded` arrives via webhook.
    MembershipReactivateResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - memberId
            - paymentState
            - monthlySubscriptionId
            - annualSubscriptionId
          properties:
            memberId:
              type: string
              format: uuid
            paymentState:
              $ref: "#/components/schemas/MembershipReactivatePaymentState"
            monthlySubscriptionId:
              type: string
              description: Stripe subscription id carrying the monthly membership price.
            annualSubscriptionId:
              type: string
              description: Stripe subscription id carrying the annual membership price.
    MembershipReactivationPreviewResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - memberId
            - savedPaymentMethod
            - membershipCoverage
          properties:
            memberId:
              type: string
              format: uuid
            membershipCoverage:
              type: object
              description: Current Stripe coverage for each membership fee.
              required:
                - monthly
                - annual
              properties:
                monthly:
                  type: string
                  enum: [active, lapsed]
                annual:
                  type: string
                  enum: [active, lapsed]
            savedPaymentMethod:
              nullable: true
              description: |
                Summary of the saved SEPA Direct Debit method a reactivation
                would charge. `null` when the customer has none; offer the
                billing portal as manual fallback instead of confirming.
              type: object
              required:
                - id
                - last4
                - country
              properties:
                id:
                  type: string
                  description: Stripe PaymentMethod id (pm_...).
                last4:
                  type: string
                  description: Last four digits of the SEPA account number.
                bankCode:
                  type: string
                  description: Bank code of the account (e.g. German BLZ), when Stripe reports one.
                country:
                  type: string
                  description: Two-letter ISO country code of the account.

    MembershipReactivationAmountsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: |
            Stripe-computed amounts for a reactivation under the requested
            annualFeeMode. Monthly billing is prorated from startDate through
            the first day of the following month. All values are
            Dinero-compatible minor-unit money objects.
          required:
            - dueToday
            - proratedMonthlyPrice
            - proratedAnnualPrice
            - monthlyFee
            - annualFee
          properties:
            dueToday:
              description: |
                Total charged immediately. The prorated monthly invoice is
                included when startDate is today; a future monthly start is
                charged on that date instead. The prorated annual invoice is
                included unless `annualFeeMode=deferred_next_year`.
              $ref: "#/components/schemas/DineroAmount"
            proratedMonthlyPrice:
              description: |
                First monthly charge, prorated from startDate through the first
                day of the following month. For a future start this amount is
                charged on startDate rather than included in dueToday.
              $ref: "#/components/schemas/DineroAmount"
            proratedAnnualPrice:
              description: |
                First annual charge, prorated through the next January anchor.
                Zero when annualFeeMode is deferred_next_year.
              $ref: "#/components/schemas/DineroAmount"
            monthlyFee:
              description: Recurring full monthly membership fee charged from the first day of the month following startDate.
              $ref: "#/components/schemas/DineroAmount"
            annualFee:
              description: |
                Full annual membership fee — charged at next January's anchor,
                either as a prorated remainder now plus renewals, or first at
                next January in deferred mode.
              $ref: "#/components/schemas/DineroAmount"

