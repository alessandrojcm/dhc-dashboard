<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Dublin Hema Club — Something went wrong</title>
	</head>
	<body>
		<!--
			Served when an error occurs outside the render tree (in the handle
			chain, a +server.js endpoint, or the root layout load), where no
			+error.svelte can render. Unexpected-error messages are redacted to
			"Internal Error" in production — full details go to the server
			console via logUnhandledServerError in hooks.server.ts.
		-->
		<main
			style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-family: system-ui, sans-serif; padding: 16px; text-align: center;"
		>
			<h1 style="margin: 0; font-size: 1.25rem;">Something went wrong</h1>
			<p style="margin: 0; color: #666; max-width: 32rem;">
				Status: %sveltekit.status% — %sveltekit.error.message%. The error has
				been logged on the server. Please try again in a moment.
			</p>
			<a
				href="/"
				style="color: inherit; text-decoration: underline; text-underline-offset: 4px;"
			>
				Back to home
			</a>
		</main>
	</body>
</html>
