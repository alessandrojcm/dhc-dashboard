name: Deploy Phoenix API to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-phoenix-fly
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_APP: ${{ vars.FLY_PHOENIX_APP || 'dhc-dashboard' }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # Deploy every main push, not only commits whose own diff touches Phoenix.
  # GitHub replaces pending runs even with cancel-in-progress: false. During
  # a merge burst, the surviving frontend-only commit must also deploy the
  # API changes from cancelled runs. Manual recovery must never be filtered.
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Check deployment workflow invariants
        run: node --test tools/deployment-workflow.test.mjs

      - name: Install email template dependencies
        run: pnpm install --frozen-lockfile --filter @dhc/email-templates... --ignore-scripts

      # flyctl uploads these gitignored files in the local Docker build context.
      # Keep email_shells out of .dockerignore; Phoenix embeds them at compile time.
      - name: Generate Phoenix email shells
        run: pnpm --filter @dhc/email-templates render:shells

      # Build on Fly's Depot builder, which provides persistent org-scoped
      # Docker layer caching across builds (vs --remote-only's pooled builder,
      # which may hand you a cold VM with no cache). The mise toolchain is
      # installed inside the Dockerfile during the remote build, so there's
      # no need for mise on the GitHub runner.
      - name: Deploy Phoenix release
        run: flyctl deploy --app "${FLY_APP}" --depot
