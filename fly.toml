app = "dhc-dashboard"
primary_region = "lhr"
kill_signal = "SIGTERM"

[build]
  dockerfile = "apps/phoenix/Dockerfile"

[deploy]
  release_command = "fnox exec --profile production -- /app/bin/dhc eval 'Dhc.Release.migrate()'"

[env]
  APP_URL = "https://dashboard.dublinhemaclub.com"
  AUTH_SESSION_DOMAIN = ".dublinhemaclub.com"
  DNS_CLUSTER_QUERY = "dhc-dashboard.internal"
  ECTO_IPV6 = "falseg"
  FNOX_IF_MISSING = "error"
  FNOX_PROFILE = "production"
  PHX_HOST = "dhc-dashboard.fly.dev"
  PHX_SERVER = "true"
  POOL_SIZE = "5"
  PORT = "8080"
  CORS_ALLOWED_ORIGINS = "https://dashboard.dublinhemaclub.com"
  DISCORD_REDIRECT_URI = "https://api.dublinhemaclub.com/api/auth/discord/callback"
  # ALE-299 Web Push: uncomment together with WEB_PUSH_VAPID_PRIVATE_KEY in
  # fnox.toml (all three or none). See apps/phoenix/README.md §5.
  # WEB_PUSH_VAPID_PUBLIC_KEY = "<base64url public key from mix web_push_ex.vapid>"
  # WEB_PUSH_VAPID_SUBJECT = "mailto:contact@dublinhemaclub.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/api/health"
